    - { id: G2-PF-05, platform: copilot, check: "No-license fallback per module: core brief plus one job card plus one knowledge text stays under 8,000 characters (mb-01). Measure each kit" }
    - { id: G2-PF-06, platform: all, check: "Knowledge file count at the end of the course is 16 or fewer (limit 20 on ChatGPT Plus and Copilot). Count per case/README.md: 1 core instructions, 5 job cards, 10 case files. Source pack, quote, evidence log, validated problem backlog and confidential terms list are run files or brief text. Counts by module: 4, 8, 11, 14, 16" }

fallback_case:   # Placeholder. The case builder fills it in Stage 2. Gate 2 locks the records and results
  status: built by the case builder (case/README.md). Case date late November 2027, plan year 2028 (Gate 2 Q6). Details below are the planning notes
  company: >-
    Larkspan Systems (fictional), reused from Market Research (Gate 1 decision j). Wireless temperature sensors
    (hardware) and the cloud software that watches them. External PMs own Probe, Hub, Tag and Cloud. An internal PM
    owns the Fleet Data Platform. Source: courses/market-research/case/company.md. Copy what this course needs into
    courses/product-strategy-and-planning/case/. Do not change the Market Research case
  folder: courses/product-strategy-and-planning/case/
  rules:
    - One company for the whole course. Every module and exercise uses it
    - All data fictional and marked "Fictional data for training"
    - No scored backlog. No scoring attributes or weights anywhere (decision d)
    - The Strategy Matrix may get one mention in the strategy overview. No lab uses it
    - No number in the case is a course standard. Each range or threshold is framed as "the Larkspan PM's choice for this rule"
    - Each planted error passes the agent's own checks and hand-off rules; only the audit finds it
    - Each sheet ships as .xlsx (one sheet each), a Google Sheet template and a CSV copy. Each file 30 MB or less
    - Each .md knowledge file has a .txt copy for Copilot
    - Not BadgeWorks, Entrilo, FieldPro, DeepView AI, PulseVision or FieldAssist
  new_strategy_inputs:   # Gate 1 decision j
    strategy_overview: >-
      A short (1 page) Larkspan 2028 product strategy overview: where to play (segments), how to win, 3 or 4 strategic
      choices (for example grow Pharmacy and lab, move Distribution sites from hub to cellular, cut install cost per
      site, grow recurring Cloud revenue), and what Larkspan will not do. One mention of the Strategy Matrix is allowed
    okrs: 3 objectives for 2028 H1, each with 2 or 3 key results with baselines and targets, owned by named roles (no personal names)
    kpis: 5 to 7 business metrics with current value and target (for example Cloud attach rate, install days per site, active paid sites, gross margin by product, field failure rate)
  records_per_lab:
    m1: >-
      Strategy, OKRs and KPIs (one knowledge file). Capacity sheet. m1-submissions-q3 (5 programs: Probe X cellular,
      Hub firmware, Cloud compliance reports, Tag 2, Fleet Data Platform), m1-status-q3 (one status mismatch), capacity
      by team with the shared firmware team at 100% in Probe X and Hub firmware (planted), one program with no clear
      link to an objective, m1-submissions-q4, m1-check-sample (shared test lab in two programs), last quarter's pack
    m2: >-
      Problem backlog with evidence (no scores; the last column evidence_order ranks by amount of market evidence and is not a priority). Request decision log (past decisions with reasons and conditions,
      including last year's "no" on offline mode for field installers). Current roadmap (themes and items with
      timeframes). m2-requests-batch-1 (8 to 10 requests: sales, an executive ask, customers, support, and internal
      requests to the Fleet Data Platform from Support, Install and Finance; two "offline mode" requests with different
      problems, planted). m2-check-sample ("custom alerts" from two different users)
    m3: >-
      Business case for Probe X cellular before the hard tooling commit (volumes, unit cost, price, margin, launch
      window). Business case sheet with formulas. Source pack: one link per number for market, market segment and
      evaluator adoption; projected share from Larkspan internal sales data only. A supplier quote whose lower price needs a minimum yearly order of 50,000 sets
      against an 18,000 set year 1 plan (planted). m3-evidence-q4 (new evidence for the refresh).
      m3-check-sample (antenna module quote with a minimum order above plan volume)
    m4: >-
      Validated problem backlog and evidence log (run files; the problems the Larkspan PM has validated, with evidence). Release plan (dated
      commitments for the next 2 releases, including Hub firmware OTA rollback). Roadmap decision log. RM-14 backed by one
      sales request inside a strong theme (planted). m4-change-request-cr-07 (from an approved module 2 request; it
      displaces a release plan item and needs the shared firmware team). Confidential terms list for the case PM.
      m4-check-sample (a change request with "ships in Q2" for an item not on the release plan)
    m5: >-
      Outcome sheet. Business case baseline and success measures (from m3). m5-metrics-oct and m5-metrics-nov (site
      activations, units shipped to resellers, Cloud attach, install days). "Active paid Probe X sites" reported from
      units shipped (planted). m5-check-sample (attach rate next to trials started)
  expected_results: case/expected-results.md (instructor only). One second sample and pass condition per lab. Catch-up kit state files
  instructor_files: case/planted-errors.md and case/expected-results.md. Do not give them to learners

gate_2_designs:   # Designs Dan asked to see. Both decided at Gate 2 (2026-11-26). Options tables removed
  ps_10:
    title: "PS-10: the full module 4 roadmap design and the release plan hand-off rule"
    status: "Decided by Dan, Gate 2 decision 1, 2026-11-26. Option A. Module 4 text stays as written"
    what_the_pm_owns: The roadmap is direction (themes and timeframes). The release plan is the promise (dated commitments the delivery team owns). The agent works on the roadmap and never edits the release plan
    inputs:
      - { input: Current roadmap, source: "case m2 roadmap, already in the agent (not sent again)", holds: "Outcome themes and items with timeframes (any format the PM uses, PS-05)" }
      - { input: Validated problem backlog, source: "case m4 run file", holds: "Problems the PM has validated, each with its evidence and dates" }
      - { input: Evidence log, source: "case m4 run file", holds: "Each evidence record with account, source type and date. Items and problems link to it by id" }
      - { input: Strategy, OKRs and KPIs file, source: module 1, holds: "Stated objectives each item must trace to" }
      - { input: Capacity table, source: module 1 pack, holds: "Team capacity, shared teams, current allocation" }
      - { input: Request decision log, source: module 2, holds: "Past decisions, and the PM's yes on REQ-112 that became CR-07" }
      - { input: Release plan, source: case m4, holds: "Dated commitments for the next 2 releases" }
      - { input: Roadmap decision log, source: case m4, holds: "Past roadmap changes with date, decider and reason" }
      - { input: Confidential terms list, source: "the PM, in the brief", holds: "Terms that must not appear in text for people outside the team (decision e, written in lab 4)" }
    agent_steps_in_order:
      part_a_refresh:
        - "1. Read every roadmap item, the validated problem backlog and the evidence log"
        - "2. Trace each item to a theme, a validated problem and a stated objective. Write \"no trace\" where a link is missing"
        - "3. Show each item's trace table: theme, linked validated problem, objective"
        - "4. List validated problems that no item traces to. Do not group them, name themes or advise. The PM decides which reach the product backlog, on merit and impact"
        - "5. Flag: no trace, theme with no item, item in two themes, and any item below a rule the PM has written (after the audit, the own-evidence rule)"
      part_b_change:
        - "6. Read the change request. Restate it in one line with its source (here, CR-07, from REQ-112, which the PM approved in the module 2 request job)"
        - "7. Find what it displaces in the same timeframe, using the capacity table"
        - "8. Find dependency hits: shared teams, hardware components, suppliers, other internal teams"
        - "9. Check the release plan. If any displaced or changed item is on it, apply the release plan hand-off rule the PM wrote"
        - "10. Run the commitment guard on all agent text: any date, \"will ship\", \"committed\" or \"available in\" not on the release plan; any confidential term in text for people outside the team"
        - "11. Write the impact note and a decision log entry with the decision field blank"
        - "12. Send the flag report to the PM"
    handoff_rule:
      decided: "Dan, Gate 2 decision 1, 2026-11-26. Option A"
      name: Stop and hand to the PM and the release plan owner
      rule_text: >-
        If a change moves, removes or changes the scope of any item on the release plan, stop. Write the impact note.
        Mark it "Release plan change: PM and release plan owner decide". Do not write a new date. Do not edit the
        release plan. Hand the change to the PM and the person who owns the release plan (the Delivery lead in the Larkspan case)
      why: >-
        It keeps the release plan as the only promise. It teaches 2.4C ("Distinguishes between roadmap direction,
        assumptions, dependencies, and committed delivery"). It matches workbook 3.4 AI text ("Estimates and commitments
        are verified with delivery teams"). The PM must take the item to the release plan owner outside the agent
    sample_flag_report:   # Illustrative, case-like. Not the planted error. Change request CR-07, Larkspan
      - "RELEASE PLAN CHANGE. CR-07 (approved request REQ-112: calibration certificate export for Pharmacy and lab) needs the shared firmware team in Q1. It displaces Hub firmware OTA rollback, which is on release plan R-2028.1 (dated 2028-02-15). Agent stopped. PM and delivery lead decide. No new date written."
      - "COMMITMENT GUARD. The CR-07 request text says \"ships in Q2\". Q2 is not on the release plan for this item. The phrase is not in the impact note. Source: CR-07, VP Sales, 2027-11-18."
      - "DEPENDENCY. CR-07 needs a Larkspan Cloud interface change and asks 10% of the Cloud team in Q1 2028. The Q4 capacity table shows the Cloud team at 95% before CR-07 and 105% with CR-07. Release plan items RP-02 and RP-03 use the Cloud team in Q1. PM decides the trade-off."
      - "PAST DECISION. Request decision log DL-2027-09 put calibration export at \"later\" with the condition \"Three pharmacy chains ask\". The roadmap decision log records it as RL-2027-05. The request records now show 2 chains (A-5101, A-5120). PM decides if the condition is met."
      - "CONFIDENTIAL TERM. The impact note quotes the antenna supplier name, which is on your confidential terms list. The note is marked \"Share with the Delivery lead and the Support lead\". PM decides before it is shared."
    what_the_pm_decides:
      - Accept, defer or reject CR-07, and the reason (written in the decision log entry)
      - Whether to take the release plan change to the release plan owner, and what to ask
      - Which untraced validated problems go to the product backlog, on merit and impact (no grouping, no theme required)
      - The trade-off for displaced work and shared teams
      - Whether the "later" condition is met
      - Which roadmap items stay or leave, and the theme wording
    what_is_not_in_the_lab: Audience versions of the change (decision c, option 1). One talk track line says audience notes are a separate step
    timing_fit: Lab 30 minutes (28 in half days). Refresh and audit about 13 minutes; change assessment, flags and decision log about 15 minutes; 2 minutes slack. Stage 3 confirms in the card test
  decision_e:
    title: "Decision e: data safety in the classroom, minute by minute for one lab"
    status: "Decided by Dan, Gate 2 decision 2, 2026-11-26 (option B with one change)"
    chosen_design: >-
      A 3-question data check card above step 1 of every step card. A log keep choice at each log save card. In lab 4
      only, the PM writes a confidential terms list and the commitment guard checks it. The lab 4 talk track says the
      agent is a second check, not the control, and that it misses paraphrases. A take-home Production readiness
      checklist (data_safety_note) tells learners to test the agent with data science, privacy and compliance teams
      before production use. No agent intake scan: the data is already in the tool when the agent scans it
    example_lab: Lab 1 (33 minutes in the full day). It is the first lab, so the data safety habit is taught here
    minute_by_minute_lab_1:
      - { minute: "0 to 2", learner_sees: "Data check card above step 1: (1) Is this tool approved by my company for this data? (2) Does my file hold client data, health data, personal data, unreleased roadmap or release dates, forecasts, pricing, supplier terms or non-public financials? (3) If 2 is yes and 1 is no, use the Larkspan case or remove names and numbers first", learner_checks: "Their own file against question 2", learner_decides: "Own work or case. Writes the choice on the evidence sheet" }
      - { minute: "2 to 6", learner_sees: "Step 1. The template brief and the strategy inputs", learner_checks: "That the brief and files are in the agent", learner_decides: "Nothing yet" }
      - { minute: "6 to 10", learner_sees: "Step 2. The Q3 run", learner_checks: "Totals and links", learner_decides: "Nothing yet" }
      - { minute: "10 to 16", learner_sees: "Step 3. The flag report", learner_checks: "Each flag", learner_decides: "Each flag" }
      - { minute: "16 to 24", learner_sees: "Step 4. Audit of 2 shared teams and 3 linked items", learner_checks: "Capacity sums and links", learner_decides: "What the audit found" }
      - { minute: "24 to 28", learner_sees: "Step 5. Brief edit", learner_checks: "The new quality check", learner_decides: "The check wording" }
      - { minute: "28 to 33", learner_sees: "Step 6. The Q4 run", learner_checks: "The Q4 pack and flag report", learner_decides: "Fund, pause or stop calls (finished in the debrief)" }
      - { minute: "debrief, 1 minute", learner_sees: "Log save card: what the pack log keeps", learner_checks: "The log for names, spend and dates", learner_decides: "Keep totals and decisions; delete or keep names, by company rule" }
    later_labs: >-
      Labs 2 to 5 keep the data check card (about 1 minute; most learners repeat their lab 1 choice) and the log keep
      decision. Lab 4 adds the confidential terms list (about 2 minutes, outside the 6 steps) and the guard line, which the
      sample flag report in ps_10 shows. The lab 4 debrief says the agent is a second check, not the control, and hands
      out the Production readiness checklist. The card test checks the 2 minutes

capability_mapping:   # Confirmed by Dan, Gate 2 Q2, 2026-11-26. Primary source: Pragmatic_Capability_Standards_Workbook_2027.xlsx (read-only, project files), sheets Skill Standards, Skill Navigator, Framework Reference. Read 2026-11-26
  status: confirmed by Dan, Gate 2 Q2, 2026-11-26. Tell the Pragmatic reviewer the gaps (OI-12)
  source: >-
    Capability Standards Workbook 2027 (project files, reference/pragmatic-sources/). Names copied exactly. Two
    competency names are split across cells in the workbook ("2.1B Explicit vs. Implicit | Strategy Analysis", "2.4D
    Alignment to Market | Problems and Strategy"); the full names are joined here, as the research files also do
  capability: "2 Strategic Direction"
  capability_text: "The standard for how an organization turns market evidence into product strategy, prioritized opportunities, business cases, and roadmaps."
  capability_ai_text: "Uses AI to pressure-test strategic choices, model scenarios, and surface assumptions across moats, build/buy/partner, distribution, and pricing, while keeping trade-offs and final investment decisions human-owned."
  rule: No skill or competency is invented. Where the workbook gives no name, write "Dan to name" (none needed in this draft)
  per_module:
    - module: 1
      skills: [2.1 Strategy Alignment]
      competencies: ["2.1B Explicit vs. Implicit Strategy Analysis"]
      fit: >-
        2.1B workbook text: "comparing what leaders say the organization is prioritizing with where resources, products,
        and attention are really being invested". This is the module 1 strategy consistency check. Full fit, not a light form
      box: "Focus / Product Portfolio. Workbook: no primary skill; 2.1 and 2.2 are secondary. 2.1's primary box is Market / Product Strategy"
      not_taught: ["2.1C Strategy Matrix Application (Dan, row 01: no Strategy Matrix)", "2.1A Strategic Definition (the PM brings the strategy; the course does not teach writing it)"]
    - module: 2
      skills: [2.2 Opportunity Prioritization (AI text only), "1.1 Market Problem Identification (supporting)", "2.1 Strategy Alignment (supporting)"]
      competencies: ["2.2E Opportunity Comparison and Decision Support (light form, no scoring)", "1.1A Problem vs. Opinion Discrimination", "2.1D Opportunity-to-Strategy Fit Evaluation (the PM judges fit; the agent only quotes the strategy text)"]
      box: "Market / Market Problems. Workbook: primary 1.1 and 1.3; 2.2 is secondary"
      gap: >-
        2.2A Attribute Selection and Definition, 2.2B Scoring Model Design, 2.2C Weighting and Priority Logic and 2.2D
        Calibration and Consistency are not covered (scoring is out, decision d). 2.2E workbook text says "Uses scoring
        outputs"; this course uses evidence cards instead. Tell the Pragmatic reviewer
    - module: 3
      skills: [2.3 Business Case Development]
      competencies: ["2.3B Market Value and Sizing", "2.3C Cost, Profit, and Resource Logic"]
      box: "Business / Business Plan. Workbook: primary 2.3"
      not_taught: ["2.3A Product Canvas Development (no Product Canvas in this course)", "2.3D Distribution and Solution Delivery Fit", "2.3F Stakeholder Argumentation (the gate recommendation is a debrief item, not a practiced step; dropped after the critic)"]
    - module: 4
      skills: [2.4 Product Vision and Roadmap]
      competencies: ["2.4B Roadmap Structuring and Framing", "2.4C Assumption and Uncertainty Transparency", "2.4D Alignment to Market Problems and Strategy"]
      fit: >-
        2.4C workbook text: "Distinguishes between roadmap direction, assumptions, dependencies, and committed delivery".
        This is the release plan hand-off rule and the commitment guard
      box: "Focus / Product Roadmap. Workbook: primary 2.4; secondary 2.1 and 3.4"
      not_taught: ["2.4A Strategic Vision Articulation", "2.4E Stakeholder Communication and Alignment (no audience drafting, decision c)"]
      boundary: >-
        Release plan changes touch 3.4 Release Planning and Delivery Management (competencies 3.4B Roadmap-to-Release-Plan
        Alignment and 3.4D Change and Tradeoff Management). Not claimed. The hand-off rule sends them to the release plan owner
      gap: 2.4 AI text "simulate sequencing and dependency scenarios" is covered only as dependency hits
    - module: 5
      skills: [2.3 Business Case Development]
      competencies: ["2.3E Success Definition and Measurement"]
      box: "Business / Business Outcomes. Workbook: no primary skill; 2.2 and 2.3 are secondary"
  coverage_note: Every capability 2 skill has at least one module. 2.3 has two (modules 3 and 5). 2.2 is covered through its AI text and 2.2E only
  box_note: Two of five module boxes (Product Portfolio, Business Outcomes) have no primary skill in the workbook. The mapping uses 2.1 and 2.3 as secondary skills on them
  for_pragmatic_reviewer: Put this mapping and its gaps in the packet for the Pragmatic reviewer document (stage-2-inputs.md section 5)

glossary:
  - { term: agent manager, meaning: "The learner's role. Writes the brief, sets checks and hand-off rules, reviews the flag report, audits, decides" }
  - { term: Strategy Evidence Agent, meaning: "The one course agent (name final). Built in module 1, one new job per module" }
  - { term: job, meaning: "One workflow the agent runs (portfolio pack, requests, business case, roadmap, outcome tracking). One job card per job" }
  - { term: brief, meaning: "The agent's instructions: job, inputs, quality checks, hand-off rules, output format, done criteria" }
  - { term: quality check, meaning: "A test the agent runs on its own output before it reports" }
  - { term: hand-off rule, meaning: "A rule that says when the agent stops and gives an item to the PM, or what passes from one job to the next. Any number in it is the PM's choice" }
  - { term: flag report, meaning: "The short list of items the agent hands to the PM to decide. Never a recommended action" }
  - { term: audit, meaning: "The PM checks a random sample of agent output against its sources and numbers" }
  - { term: tuned brief, meaning: "The brief after the PM adds a check or rule for what the audit found" }
  - { term: decision field, meaning: "The field on a card or log entry that only the PM fills. The agent leaves it blank" }
  - { term: strategy consistency check, meaning: "Module 1. Shows where planned work and capacity go by stated objective, and lists work with no clear link. Evidence only, no judgment" }
  - { term: problem backlog, meaning: "Where a team tracks unsolved market problems and the evidence for each. It feeds the product backlog. Never 'opportunity backlog'" }
  - { term: validated problem backlog, meaning: "The problems the PM has validated by the PM's own rule, with evidence. Input to the roadmap refresh. Never 'Market Problems Table'" }
  - { term: decision card, meaning: "Module 2. One card per request: the problem behind it, the linked problem, strategy or OKR text that may relate (quoted, or 'none found', no fit statement), past decisions, and a blank decision field" }
  - { term: request decision log, meaning: "Past requests with the PM's decision, reason and any condition for 'later'" }
  - { term: assumption register, meaning: "Module 3. Each business case assumption with evidence, date, owner, low, base and high values, and its effect on the result" }
  - { term: red team, meaning: "A deliberate challenge of the assumptions with the largest effect. It tests evidence. It does not recommend a decision" }
  - { term: market, meaning: "All buyers who have the problem the product solves. Defined in this course" }
  - { term: market segment, meaning: "A group within the market with shared needs that the team can reach. Defined in this course" }
  - { term: evaluator adoption, meaning: "The share of the segment expected to evaluate or adopt a solution of this kind. Defined in this course" }
  - { term: projected share, meaning: "The share of the segment the team expects to win. Comes only from the PM's internal data" }
  - { term: denominator, meaning: "The base a share or rate is measured against. Every share names it" }
  - { term: roadmap, meaning: "Direction: outcome themes and timeframes. Not a promise" }
  - { term: release plan, meaning: "The promise: dated commitments the delivery team owns. The agent never edits it" }
  - { term: commitment guard, meaning: "Module 4. A standing check on every change: any date or promise not on the release plan, and any confidential term in text for outside the team, goes to the flag report" }
  - { term: decision log, meaning: "Roadmap changes with date, decider and reason" }
  - { term: outcome, meaning: "A change in customer or business results that the business case promised" }
  - { term: output, meaning: "Work the team produced or shipped. Not success on its own" }
  - { term: confidential terms list, meaning: "Terms the PM lists in the brief that must not appear in text for people outside the team" }
  - { term: data check card, meaning: "Three questions above step 1 of each card: approved tool, sensitive data, own work or case" }
  - { term: production readiness checklist, meaning: "Take-home list. Before anyone relies on the agent for real work, test it with data science, privacy and compliance teams. It lists what to test and who signs off" }
  - { term: evidence order, meaning: "A column in the problem backlog. It orders problems by amount of market evidence. It is one input, not a priority. The PM also weighs strategy, capacity, dependencies and other factors" }
  - { term: request batch, meaning: "One set of requests the agent reads in one run. Intake can be frequent. The agent only logs and flags" }
  - { term: cadence, meaning: "How often the PM reviews something, such as the problem backlog (often once a quarter). The PM sets it in the brief. Reviewing too often causes whiplash" }
  - { term: product backlog, meaning: "The work the team plans to build. A problem from the problem backlog can enter on its merit and impact, with or without a theme" }
  - { term: epic, meaning: "A large piece of work that solves part of a problem. One epic breaks into many user stories. One problem can become one or more epics" }
  - { term: user story, meaning: "One small piece of work, written from the user's view: who needs what, and why. A team can finish it in one cycle" }
  - { term: minimum yearly order, meaning: "Bulk pricing: the supplier gives the lower price per unit only above a set yearly order. Like a seat license or an API plan tier. Module 3 error" }
  - { term: catch-up kit, meaning: "The brief text, files and sheets at the start of a module. Rebuild in about 5 minutes" }
  - { term: planted error, meaning: "One AI error placed in each lab's case data. Learners find it in the audit" }
  - { term: rung, meaning: "A step on the autonomy ladder" }
  - { term: category and box, meaning: "Pragmatic Framework 2027 category and focus area. Say category, not life cycle stage" }
  - { term: planning, meaning: "In the title: annual and quarterly product planning. Not the Framework category 'Planning'" }

voice:
  tone: Practical, direct, peer to peer with experienced PMs. Real examples. Explain jargon once
  writing: ASD-STE100 for directions, 20 words or fewer per sentence, one action per step, no em dashes or en dashes
  examples_from: [software, FinTech, health care, manufacturing, hardware (priority), services, internal product management (priority)]
  stories: Story slots use stories from client teams, executives and Pragmatic's work with companies. Never the instructor's own experience (decision 43)
  talk_track: Complete enough for an instructor who did not build the course (decision 45). Slide notes are POINT then Talk Track. Activity talk tracks start "The goal of this activity is"
  terms_never_used:
    - exceptions, escalations as agent terms (Pragmatic focus area names; say flags, flag report, hand-off rules). Quoted survey wording is the only use
    - opportunity backlog, Market Problems Table (say problem backlog, validated problem backlog)
    - the phrase "no magic number" in any learner-facing text (say "you set the rules in the brief"). "The PM's bar" (say "the range you set in the brief")
    - scoring attributes, weights, rescoring, RICE (not taught or mentioned)
    - Strategy Matrix in any lab
    - Callbacks such as "as in Focus" or any callback that assumes a core course
    - Now, Next, Later as a required format (say timeframes; PS-05)
    - Gems, custom GPTs (say Gemini skills, ChatGPT Projects)
    - Playbook method (not taught)
    - life cycle stage or pdlc_stage with learners (say category)
  claims_on_slides: >-
    No E9 (draft, permission needed). No E10. No RICE (PS-15). E1 wording "54% vs 36%". E2 Science version only. E3
    numbers off slides until a licensed copy is read. W3 and N21 always with "fieldwork Q4 2025". W1 figures off slides
    until W2 is opened. W14 is not a PM statistic. Stats need a 2026 primary source

