- id: sp-wf-05
  workflow: Keep the business case assumption register current and red-team it before each decision point
  topic_area: Strategy, roadmaps, planning
  capability_skill: 2.3 Business Case Development (competencies 2.3C Cost, Profit, and Resource Logic and 2.3F Stakeholder Argumentation)
  trigger_and_cadence: Before each funding or stage gate decision, and when evidence for a key assumption changes. Assumption, quarterly
  input: The current business case or Product Canvas, the assumptions behind revenue, cost and adoption, new evidence since the last version
  output: An assumption register (each assumption, its evidence, date, owner, and its effect on the result), a red-team note on the assumptions that move the result most, a 'what changed' note, and a flag report
  pm_decision_informed: Whether the case still holds at the next decision point, and which assumptions to test next
  bottleneck:
    description: Business cases go stale during execution, and teams rarely recheck the original assumptions. Forecasts lean optimistic, most of all on revenue growth, and few organizations back-test them in a structured way
    pdlc_stage: Business
    focus_area: Business Plan
    sources:
    - W14
    - W15
    sources_check: pass, weak. W14 (2026) and W15 are independent. W14 polls valuation practitioners, not PMs, sample not stated. W15 is older than 12 months; Dan decides
  scores:
    judgment: high. Accepting an assumption is a judgment
    repetition: medium. Each decision point and each evidence change
    ai_candidate: partly. The agent keeps the register and runs the arithmetic; the PM owns the case
  split:
    agent_does:
    - List every assumption in the case
    - Link each to its evidence and date
    - Compute how much each assumption moves the result (low, base, high)
    - Red-team the assumptions that move the result most
    - Report what changed since the last version
    - Send flags to the PM
    pm_manages:
      brief: Job, the case file, the model, the ranges to test, the evidence rules, output format
      quality_checks:
      - Each assumption has evidence, a date and an owner
      - Each assumption has a low, base and high value
      - The red-team note covers the assumptions ranked highest by effect
      handoff_rules:
      - An assumption with no evidence, or evidence older than the set age
      - An assumption whose evidence changed since the last version
      - Any result that flips sign (profit to loss) inside the tested range
      audit: 'The 2 assumptions with the largest effect: read their evidence in full'
    pm_decides:
    - Which assumptions to accept
    - What goes to stakeholders
    - Whether to continue, change or stop
    ai_error_to_catch: Evidence that supports a different claim. The adoption assumption links to a survey of stated interest, not a pilot with real use, so the evidence field is filled and dated. The checks pass. The audit reads the evidence for the top assumption and finds it does not support the number
  contexts:
    hardware: Partial. W15 lists production and supply chain uncertainty as business case assumptions to recheck; W6 says hardware kill triggers should come from the program's original business case assumptions. Both weak (W15 aged, W6 vendor)
    internal_pm: Partial. W23 (New Zealand Treasury) covers business cases for internal digital and equipment investments. Public sector, not product management
    industry_notes:
    - 'FinTech and health care: regulatory approval timing is often the largest assumption. Not yet researched'
