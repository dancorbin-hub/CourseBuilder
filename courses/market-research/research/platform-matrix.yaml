    use_in_core_lab: "no"
    url: https://help-lb.openai.com/en/articles/10291617-scheduled-tasks-in-chatgpt
    source_date: approx 2026-11-02 (page says "updated 18 days ago")
    checked_on: 2026-11-20
    status: not verified
