  workflow: Keep a buy, build or partner option pack current for each open capability decision
  topic_area: Strategy, roadmaps, planning
  capability_skill: 2.3 Business Case Development (secondary box Buy, Build or Partner; the 2.1 AI text also names build and buy choices)
  trigger_and_cadence: Each new capability question, then a refresh when a vendor changes price, model or terms. Assumption, a few times a year per product
  input: The capability need, the evaluation criteria, vendor and partner documents, internal cost rates and team capacity
  output: 'An option pack: each option with dated vendor facts, 3-year total cost (build, buy, run), lock-in and data risks, and a flag report'
  pm_decision_informed: Whether to build, buy, partner or combine, and when to revisit
  bottleneck:
    description: Teams treat build or buy as a first-invoice cost question. The real cost is running, governing and securing the system over time, and with AI a fast prototype looks like a finished capability. Vendor models and prices change on the vendor's schedule, so the pack goes stale
    pdlc_stage: Business
    focus_area: Buy, Build or Partner
    sources:
    - W16
    - W17
