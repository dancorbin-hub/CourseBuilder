decisions_for_dan:
  - id: DD-01
    question: PS-10. Which release plan hand-off rule goes into module 4?
    options: ["A: stop and hand to the PM and the delivery lead", "B: report and continue", "C: draft a release plan delta for the delivery team"]
    recommendation: A
    reason: See gate_2_designs.ps_10. The release plan stays the only promise; the agent writes no new date
  - id: DD-02
    question: Decision e. Which classroom data safety design?
    options: ["A: note only", "B: data check card, confidential terms list and a log keep decision", "C: B plus an agent intake scan"]
    recommendation: B
    reason: See gate_2_designs.decision_e. The real decision happens before upload. About 3 minutes in lab 1, 1 minute later
  - id: DD-03
    question: Decision g. What title question do we ask Pragmatic?
    options:
      - "1: Keep \"Advanced AI for Product Strategy and Planning\" with the line \"Planning here means annual and quarterly product planning. The course maps to Capability 2, Strategic Direction.\""
      - "2: Offer \"Advanced AI for Product Strategy and Roadmaps\" as an alternative, which avoids the Framework category name"
      - "3: Offer \"Advanced AI for Product Strategy and Portfolio Planning\""
    recommendation: "1, and ask Pragmatic: \"Does 'planning' in the title conflict with the Framework category Planning for your reviewers or learners? If yes, do you prefer option 2 or 3?\""
    reason: Dan already chose to keep the title (decision g). The question lets Pragmatic flag a conflict without reopening the decision
  - id: DD-04
    question: Course agent name?
    options: ["Strategy Evidence Agent", "Planning Evidence Agent", "Portfolio and Roadmap Agent"]
    recommendation: Strategy Evidence Agent
    reason: It says the agent handles evidence, not strategy. That matches Dan's rule that the agent never sets strategy
  - id: DD-05
    question: Half-day module lengths. Day 2 holds modules 3 to 5 in 175 minutes, 15 fewer than the full day. Accept the shorter modules?
    options:
      - "A: module 3 65, module 4 60, module 5 50 (all 6 card steps kept; debrief discussion trimmed)"
      - "B: split after module 3 instead (day 1 would need 200 module minutes in 155; does not fit)"
      - "C: day 2 open of 5 minutes, giving module 5 55 minutes (reopen check gets 5 minutes, risky for Copilot and Gemini)"
    recommendation: A
    reason: Keeps the split on the rung boundary (hand-run on day 1) and every lab step. Times can flex in delivery (Market Research lesson). Module 5 at 50 minutes is the tightest module; the card test checks it
  - id: DD-06
    question: Which planted error for module 3? (one per lab)
    options:
      - "A: tooling quote volume tier does not match the plan (row 11, hardware)"
      - "B: adoption assumption backed by stated interest, not real use (row 05)"
      - "C: market size scope mismatch between two sources (row 03)"
    recommendation: A
    reason: Hardware is a priority context. The sheet recompute passes, so only reading the evidence finds it. B is close to the Market Research concept test error that moved here. C overlaps the Focus market sizing agent risk (OI-06)
  - id: DD-07
    question: >-
      Design choice that touches Dan's rule "the agent never proposes strategy". In module 4 the 2.4 AI text says
      "cluster validated problems into outcome themes". May the agent group new validated problems into candidate clusters?
    options:
      - "A: yes, as unnamed candidate clusters; the PM names and decides every theme"
      - "B: no clustering; the agent only traces existing items and lists untraced validated problems"
    recommendation: A
    reason: Themes are roadmap structure, not strategy, and the PM writes every theme. If Dan reads clustering as proposing direction, B keeps the lab whole with one fewer agent step
  - id: DD-08
    question: Course aha. Dan's theme "win/loss is a big aha" belongs to Market Research. What is this course's aha?
    options:
      - "A: module 1, the shared team at 200% that every per-program check passed"
      - "B: module 5, the launch that looked on track because units shipped stood in for active sites"
    recommendation: A
    reason: It lands early, in the told lab, and shows why the PM's audit matters before any strategy talk. B can be the closing echo
  - id: DD-09
    question: Module 2 rung. The PM decides every flagged card, so module 2 is a hand-run batch with a decision checkpoint (rung 1 plus), not a recurring run. Accept?
    options: ["A: rung 1 plus (as drafted)", "B: call it rung 2 recurring weekly run and have the PM decide only flagged cards"]
    recommendation: A
    reason: It is honest about how much the PM reads. The ladder still climbs (1, 1 plus, 2, 3, 3 plus)
