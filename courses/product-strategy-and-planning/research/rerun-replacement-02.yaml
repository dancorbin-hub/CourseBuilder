    source: '2026 State of Competitive Intelligence: What Sets the Best Programs Apart, Shannon De Marco, Crayon blog'
    url: https://www.crayon.co/blog/state-of-competitive-intelligence-2026
    source_date: '2026-07-08'
    checked_on: '2026-11-26'
    age_flag: false
    status: not verified
    note: 'CI software vendor reporting its own survey of hundreds of CI and revenue leaders. Sales focus. No product-side finding. Not counted'
