    source: "Workbook SKILL 6.4; Pragmatic-Framework-2027-Guide.pdf pages 13, 22"
    severity: medium
    why_it_matters: "Dan moved the row here at Market Research Gate 1. This log does not reopen the move. New: in this course the row has no capability 2 home, so Pragmatic reviewers may see Design course scope. The row's method (observed behavior over stated preference) matches 6.4, so there is no message conflict."
    options:
      align_with_pragmatic: "Do not build a lab for sp-wf-04. Keep it as a candidate for a future Design-aligned Advanced AI course."
      update_message_ai_changed_work: "Fold the row into sp-wf-05: concept test results become one evidence input to the assumption register (2.3), with the denominator check as a quality check. Not its own lab."
      keep_both_explain: "Keep it as its own row tagged 6.4 and explain in the spec why a strategy course uses it."
    recommendation: update_message_ai_changed_work
    recommendation_reason: "It keeps Dan's decision (the work stays in this course) and keeps every lab inside capability 2. The row also fails the 2-source rule, so a full lab is the weakest choice."
    dan_decision: ""

  - id: PS-09
