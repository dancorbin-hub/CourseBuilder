# Workflow inventory row: the schema every Stage 1 researcher fills.
# One row = one PM workflow. Two variations of one task count as one row.
# The approved worked example is in courses/market-research/research/worked-example-row.yaml.

id: ""                    # <course>-wf-NN
workflow: ""              # verb + object, in PM words
topic_area: ""            # course topic area it belongs to
trigger_and_cadence: ""   # what starts it and how often it happens

input: ""                 # what the PM starts with
output: ""                # what the workflow makes
pm_decision_informed: ""  # the decision the output feeds

bottleneck:
  description: ""         # where the time goes, and why it is a bottleneck
  pdlc_stage: ""          # where in the product development life cycle it slows work
  sources: []             # 2 independent sources that describe the bottleneck itself (evidence ids)

scores:
  judgment: ""            # low | medium | high, with one line of reason
  repetition: ""          # low | medium | high, with one line of reason
  ai_candidate: ""        # yes | partly | no. Low judgment + high repetition = yes

split:
  ai_does: []             # the low-judgment, high-repetition steps
  pm_keeps: []            # the decisions that stay with the PM
  ai_error_to_catch: ""   # one specific, likely AI error the PM must catch

contexts:                 # how the workflow works in each client context. "gap" if research found nothing
  hardware: ""            # priority
  internal_pm: ""         # priority
  software: ""
  fintech: ""
  health_care: ""
  services_manufacturing: ""

proposed_lab:
  goal: ""                # one goal, no platform named
  core_message: ""        # the 1 thing learners must take away
  build_type: ""          # skill | project | agent
  core_path_no_connectors: ""   # yes, and how
  platforms:
    claude: ""
    chatgpt: ""
    copilot: ""           # Copilot agent builder
  stretch: ""             # optional steps for platforms that can do more
  registry_check: ""      # overlap with AI Agents course, workshops, other courses

evidence:                 # ledger entries this row uses
  - id: ""
    claim: ""
    type: ""              # statistic | claim | tool-feature
    source: ""            # title, publisher
    url: ""
    source_date: ""       # YYYY-MM-DD
    checked_on: ""        # YYYY-MM-DD
    age_flag: false       # true when the source is older than 12 months
    status: ""            # verified | partly verified | not verified
    note: ""              # population, sample, limits

open_gaps: []
gate_1_decision: ""       # retain | defer | reject (Dan only)
