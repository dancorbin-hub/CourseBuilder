    platform: chatgpt
    feature: Downloadable file output (for example .xlsx or .docx from a project chat)
    plans: unknown
    limits: unknown
    use_in_core_lab: "no"
    url: https://help-lb.openai.com/en/articles/8555545-file-uploads-faq
    source_date: approx 2026-11-15
    checked_on: 2026-11-20
