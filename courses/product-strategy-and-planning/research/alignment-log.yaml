traced_example:
  item: sp-wf-08 pragmatic_fit
  research_says: "Good fit. The 2.4 AI text says the AI 'must not convert uncertain direction into false delivery commitments'. This row's planted error tests exactly that"
  pragmatic_says:
    - quote: "Uses AI to cluster validated problems into outcome themes, simulate sequencing and dependency scenarios, and tailor roadmap narratives. It must not convert uncertain direction into false delivery commitments."
      source: "Pragmatic_Capability_Standards_Workbook_2027.xlsx, sheet Skill Standards, SKILL 2.4 Product Vision and Roadmap, AI-embedded application column (wb.txt line 998)"
    - quote: "A roadmap is a prediction. It's not a promise. It's not a commitment. That's for the release plan."
      source: "FCS_28.01_DRAFT_v6_Full.pptx, slide 112 notes (fcs.txt line 4634 onward)"
    - quote: "Choose a format that allows flexibility, such as dated, undated or hybrid timelines."
      source: "Pragmatic-Framework-2027-Guide.pdf, page 9, Product Roadmap"
  method:
    - "Find the skill the row names (2.4) in the workbook sheet Skill Standards."
    - "Copy the AI-embedded text word for word. Compare it with the quote inside the research sentence."
    - "Read the Focus slides the row's registry_check names (roadmap vs release plan, One Roadmap Two Audiences)."
    - "Read the Framework box for the row's own tag and the primary box (Product Roadmap, Stakeholder Management)."
    - "Check that the planted error is a false delivery commitment by the Pragmatic definition."
  result: "Match on the quote. The words in the research are exact. The fit claim holds: Focus and the workbook both say a roadmap is direction and the release plan is the commitment."
  extra_check: "The planted error needs care. The row treats 'Q2' as a false commitment because it is not a horizon word. But Focus says only 'Timeframe, not delivery date' and does not define timeframes, and the Framework guide allows 'dated' roadmaps. A Focus graduate can read 'Q2' as a valid timeframe. The error that Pragmatic clearly names is a date or promise that is not on the release plan. See PS-05. The row also repeats a Build demo agent, see PS-02."

conflicts:
  - id: PS-01
    item: "sp-wf-01 quarterly strategy drift check repeats a Focus 28.01 AI use case and a Focus demo agent"
    research_says: "registry_check: 'It also has a tip to use AI to check roadmap updates against the Strategy Matrix and OKRs. This row starts where Focus stops ... Risk: the Focus tip is close; Dan to confirm.' agent_does: 'Map each epic or project to one strategic choice ... Total effort and spend per choice ... Compare with last quarter'"
    pragmatic_says: "Focus slide 25 notes: 'Give it your roadmap, your backlog, or your headcount by team. Ask it to show you where your investment is actually going.' Slide 28 notes: 'This is a perfect job for a strategy alignment agent. Give it your Strategy Matrix and your OKRs once. Then it checks every new PRD, plan, or roadmap update and flags work that doesn't align.' Slide 28 note: 'the Strategy Alignment agent is built and maintained by the SME. Instructors run it; it is not shared with learners.' Strategy AI Capability Map, YELLOW: 'Map current work to show where investment goes / List gaps between implicit and explicit strategy / Check PRDs and roadmaps for strategic drift'"
    source: "FCS_28.01_DRAFT_v6_Full.pptx slides 25, 26, 28 and the Strategy AI Capability Map (fcs.txt lines 1066 to 1232, 1390 to 1430)"
    severity: high
    why_it_matters: "The research says Focus has only a 'tip'. In fact Focus has the same job (map work to show where investment goes), the same drift flag, and an agent demo. Dan is the named Focus instructor, so the demo agent is likely his. House rule 11 says course labs must be clearly stronger builds than Dan's existing agents. Focus graduates will see the module 1 lab as a repeat."
    options:
      align_with_pragmatic: "Drop sp-wf-01 as a lab. Refer to the Focus drift check in one sentence and move the course agent's module 1 job to sp-wf-09 (portfolio pack), which Focus does not cover."
      update_message_ai_changed_work: "Keep the row but make the new part the lesson: quarterly trend, effort and spend totals that must reconcile, a 'must do' category, tag-only mapping flags and the label laundering audit. State in class: 'In Focus you saw an agent flag drift. Here you manage one: you set its checks and audit it.' Dan confirms how it differs from his Strategy Alignment agent."
      keep_both_explain: "Keep the row as written. Tell Focus graduates the concept is the same and the data is different."
    recommendation: update_message_ai_changed_work
    recommendation_reason: "The workbook 2.1B competency fits this row exactly, and the 'Apply' level asks to compare explicit and implicit strategy 'systematically'. The agent-manager parts are new. Option 2 needs Dan to compare his Focus demo agent with the row before Gate 2. Consider merging with sp-wf-09 (same data), which also lowers the repeat."
    dan_decision: ""

  - id: PS-02
    item: "sp-wf-08 per-audience change notes repeat the Build Stakeholder Update Agent demo and the Focus Roadmap Translator demo"
    research_says: "agent_does: 'Draft one note per audience from the master change record ... Check each note against the master record'. registry_check: 'Build 28.01 has AI-drafted stakeholder updates and release planning. This row starts after: change-triggered impact analysis, a decision log and consistency across audiences'"
    pragmatic_says: "Build slide 'Demo: The Stakeholder Update Agent': 'Every Friday, the agent drafts one update for each stakeholder. Each one is in that stakeholder's channel and at their depth.' Rules on the slide: 'Key stakeholders and important updates: you approve before send / Routine updates: send, then spot-check / Risky, unsure or needs guidance: the agent stops and alerts you'. Build 'Workflows Teams Automate Today': 'Roadmap: when a group is done, the agent moves it to the release plan and drafts the roadmap update. You check the dates and the commitments before anyone sees them.' Focus slide 110 notes: 'run the Roadmap Translator agent'. Focus slide 111: 'One Roadmap, Two Audiences'"
    source: "BLD_28.01_DRAFT_v1.pptx Stakeholder Update Agent slide (bld.txt lines 872 to 909) and slide 117 (bld.txt lines 3040 to 3060); FCS_28.01_DRAFT_v6_Full.pptx slides 110, 111 (fcs.txt lines 4520 to 4631)"
    severity: high
    why_it_matters: "Two core courses already show an agent that drafts per-audience updates, with approval and stop rules that look like our hand-off rules. Build also shows an agent that drafts the roadmap update and a person who checks dates and commitments. That is close to the sp-wf-08 audit. Learners who took Build and Focus will see a third version."
    options:
      align_with_pragmatic: "Remove per-audience drafting from the row. Keep only the impact note and decision log. Point to Build for stakeholder updates."
      update_message_ai_changed_work: "Make the change assessment the core: what the change displaces, dependency hits, capacity, and a decision log, with the commitment guard (S8) against the release plan. Per-audience notes become one short step that reuses the Build idea by name, with no new slides on tailoring or approval tiers."
      keep_both_explain: "Keep the row as written and add a talk track line on how it differs from the Build and Focus demos."
    recommendation: update_message_ai_changed_work
    recommendation_reason: "The impact analysis and decision log are not in Build or Focus, and the workbook 2.4 AI text ('simulate sequencing and dependency scenarios') supports them. Keep hand-off rules, but teach them with new slides only (house rule 14). Dan should confirm whether he built the Build and Focus demo agents; if yes, house rule 11 applies."
    dan_decision: ""

  - id: PS-03
    item: "Scoring criteria: methods.md S1 says to use different criteria than Focus"
    research_says: "methods.md S1 No-repeat note: 'Focus 28.01 teaches the 4-attribute scoring table as a one-pass activity. Here the PM manages an agent that rescores over time. Use different criteria and a different case.' S1 also uses '1 to 5 scales' (matches Focus). sp-wf-02 error text uses 'Impact to buyers' and 'Competitive landscape'"
    pragmatic_says: "Focus slide notes: 'Focus uses four default attributes: Distinctive Competencies, Competitive Landscape, Impact to Buyers and Users, and Investment Level.' 'The method we'll explore is a simple 1-5 scoring.' Focus also says: 'There are many possible scoring attributes. Pick the ones that matter most to your organization.' Workbook 2.2: 'using attributes such as distinctive competencies, competitive landscape, impact to buyers and users, and investment level'"
    source: "FCS_28.01_DRAFT_v6_Full.pptx Opportunity Scoring slides (fcs.txt lines 1543, 1568 to 1570, 1634 to 1645); Workbook SKILL 2.2"
    severity: high
    why_it_matters: "House rule 9 forbids the same exercise, not the same method. A different default set of attributes would teach Focus graduates a second scoring method for the same job and confuse them. The rows and methods.md also disagree with each other."
    options:
      align_with_pragmatic: "The course template and fallback case use the 4 Focus attributes with their exact names and the 1 to 5 scale. Learners who have their own model use it, as Focus allows. Change S1's note to 'Same model, different job and different case'. Fix 'Impact to buyers' to 'Impact to Buyers and Users'."
      update_message_ai_changed_work: "Use new attributes that fit agent rescoring (for example evidence freshness) and explain why in class."
      keep_both_explain: "Use different attributes in the case and add a slide that maps them to the Focus 4."
    recommendation: align_with_pragmatic
    recommendation_reason: "The no-repeat rule is met by the agent job (rescoring over time, sensitivity, consistency, override log), not by new criteria. One method across courses is easier for learners and Pragmatic reviewers."
    dan_decision: ""

  - id: PS-04
    item: "Who sets the final scores, and agent runs used as 'scorers' for calibration (sp-wf-02, methods.md S4)"
    research_says: "sp-wf-02 agent_does: 'Score new items and rescore items with new evidence'. pm_decides: 'The attributes, scales and weights ... What advances, pauses or stops' (final scores not named). methods.md S4: 'Gets 2 independent score sets for the same items. Options: the agent and the PM; 2 stakeholders; or 2 fresh agent runs.'"
    pragmatic_says: "Focus Score AI Capability Map, YELLOW: 'Draft first-pass scores with reasoning'. RED: 'Set the attribute weights / Agree on the final opportunity scores'. Workbook 2.2 AI text: 'Weights and final priorities remain transparent, calibrated, and human-owned.' Competency 2.2D: 'Improves scoring consistency across team members by reviewing examples, discussing differences, and aligning on how scores should be assigned.'"
    source: "FCS_28.01_DRAFT_v6_Full.pptx Score AI Capability Map (fcs.txt lines 2605 to 2642); Workbook SKILL 2.2 and 2.2D"
    severity: medium
    why_it_matters: "If the agent writes the scores that go to the decision, the row moves a Focus RED item to the agent. Calibration in Pragmatic is a team conversation; two agent runs are a model consistency test, not calibration."
    options:
      align_with_pragmatic: "Label all agent scores 'draft scores'. Add 'Agree on the final scores' to pm_decides. In S4, use 'the agent and the PM' or '2 stakeholders' as the core path. Two agent runs is an extra test, not calibration."
      update_message_ai_changed_work: "Keep agent-set scores and use the override log as the human control. Explain that AI changed who drafts the score."
      keep_both_explain: "Keep the row and explain the Focus RED line in class."
    recommendation: align_with_pragmatic
    recommendation_reason: "Small wording change. It keeps the workbook rule whole, and the override log still works on draft scores."
    dan_decision: ""

  - id: PS-05
    item: "sp-wf-08 horizon words 'Now, Next, Later' and the planted error that treats 'Q2' as a false commitment"
    research_says: "quality_checks: 'Each note uses the roadmap horizon words (Now, Next, Later), not new dates'. ai_error_to_catch: 'the agent turns Next into Q2 ... Q2 is not a horizon word but is accepted as a time frame'"
    pragmatic_says: "Focus slide 108: 'Criteria for a Pragmatic Roadmap / Outcome, not output / Timeframe, not delivery date / Problems, not features'. Notes: 'It should also use timeframes and not specific delivery dates. Those dates live on the release plan.' Focus slide 106: a release plan covers 'often a few weeks to a couple of months'; a roadmap 'might span 3 to 5 years'. Framework guide page 9: 'Choose a format that allows flexibility, such as dated, undated or hybrid timelines.' Page 13: 'customers want clear timelines for features or upgrades.' Neither source uses Now, Next, Later."
    source: "FCS_28.01_DRAFT_v6_Full.pptx slides 106, 108; Pragmatic-Framework-2027-Guide.pdf pages 9, 13"
    severity: medium
    why_it_matters: "Pragmatic does not ban quarters on a roadmap; a quarter can be a timeframe. The Pragmatic test is whether a date or promise is on the release plan. A Focus graduate may say the planted error is not an error. Now, Next, Later is a non-Pragmatic term."
    options:
      align_with_pragmatic: "The brief names the timeframes the PM uses (any format). The check is the S8 commitment guard: flag any date, 'will ship' or 'committed' that is not on the approved release plan. New planted error: the sales note says 'ships in Q2' for an item that is on the roadmap but not on the release plan."
      update_message_ai_changed_work: "Keep Now, Next, Later and explain that AI drafts pull dates from past notes, so undated horizons are safer."
      keep_both_explain: "Keep the row. In class, say Now, Next, Later is one undated format among those the guide allows."
    recommendation: align_with_pragmatic
    recommendation_reason: "It keeps the same lesson and the same audit, and uses Focus's own rule: 'the roadmap is the vision, the release plan is the promise'."
    dan_decision: ""

  - id: PS-06
    item: "sp-wf-03 market size model: method and the word 'layer' differ from the Focus bubble diagram; Focus Market Sizing agent demo"
    research_says: "output: 'A top-down and bottom-up size model'. agent_does: 'Build top-down and bottom-up estimates'. ai_error_to_catch: 'Layer mixing ... a second estimate that measures a different layer (end-use value, not vendor revenue)'. registry_check: 'Focus 28.01 teaches TAM, segment and projected share as a one-pass exercise'"
    pragmatic_says: "Focus slide 73 notes: 'The bubble diagram sizes the market in four layers and documents every assumption.' Bubbles: Market, Market Segment, adoption of category (also called 'Evaluator Adoption'), Your Projected Share. 'The first three bubbles are top-down. Projected Share is bottoms-up', from sales capacity and history. Slide 74 notes: 'see the Market Sizing agent do the research.' Propose AI Capability Map RED: 'Set Projected Share without internal data'. YELLOW: 'Estimate market layers and revenue ramps'."
    source: "FCS_28.01_DRAFT_v6_Full.pptx slides 70, 73, 74 and the Propose AI Capability Map (fcs.txt lines 2780 to 3035, 4181 to 4200)"
    severity: medium
    why_it_matters: "Focus graduates know 'layers' as the 4 bubbles and 'bottoms-up' as projected share from internal data. The row uses both words with other meanings, and the planted error is named after the clashing word. Focus also has a Market Sizing agent demo."
    options:
      align_with_pragmatic: "Build the model on the 4 Focus bubbles. Top-down sources feed the first 3 bubbles; projected share comes only from the PM's internal data (hand-off rule). Rename the error 'scope mismatch' or 'value-chain mix'."
      update_message_ai_changed_work: "Keep top-down and bottom-up as two whole-market estimates and explain that agents make triangulation cheap."
      keep_both_explain: "Keep the row and add one slide that maps the two methods."
    recommendation: align_with_pragmatic
    recommendation_reason: "The new parts (source basis checks, refresh, what-changed note, audit) still fit inside the bubble method. Dan should confirm how the row differs from his Market Sizing demo agent (house rule 11)."
    dan_decision: ""

  - id: PS-07
    item: "Course title word 'planning' vs the Framework category 'Planning'"
    research_says: "stage-1-inputs.md and needs.md flag the collision. Only 2 of 10 rows are in the Planning category: sp-wf-04 (Ideation) and sp-wf-08 (Stakeholder Management). The other 8 rows are Market, Focus and Business. Annual and quarterly planning rows sit in Focus / Product Portfolio and Product Roadmap"
    pragmatic_says: "Guide page 12: 'Planning: What are we building, for whom, and why? Planning turns strategy into direction teams can act on. Positioning, personas and the buyer journey ... Requirements and ideation ... stakeholder management.' Core Course maps (pages 21, 22): Planning boxes belong to Foundations (Positioning), Build (User Personas, Requirements, Stakeholder Management), Market (Buyer Journey, Buyer Personas) and Design (Ideation). Workbook capability 2 is named 'Strategic Direction'."
    source: "Pragmatic-Framework-2027-Guide.pdf pages 12, 21, 22; Workbook CAPABILITY 2"
    severity: medium
    why_it_matters: "Pragmatic reviewers and Focus graduates may expect the course to cover the Planning category (positioning, personas, requirements). It does not, and should not, because other core courses own those boxes."
    options:
      align_with_pragmatic: "Rename the course to avoid the word, for example 'Advanced AI for Product Strategy and Roadmaps' or 'Advanced AI for Strategic Direction'. This changes the PRD topic name, so it needs Dan's PRD change."
      update_message_ai_changed_work: "Not applicable. AI did not change the term."
      keep_both_explain: "Keep the title. Add one line to the spec and the course description: 'Planning here means annual and quarterly product planning. The course maps to capability 2, Strategic Direction.' In learner text, tag rows by box, not by the word Planning."
    recommendation: keep_both_explain
    recommendation_reason: "The PRD uses the title, and the meaning is common in industry. Ask Pragmatic at Gate 2 if they prefer a rename. If Pragmatic says yes, option 1 is cheap before Stage 3."
    dan_decision: ""

