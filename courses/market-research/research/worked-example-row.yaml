# Worked example workflow row, version 2. Approved by Dan on 2026-11-20.
# Review doc: https://claude.ai/artifact/NADMs5axGsw8DWPju1g8tp
# Schema: shared/templates/workflow-row.yaml. Checked on 2026-11-20.
# v2: the learner manages an agent that runs the whole workflow (Dan, 2026-11-20).
# v3: no magic number. Agent reports frequency, intensity and impact; PM sets the bar (Dan, Gate 1 comments, 2026-11-21).

id: mr-wf-01
workflow: Turn each new batch of buyer interviews into an updated, checked insight log
topic_area: Research, buyer and market insight
trigger_and_cadence: Each new batch of market visits, win/loss calls or discovery interviews. Assumption, every 2 to 6 weeks

input: Notes or transcripts from 5 to 15 interviews, plus the current insight log
output: Updated insight log (insights coded by theme, problem, persona and segment; for each, frequency in interviews, intensity with the quote that shows it, and impact clues; verbatim quotes and source interviews), a "what changed" summary, and a flag report for the PM
pm_decision_informed: Which market problems go forward to prioritization, and for which segment

bottleneck:
  description: Synthesis takes days per study, so insight reaches the roadmap late. AI cuts the analysis time, but the work moves to checking AI output
  pdlc_stage: Market
  focus_area: Market Problems
  sources: [E4, E10, E5]   # E1 kept as a vendor note (Dan, Gate 1 b, 2026-11-22)

scores:
  judgment: medium. Coding is rule-based; deciding what a pattern means needs the PM
  repetition: high. Same steps for each interview and each batch
  ai_candidate: yes. The agent runs the whole workflow; the PM manages it by checks and flags

split:
  agent_does:
    - Code each interview against the code book
    - Check each quote against the source text
    - Merge new insights into the log
    - Mark problems as new, growing or fading
    - Send flags to the PM
  pm_manages:
    brief: Job, inputs, code book, output format, done criteria
    quality_checks:
      - Each quote is found word for word in its source interview
      - Each insight counts interviews, not quotes, by persona and segment
      - Each insight shows frequency, intensity (with quote) and impact clues
    handoff_rules:
      - Notes that fit no code
      - A new insight that contradicts the log
      - An insight below the PM's bar: label "emerging" or "single source". Keep it in the log for trend tracking. Do not drop it or call it a pattern
    audit: 3 random insights per batch, checked against the source interviews
  pm_decides:
    - The code book
    - Which patterns are real problems
    - Which segment matters
    - What goes forward to prioritization
  ai_error_to_catch: One vocal buyer counted as a pattern. Three real quotes from one interview make an insight look strong. The quote check passes; only the audit finds it. The fix is a new rule in the brief, count interviews, not quotes, and the PM sets the bar for a pattern. There is no magic number; product judgment decides (Dan, 2026-11-21)

contexts:
  hardware: Field visits, distributor, installer and service technician interviews. gap, no source yet
  internal_pm: Interviews with employees who use an internal platform or tool. gap, no source yet
  industry_notes:
    - "health care: remove patient data (PHI) before the agent reads the notes. Not yet researched"
    - "FinTech: customer quotes can hold account data (PII, PCI). Not yet researched"

proposed_lab:
  goal: Delegate interview synthesis to an agent, and manage it by its checks and flags
  core_message: Do not do the work between AI steps. Set the job, the checks and the hand-off rules, then review the flags
  build_type: agent (skill or project that holds the brief, code book and output format)
  core_path_no_connectors: yes. The learner uploads a batch and runs the agent
  data_safety: "Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)"
  platforms:
    claude: Skill or Project with the brief and code book
    chatgpt: Project with the brief and code book (E9 not verified)
    copilot: Agent in Copilot agent builder with the brief and the code book as an embedded file
    gemini: Gemini skill with the brief and code book. For Workspace, Gemini app skills are available to all Workspace customers per the Workspace Updates blog (gm-03, 2026-09-30, updated 2026-11-09); business Gems are removed from March 2027. Test on a Workspace account at Gate 2
  steps:
    - Copy the agent brief template. Fill in the job, the code book and the output format
    - Add two quality checks and two hand-off rules from the menu
    - Build the agent on your platform. Run it on batch 1
    - Read only the flag report. Decide each item
    - Audit 3 random insights against the interviews. Fix the brief for what you find
    - Run batch 2. Check the log and the "what changed" summary
  stretch: Run the agent on a schedule or when files arrive, where the platform allows (not verified for 2027)
  planted_error: Vocal buyer counted as a pattern
  success_check: Batch 2 run. The log updates, the flag report lists the new contradiction, and no insight below the PM's bar is called a pattern
  registry_check: "AI Agents course teaches boundaries, exit conditions and guardrails (slides 37 to 39, 57, 58). This lab refers to them and teaches what is new, managing a running agent by flags, audits and tuning. Not a repeat of CAW-AI buyer voice watch (Dan, 2026-11-20). PDW-AI (Product Discovery with AI) already teaches one-pass AI synthesis, the quote check and frequency vs intensity. The lab starts where PDW-AI stops: no slides on coding or quote checks; time goes to running the agent on batches, the log over time, the flag report, the audit and tuning (Dan, 2026-11-20)"
  pragmatic_fit: Good fit (Dan, 2026-11-20). Pragmatic Framework 2027 says to talk with evaluators who bought and who did not, then validate, prioritize and share the problems. It also says teams must verify AI output, protect sensitive information and stay accountable

