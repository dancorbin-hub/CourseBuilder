    stretch: Rerun when a linked evidence file changes, where the platform allows (not verified)
    planted_error: Adoption assumption backed by stated-interest evidence
    success_check: The register ranks assumptions by effect and the audit finds the planted evidence mismatch
    registry_check: 'Focus 28.01 teaches value types, the Product Canvas and a one-pass AI Value and Cost Snapshot, plus risks stakeholders raise. This row starts after the canvas exists: a register over time, sensitivity and red-team at each decision point. Intro to AI and AI in Your Product map to 2.3; check they do not run an assumption register. No workshop overlap'
