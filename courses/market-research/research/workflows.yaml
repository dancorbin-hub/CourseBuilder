# Workflow inventory, Advanced AI for Market Research (track 1, Stage 1 run 1).
# Schema: shared/templates/workflow-row.yaml. Written 2026-11-20 by the workflow researcher.
# Row 01 is the approved worked example (worked-example-row.yaml), copied unchanged.
# Evidence ids W<n> are for the evidence researcher to merge. E<n> ids belong to row 01.
# gate_1_decision is for Dan only.

- id: mr-wf-01
  workflow: Turn each new batch of buyer interviews into an updated, checked problem backlog
  topic_area: Research, buyer and market insight
  trigger_and_cadence: Each new batch of market visits, win/loss calls or discovery interviews. Assumption, every 2 to 6 weeks

  input: Notes or transcripts from 5 to 15 interviews, plus the current problem backlog
  output: Updated problem backlog (problems coded by theme, persona and segment, each with an evidence profile and fact labels, verbatim quotes and source interviews), a proposed ranking with reasons, a "what changed" summary, and a flag report for the PM. See worked-example-row.yaml v4
  pm_decision_informed: Which market problems go forward to prioritization, and for which segment

  bottleneck:
    description: Synthesis takes days per study, so insight reaches the roadmap late. AI cuts the analysis time, but the work moves to checking AI output
    pdlc_stage: Market
    focus_area: Market Problems
    sources: [E4, E10, E5]   # E1 kept as a vendor note (Dan, Gate 1 b, 2026-11-22)

  scores:
    judgment: medium. Coding is rule-based; deciding what a pattern means needs the PM
    repetition: high. Same steps for each interview and each batch
    ai_candidate: yes. The agent runs the whole workflow; the PM manages it by checks and flags

  split:
    agent_does:
      - Code each interview against the code book
      - Check each quote against the source text
      - Merge new problems into the backlog
      - Propose a ranking with a reason for each problem
      - Mark problems as new, growing or fading
      - Send flags to the PM
    pm_manages:
      brief: Job, inputs, code book, output format, done criteria
      quality_checks:
        - Each quote is found word for word in its source interview
        - Each problem counts interviews, not quotes, and shows urgency, pervasiveness and willingness to pay clues
      handoff_rules:
        - Notes that fit no code
        - A new problem that contradicts the backlog
        - If all quotes for a problem come from 1 interview, send it to the flag report ("single source", kept for trend tracking)
        - A segment with no PM-held interview (PA-02)
      audit: 3 random problems per batch, checked against the source interviews
    pm_decides:
      - The code book
      - The order of problems, what is a pattern and what goes to validation
      - Which segment matters
      - What goes forward to prioritization
    ai_error_to_catch: One vocal buyer ranked near the top. Three real quotes from one interview make a problem look strong. The quote check passes; the evidence profile and the audit find it. The fix is a new hand-off rule, if all quotes for a problem come from 1 interview, send it to the flag report. No fixed bar (Dan, Gate 2 decisions 1 and 9, 2026-11-22)

  contexts:
    hardware: Field visits, distributor, installer and service technician interviews. gap, no source yet
    internal_pm: Interviews with employees who use an internal platform or tool. gap, no source yet
    industry_notes:
      - "health care: remove patient data (PHI) before the agent reads the notes. Not yet researched"
      - "FinTech: customer quotes can hold account data (PII, PCI). Not yet researched"

  proposed_lab:
    goal: Delegate interview synthesis to an agent, and manage it by its checks and flags
    core_message: Do not do the work between AI steps. Set the job, the checks and the hand-off rules, then review the flags
    build_type: agent (skill or project that holds the brief, code book and output format)
    core_path_no_connectors: yes. The learner uploads a batch and runs the agent
    data_safety: "Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)"
    platforms:
      claude: Skill or Project with the brief and code book
      chatgpt: Project with the brief and code book (E9 not verified)
      copilot: Agent in Copilot agent builder with the brief and the code book as an embedded file
      gemini: Gemini skill with the brief and code book. For Workspace, Gemini app skills are available to all Workspace customers per the Workspace Updates blog (gm-03, 2026-09-30, updated 2026-11-09); business Gems are removed from March 2027. Test on a Workspace account at Gate 2
    steps:
      - Copy the agent brief template. Fill in the job, the code book and the output format
      - Add two quality checks and two hand-off rules from the menu
      - Build the agent on your platform. Run it on batch 1
      - Read only the flag report. Decide each item
      - Audit 3 random insights against the interviews. Fix the brief for what you find
      - Run batch 2. Check the log and the "what changed" summary
    stretch: Run the agent on a schedule or when files arrive, where the platform allows (not verified for 2027)
    planted_error: Vocal buyer counted as a pattern
    success_check: Batch 2 run. The log updates, the flag report lists the new contradiction, and no insight rests on one interview
    registry_check: "AI Agents course teaches boundaries, exit conditions and guardrails (slides 37 to 39, 57, 58). This lab refers to them and teaches what is new, managing a running agent by flags, audits and tuning. Not a repeat of CAW-AI buyer voice watch (Dan, 2026-11-20). PDW-AI (Product Discovery with AI) already teaches one-pass AI synthesis, the quote check and frequency vs intensity. The lab starts where PDW-AI stops: no slides on coding or quote checks; time goes to running the agent on batches, the log over time, the flag report, the audit and tuning (Dan, 2026-11-20)"
    pragmatic_fit: Good fit (Dan, 2026-11-20). Pragmatic Framework 2027 says to talk with evaluators who bought and who did not, then validate, prioritize and share the problems. It also says teams must verify AI output, protect sensitive information and stay accountable

  evidence:
    - id: E1
      claim: Median time to synthesize themes fell from 14 days (2024) to 4 hours (Q1 2026)
      type: statistic
      source: 2026 Customer Discovery Velocity Report, Perspective AI
      url: https://s.getperspective.ai/blog/2026-customer-discovery-velocity-report-ai-cut-time-to-insight-94-percent
      source_date: 2026-05-18
      checked_on: 2026-11-20
      age_flag: false
      status: "partly verified, weak"
      note: Vendor of an AI interview tool. Own panel of 180 teams, Jan to Apr 2026. Baseline method not stated. Do not put on a slide
    - id: E2
      claim: Analysis fell from 12.1 to 1.1 days per 30-interview study; a new "synthesis QA" step takes 0.6 days
      type: statistic
      source: 2026 AI Research Productivity Report, Perspective AI
      url: https://s.getperspective.ai/blog/2026-ai-research-productivity-report-time-to-insight-cut-84-percent
      source_date: 2026-05-12
      checked_on: 2026-11-20
      age_flag: false
      status: "verified, weak"
      note: Same vendor as E1, so not an independent source. Uses own customer data. Some figures do not reconcile
    - id: E3
      claim: 80% of senior product leaders use AI to run or synthesize user research; 34% heavily
      type: statistic
      source: State of Product Leadership Q2 2026, Delight Path, reported by Lyssna
      url: https://www.lyssna.com/blog/product-leaders-ai-research-survey/
      source_date: 2026-07-10
      checked_on: 2026-11-19
      age_flag: false
      status: "verified"
      note: 107 leaders. Primary report not yet opened
    - id: E4
      claim: With AI synthesis, the hard work moves to checking the output
      type: claim
      source: Tristan Gamilis (Lyssna CPO), in the Lyssna article for E3
      url: https://www.lyssna.com/blog/product-leaders-ai-research-survey/
      source_date: 2026-07-10
      checked_on: 2026-11-19
      age_flag: false
      status: "verified"
      note: Opinion from a vendor. E2 (synthesis QA step) supports it but is a different vendor's data
    - id: E5
      claim: AI synthesis can invent or reword quotes and lose context
      type: claim
      source: Customer Interview Analysis, Where AI Helps and Hurts, Teresa Torres, Product Talk
      url: https://www.producttalk.org/customer-interview-analysis-ai/
      source_date: 2025-10-08
      checked_on: 2026-11-19
      age_flag: true
      status: "verified"
      note: Practitioner article, updated 2026-09-27. Not a study, so the 2026 rule does not drop it. Her 30% figure is one project, not a statistic
    - id: E6
      claim: Copilot agent builder takes instructions up to 8,000 characters and embedded files as knowledge
      type: tool-feature
      source: Build agents in Agent Builder, Microsoft Learn
      url: https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/agent-builder-build-agents
      source_date: 2026-11-16
      checked_on: 2026-11-19
      age_flag: false
      status: "verified"
    - id: E7
      claim: Claude custom skills are on all plans from Free to Enterprise; code execution must be on
      type: tool-feature
      source: How to create custom skills, Claude Help Center
      url: https://support.claude.com/en/articles/12512198-how-to-create-custom-skills
      source_date: 2026-11 (page shows "updated over 2 weeks ago")
      checked_on: 2026-11-19
      age_flag: false
      status: "verified"
    - id: E8
      claim: Gems become skills from 2026-11-17 and are removed 2026-12-17 (personal accounts). For Workspace, skills available now per the Workspace Updates blog (gm-03); business Gems removed from March 2027. Corrected 2026-11-22 (Dan, Gate 1 b). A skill holds instructions and up to 100 MB of files. Most Gem tools (Deep research, Canvas) do not work in skills
      type: tool-feature
      source: About the transition from Gems to skills, Gemini Apps Help
      url: https://support.google.com/gemini/answer/18560919?hl=en
      source_date: unknown (page shows no date)
      checked_on: 2026-11-20
      age_flag: false
      status: "wrong"
      note: No scheduling found for skills
    - id: E9
      claim: ChatGPT Projects hold instructions and files
      type: tool-feature
      source: Projects in ChatGPT, OpenAI Help Center
      url: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
      source_date: unknown
