      Opened the EBSCO Business Source Ultimate record (accession 192612716) of the HBR article. It confirms
      the authors (Romasanta, Thomas, Levina), the outlet (HBR Digital Articles) and the date (2026-03). The
      abstract says the bias held "across seven core business tensions" and "regardless of varying company
      contexts or prompt styles", and that better prompts or richer context "had limited effect". The record
