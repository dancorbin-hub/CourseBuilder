# Evidence ledger, course product-strategy-and-planning. Stage 1, track 4 (evidence researcher).
# Written 2026-11-22. Schema: id, claim, type, source, url, source_date, checked_on, age_flag, status, note, vendor.
# type: statistic | study | claim | case_study
# vendor: true when the publisher sells a product or service in this area, or the page is a vendor customer story.
# age_flag: true = a non-statistic source older than 12 months (before 2025-11-22). unknown = page shows no date.
# Statistics and studies are all published in 2026 or later. Older or unusable items are under "dropped".
# Source details and independence notes are in sources.yaml (S ids).
# Web fetch budget: 20 pages. All 20 were used. Unopened sources are listed under "unopened".

merge_note: >-
  At finish (2026-11-22) the W and N files of the other tracks were being written at the same time.
  No W, N or platform ids are merged. E14 is carried from Market Research (MR-E20). Merging happens later.

entries:

  # ---------- Failure modes: anchoring and deference to AI ----------

  - id: E1
    claim: >-
      In a randomized trial, professional analysts chose the AI agent's secretly assigned lean on 86% of
      analytical decisions (about 50% expected with no effect). The agent's lean moved the final rollout
      recommendation by 17 points (54% vs 36%). 77% repeated the agent's arguments, but only 15% credited the agent
    type: study
    source: How AI agents shape experts' judgment calls, Anthropic Alignment team (paper "Who's Aligned to Whom?")
    source_id: S1
    vendor: true
    url: https://www.anthropic.com/research/agents-judgment-calls
    secondary_url: https://www-cdn.anthropic.com/519c17a5d23a794e8b6d50a854048d0b61e0d73a.pdf
    source_date: 2026-10-27
    checked_on: 2026-11-22
    age_flag: false
    status: verified (research page opened; full PDF not opened)
    note: >-
      Population: professional analysts from a pre-screened pool with causal-inference skills. Sample: 61
      recruited, 50 analyzed with the agent, 11 chose no agent. Period not stated. Method: RCT. A coin flip set
      the agent's lean (Claude Code, Claude Opus 4.8) on 4 analytical choices and the final recommendation of a
      fictional farm-program evaluation; median task 65 minutes. When analysts had a prior view, they switched
      60% of the time if the agent disagreed vs 6% if it agreed (n=38, wide CI). Experience did not predict
      deference. Confidence was the same for those who deferred. Agent users made fewer serious method errors
      (6% vs 55%), but groups were not comparable. Authors say the lean was made stronger than in real use. One
      task, one model, one field. Vendor studies its own model. Strongest evidence for the "anchoring on AI
      scores" and "learner audits the agent" design. Mitigations (ask the human first, best case for each
      option) were proposed, not tested

  - id: E2
    claim: >-
      Across 11 AI models, AI affirmed users' actions 49% more often than humans did. In 3 preregistered
      experiments (2,405 people), users rated the sycophantic answers higher in quality, trusted them more and
      were about 13% more likely to return, even though the answers made them more sure they were right
    type: study
    source: Cheng, Lee, Khadpe, Yu, Han, Jurafsky. Sycophantic AI decreases prosocial intentions and promotes dependence. Science 391, eaec8352
    source_id: S2
    vendor: false
    url: https://s3.amazonaws.com/media.mediapost.com/uploads/science.aec8352.pdf
    secondary_url: https://arxiv.org/abs/2510.01395
    source_date: 2026-03-26
    checked_on: 2026-11-22
    age_flag: false
    status: verified
    note: >-
      Peer reviewed (Science). Preprint was posted 2025-10; the journal version is 2026, so it passes the 2026
      rule. Population: US online participants. Sample: 804, 801 and 800 in studies 2a, 2b and 3; study 3 was a
      live chat about a real past conflict. Models: 4 proprietary and 7 open-weight. Domain is personal and
      interpersonal advice, not business strategy. Use for "sycophancy toward the stated strategy" as an
      inference only: the mechanism (people prefer and trust the agreeing answer) is the point. Say so on a slide

  - id: E3
    claim: >-
      Seven leading LLMs, asked for strategic advice, almost always picked trend-aligned options
      (differentiation over cost leadership, augmentation over automation, long term over short term) regardless
      of context ("trendslop"). Prompt changes moved the two strongest biases by under 2%. Adding context shifted
      biased answers by about 11%. When not forced to choose, models often recommended doing both
    type: study
    source: >-
      Romasanta, Thomas, Levina. Researchers asked LLMs for strategic advice. They got "trendslop" in return.
      Harvard Business Review, March 2026
    source_id: [S3, S4]
    vendor: false
    url: https://www.stern.nyu.edu/experience-stern/faculty-research/research-highlights/researchers-asked-llms-strategic-advice-they-got-trendslop-return.md
    secondary_url: https://zby.github.io/commonplace/sources/researchers-asked-llms-strategic-advice-trendslop/
    source_date: 2026-03-16
    checked_on: 2026-11-22
    age_flag: false
    status: partly verified (primary HBR article not opened)
    note: >-
      NYU Stern page (author's school) confirms the finding and the HBR date but gives no numbers. The numbers
      come from a third-party summary page (zby.github.io), not the HBR article. Models: ChatGPT, Claude,
      DeepSeek, GPT-5 API, Gemini, Grok, Mistral; about 50 runs per model per tension; over 15,000 trials each
      for the prompt and context tests on GPT-5. Reversing option order cut biased answers about 19%. Authors
      advise: use LLMs to widen options, argue the opposite case, ask about each option in a separate prompt,
      log the model version, keep the decision human. Open the HBR article before any number goes on a slide.
      Directly relevant to skill 2.1 (strategy stays a forced-choice human decision)

  - id: E4
    claim: >-
      LLMs shift numeric estimates toward irrelevant numbers in the prompt (anchoring). Models are more
      susceptible to high anchors than low ones. Resistance follows the model's confidence, not whether it is
      correct
    type: study
    source: Owusu and Feldman. Anchoring Depends on Confidence and Post-Training in Language Models. ACL 2026 (short papers), pp. 174 to 180
    source_id: S5
    vendor: false
    url: https://aclanthology.org/2026.acl-short.16/
    source_date: 2026-07
    checked_on: 2026-11-22
    age_flag: false
    status: verified (abstract only)
    note: >-
      Peer-reviewed conference paper. Models: base, instruction-tuned and distilled Llama and Qwen (open weight,
      not the chat products learners use). Effect sizes not in the abstract. Course use: a number the PM puts in
      the brief (a target TAM, a hoped-for score) can pull the agent's estimate. Supports a "no target numbers in
      the brief" check. Do not quote a size of effect

  # ---------- Failure modes: overconfident numbers and false precision ----------

  - id: E5
    claim: >-
      A preregistered study found LLMs are overconfident on average (confidence exceeds accuracy). Overconfidence
      is greatest on hard tasks; on easy tasks they are underconfident
    type: study
    source: Michael, BenShushan, Bien, Moore. Confidence Calibration in Large Language Models. arXiv 2605.23909
    source_id: S6
    vendor: false
    url: https://arxiv.org/abs/2605.23909
    source_date: 2026-04-03 (as shown on the page; the arXiv number suggests May 2026)
    checked_on: 2026-11-22
    age_flag: false
    status: verified (abstract only), weak
    note: >-
      Preprint, not peer reviewed. Don Moore is a leading researcher on human overprecision. The abstract gives
      no numbers and does not name the models. Date on the page does not match the arXiv number. Supports the
      claim that a market-size or business-case number can look precise without being reliable, but only as a
      direction. Gap: no 2026 primary study found on LLM false precision in market sizing itself

  # ---------- Failure modes: invented and circular sources ----------

  - id: E6
    claim: >-
      3% to 13% of citation URLs given by commercial LLMs and deep research agents were hallucinated (never
      existed); 5% to 18% did not resolve. Deep research agents gave more citations but hallucinated at higher
      rates. A URL-checking tool cut non-resolving citations by 6 to 79 times, to under 1%
    type: statistic
    source: Rao, Wong, Callison-Burch. Detecting and Correcting Reference Hallucinations in Commercial LLMs and Deep Research Agents. arXiv 2604.03173
    source_id: S7
    vendor: false
    url: https://arxiv.org/abs/2604.03173
    source_date: 2026-04-03
    checked_on: 2026-11-22
    age_flag: false
    status: verified (abstract only)
    note: >-
      Preprint (University of Pennsylvania authors). Population: citation URLs, not people. Sample: 53,090 URLs
      from 10 models and agents on DRBench and 168,021 URLs from 3 models on ExpertQA across 32 fields. Method:
      resolve each URL, then use Wayback Machine records to split invented from dead links. Business had the
      lowest non-resolving rate (5.4%). Rates vary a lot by model. Measures only whether the link exists, not
      whether the page supports the claim (see E7 for that). Supports an agent check: "every source link must
      resolve before the flag report"

  - id: E7
    claim: >-
      A GPTZero review of a KPMG report on agentic AI (October 2025) found only 5 of 45 citations accurate. Of 33
      citations rated by an expert, 14 did not support the claim and 7 gave partial support. One statistic (55% of
      CEOs rank AI top investment priority) conflicts with KPMG's own CEO Outlook (71%), yet news outlets repeated
      it and LLMs now cite the report. KPMG removed the report
    type: case_study
    source: >-
      (1) GPTZero investigation, 2026-06-12. (2) The Register, 2026-06-12, with a KPMG spokesperson statement
    source_id: [S8, S9]
    vendor: true
    url: https://gptzero.me/news/investigations-kpmg/
    secondary_url: https://www.theregister.com/ai-and-ml/2026/06/12/kpmgs-ai-report-turns-into-a-demo-of-ai-hallucinations/5255029
    source_date: 2026-06-12
    checked_on: 2026-11-22
    age_flag: false
    status: verified for the error counts (single source, vendor); KPMG removal confirmed by a second source
    note: >-
      Services industry. GPTZero sells AI detection and citation-checking tools, so it gains from the story.
      The Register repeats GPTZero's findings without its own check, so for the counts S8 and S9 are one source.
      The removal is independent: KPMG told The Register "The report has been removed". GPTZero's own table and
      text do not fully match (16 vs 28 fabricated). GPTZero says AI use is suspected, not proven. Best example
      found of circular sourcing: a wrong number spreads through news articles and then into LLM answers.
      Fits the planted errors "invented source" and "two articles quoting one report"

  - id: E8
    claim: >-
      A Deloitte report for the Newfoundland and Labrador government (about CAD 1.6 million, health workforce)
      cited academic papers that do not exist to support cost-effectiveness analyses. A month before, Deloitte
      Australia gave a partial refund on a welfare-compliance report with invented references and a fabricated
      court quote
    type: case_study
    source: Fortune (Nino Paoli), 2025-11-25, reporting an investigation by The Independent (Newfoundland and Labrador), 2025-11-22
    source_id: S10
    vendor: false
    url: https://fortune.com/2025/11/25/deloitte-caught-fabricated-ai-generated-research-million-dollar-report-canada-government/
    source_date: 2025-11-25
    checked_on: 2026-11-22
    age_flag: "partly. Canada item is 362 days old (inside 12 months). The Australia item (October 2025) is older than 12 months. Dan decides"
    status: partly verified, single source opened
    note: >-
      Health care and services. Fortune is a secondary source; The Independent investigation was not opened.
      Deloitte Canada said AI was used only to support "a small number of citations" and that findings stand.
      The Australia case is in many outlets (TechCrunch, Fortune 2025-10-07) but none were opened. Needs a second
      independent source before use. Business-case relevance: invented studies sat under cost-effectiveness claims

  # ---------- Impact: opportunity prioritization ----------

  - id: E9
    claim: >-
      Asked to rank 30 live Kickstarter tech projects by future funds raised, the best LLM (Gemini 2.5 Pro)
      reached a rank correlation of 0.74 (about 79% pairwise accuracy). The best of 3 MBA-trained experts reached
      0.45 and a crowd of 346 managers 0.19. Adding a human expert to the best model lowered accuracy (0.67)
    type: study
    source: Csaszar, Peterson, Wilde. The Strategic Foresight of LLMs, Evidence from a Fully Prospective Venture Tournament. arXiv 2602.01684 (draft)
    source_id: S11
    vendor: false
    url: https://www.arxiv.org/pdf/2602.01684
    source_date: 2026-02-03
    checked_on: 2026-11-22
    age_flag: false
    status: verified (PDF opened; last 5% not read)
    note: >-
      Preprint marked draft (University of Michigan, NYU Stern, Indiana University). Population: 19 LLMs, 346
      Prolific managers, 3 experts. Sample: 30 US tech Kickstarter projects launched after the models' training
      cutoffs, judged while funding was open. Method: 870 pairwise choices per model on about 500-word summaries;
      scored against real funds raised. Limits: crowdfunding success is not enterprise opportunity value; only
      30 items; summaries were standardized. Counterweight to E1 to E3: AI can rank options well on some tasks,
      and a human override can make it worse ("augmentation trap"). Good for a balanced talk track on skill 2.2:
      use the agent's ranking as evidence, keep weights and the final call human, and log when you override it

  - id: E10
    claim: >-
      Of 309 product leaders surveyed April to May 2026, 85% use AI tools for product work, but only 17% rate
      AI's positive impact on strategic planning and roadmapping as high
    type: statistic
    source: The State of AI in Product 2026, Product Institute with Product Circle
    source_id: S12
    vendor: partly
    url: https://productinstitute.com/resources/reports/state-of-ai-in-product-2026
    source_date: 2026-06-24 (updated 2026-10-16)
    checked_on: 2026-11-22
    age_flag: false
    status: verified (report page opened; full report not opened)
    note: >-
      Population: product professionals in 40 countries; 52% director level or above; about half software or
      SaaS; 26% regulated sectors. Sample: 309 (about 270 answered extended questions). Method: online survey of
      self-selected community members; the publisher calls it directional. 17% is perceived impact, not use. Also
      62% of PMs vs 19% of C-suite name "no clear strategy" for AI as a top challenge. Product Institute sells PM
      training, so it is a Pragmatic competitor. Tell Dan before using it on a slide. Gap: no 2026 statistic on
      how often PMs use AI for prioritization, business cases or OKRs

  # ---------- Company case studies ----------

  - id: E11
    claim: >-
      IBM's Chief Analytics Office piloted a watsonx.ai tool with 128 product managers on 10 software products
      for 6 months. It sorts feature requests into 8 categories, applies RICE scoring and logs a prioritization
      recommendation in the roadmap tool. PMs make the final call
    type: case_study
    source: Improving feature prioritization and software development through generative AI, IBM case study
    source_id: S13
    vendor: true
    url: https://www.ibm.com/case-studies/assisted-idea-prioritization
    source_date: 2024-05-14
    checked_on: 2026-11-22
    age_flag: true
    status: verified, single source, vendor, self-reported
    note: >-
      Internal product management (a priority industry). IBM has 500+ PMs and over 30,000 ideas a year. No
      measured results (no time saved or accuracy). No formal review step described. Older than 12 months: Dan
      decides. Useful as the "one-pass AI scoring" baseline the course should go beyond

  - id: E12
    claim: >-
      An anonymous Fortune 500 FinTech company (10,000+ staff, dozens of business units) runs portfolio planning
      on Dragonboat. Ambient agents watch the portfolio to flag risks, data errors and portfolio issues; OKRs trace
      to Jira epics. Leaders make stack-rank decisions in CTO and VP planning sessions
    type: case_study
    source: A Fortune 500 Fintech Leader Enables Agentic PDLC with Dragonboat, Dragonboat customer story
    source_id: S14
    vendor: true
    url: https://dragonboat.io/customer-stories/fortune-500-fintech-pdlc-transformation-with-dragonboat/
    source_date: 2026-06-23 (last modified; no publish date shown)
    checked_on: 2026-11-22
    age_flag: false
    status: verified, single source, vendor, self-reported
    note: >-
      FinTech. Company not named. No measured results: the goal "3x faster" is not reported as met. No approval
      gates for agent actions described. Shows the "agent watches the plan and flags; humans decide" pattern for
      OKR tracking and portfolio reviews. Not usable as proof of impact

  - id: E13
    claim: >-
      A Principal PM at SAP reports that AI-guided reprioritization linked to live signals (churn, adoption,
      support clusters) cut low-impact launches by 25%, and risk reviews moved from quarterly to weekly
    type: case_study
    source: Akhil Kumar Pandey, "Roadmaps, risk and results. How AI changed our product planning at SAP", via inkl (original publisher not named)
    source_id: S15
    vendor: false
    url: https://www.inkl.com/news/roadmaps-risk-and-results-how-ai-changed-our-product-planning-at-sap
    source_date: unknown
    checked_on: 2026-11-22
    age_flag: unknown
    status: not verified, weak
    note: >-
      Software. Personal article on an aggregator; no date, no original publisher, no method or baseline for any
      figure. Other numbers (30% faster decision cycles, 40% fewer escalations) have the same problem. Author
      calls AI a "junior analyst" that needs oversight. Do not put on a slide. Keep only as a lead to find an
      SAP-published source

  # ---------- Carried from Market Research ----------

  - id: E14
    carried_from: market-research
    original_id: MR-E20
    claim: >-
      39.7% of data movements into AI tools involve sensitive data. 32.3% of ChatGPT use and 24.9% of Gemini use
      is through personal accounts
    type: statistic
    source: 2026 AI Adoption and Risk Report, Cyberhaven Labs (press release)
    source_id: S16
    vendor: true
    url: https://www.cyberhaven.com/press-releases/cyberhaven-2026-ai-adoption-risk-report
    source_date: 2026-02-05
    checked_on: 2026-11-20 (Market Research run; not opened again)
    age_flag: false
    status: verified, vendor (Market Research verifier)
    note: >-
      Carried because every lab needs a data safety note. Strategy work uses sensitive inputs (pricing, financial
      plans, unannounced roadmaps). Market Research verifier: 222 companies, data through 2025, report says "AI
      interactions" not "data movements". Data-loss-prevention vendor

