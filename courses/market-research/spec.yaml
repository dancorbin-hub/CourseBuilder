    - id: P1
      name: Build from template and run a batch with file output
      used_in: [m1, m2]
      test: >-
        Build the agent from kit-m1-template. Save, close and reopen. Run batch 1. Pass: the agent returns the problem
        backlog as a downloadable file, with an evidence profile per problem, fact labels, a proposed ranking with
        reasons and a flag report; the planted vocal-buyer error appears (I-104 ranked near the top); the rerun after
        reopen gives the same structure. Also run the Copilot no-license fallback for modules 1 and 2 (instructions
        under 8,000 characters, run files pasted or uploaded in chat) and Gemini on a Workspace account. Decision 2:
        if P1 fails on 2 or more platforms, bring option B back to Dan with the results
    - id: P2
      name: Extend the agent and rerun with the prior log
      used_in: [m3]
      test: >-
        Add the weekly feedback job card and tag list to the saved agent. Run week 1, then week 2 with the week 1
        backlog. Pass: the "what changed" summary compares the two weeks; counts are by unique account; the
        forced-fit error appears before the fix and the new problem appears after it. Check that the core
        instructions stay under 8,000 characters. Use the log save card and check that the next run reads the saved
        backlog on each platform (Gemini: whole skill re-uploaded). Run the Copilot no-license fallback for module 3
        with the problem backlog pasted in chat
    - id: P3
      name: Hand-off between jobs and a cited answer
      used_in: [m4, m5]
      test: >-
        Run the win/loss job, then the map job on its output file, then the answer job on all logs. Pass: each map entry
        links to a deal id or interview id; the answer cites date and segment and has a "what we do not know" line;
        proposals are by segment; the CRM-versus-buyer error and the old-research error both appear on the case data.
        Also rebuild from kit-m5 in about 5 minutes. Run the Copilot no-license fallback for modules 4 and 5 (one job
        at a time, logs pasted in chat). No separate timing check for module 4 (decision 8)
  gate_2_proof_items:   # critic M5, M6, S3. Find each fact with a dated vendor doc or a test. Do not invent numbers
    - id: G2-PF-01
      platform: copilot
      check: >-
        Embedded knowledge takes the .txt copies of the 5 case knowledge files. Find if .md is accepted, with a dated
        vendor doc. Until then, step cards say "use the .txt copy"
    - id: G2-PF-02
      platform: copilot
      check: >-
        Chat file upload limits: files per message, file types (.csv, .md, .txt), and if an unlicensed agent user can
        upload in chat. Need to pass: 3 files in chat in one lab (labs 1, 2, 3) and .csv run files
    - id: G2-PF-03
      platform: copilot
      check: >-
        Longest message accepted in chat, for the paste fallback. Need to pass: the longest case run file,
        m4-evidence-pack.md (about 15,400 characters, measured 2026-11-22; critic N2), or the kit splits it
    - id: G2-PF-04
      platform: gemini
      check: >-
        Chat upload limits (files per prompt, file types .csv and .md) and files per skill. Need to pass: 3 files
        in chat in one lab, 3 files added to the skill in lab 1, and 12 knowledge files in the skill at the end.
        Confirm the whole-skill re-upload to update the log (gm-01) works inside the debrief time
    - id: G2-PF-05
      platform: copilot
      check: >-
        No-license fallback per module: core brief plus one job card plus one knowledge file stays under 8,000
        characters (mb-01). Measure the real text in each kit. Known now (critic N1): m1-code-book.md was trimmed
        to 2,791 characters, under the 2,800 course budget per knowledge file

