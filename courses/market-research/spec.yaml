# Course spec: Advanced AI for Market Research (course id market-research)
# Stage 2 draft by the course planner, 2026-11-22. Locked only when Dan approves Gate 2.
# Inputs: docs/PRD.md, research/gate-1-decisions.md, research/worked-example-row.yaml (v3),
#   research/workflows.yaml (retained rows 01, 02, 03, 09, 10), research/research-brief.md,
#   research/platform-matrix.yaml, research/methods.md, research/bond-stories.md, shared/registry/registry.yaml.
# Companion files: outline/development-brief.md (decision 40), outline/syllabus.md (Pragmatic-facing).
# Where workflows.yaml row 01 and the approved worked example row (v3) differ, this spec follows v3.
#   See open_items, item OI-06.
# v0.2 (2026-11-22): one revision after outline/critic-report.md.
# v0.3 (2026-11-22): rework brief 2 (Gate 2 comments). Problem backlog replaces the PM's bar. Half-day agenda
#   from Gate 2 decision 12. Decisions 6, 8, 9 and 10 applied. Proposed capability mapping (decision 7).
#   See "Revision log 2" at the end of outline/development-brief.md.
# v0.3 revision 3 (2026-11-22): fixes from the critic recheck (outline/critic-report.md). Spec matches the case
#   hand-off rules and the corrected capability mapping. See "Revision log 3" in outline/development-brief.md.

course:
  id: market-research
  title: Advanced AI for Market Research
  status: draft
  version: 0.3
  drafted_on: 2026-11-22
  revised_on: 2026-11-22
  instructor: Dan Corbin (delivers). Written so an instructor who did not build the course can deliver it (decision 45)
  offering_intent: Develop and Apply (decision 41)
  length: >-
    One day, 7.5 hours with lunch and breaks (360 teaching minutes). Also runs as two half days of 3.5 hours each,
    split after module 2 (195 teaching minutes each, 390 in total; Gate 2 decision 12)
  modules: 5
  category: Market (Pragmatic Framework 2027). Say "category" to learners (PA-08)
  focus_areas: [Market Problems, Win/Loss Analysis, Competitive Landscape]
  pragmatic_mapping_note: >-
    PA-05 (keep scope, explain). This course works in the Market category, focus areas Market Problems,
    Win/Loss Analysis and Competitive Landscape. These areas match the Foundations and Design course emphasis,
    not the Market core course (Market Definition, Buyer Personas, Buyer Journey). The course does not teach
    persona creation, market definition or market sizing. Market sizing (row 06) and concept tests (row 08)
    moved to the Product Strategy and Planning course.
  capability_standards:   # Gate 2 decision 7. Source: outline/capability-mapping.md (Capability Standards Workbook 2027)
    status: confirmed by Dan 2026-11-22, Pragmatic ID team to confirm
    capability: 1 Market Intelligence
    primary_skills: [1.1 Market Problem Identification, 1.2 Market Segmentation, 1.3 Market Discovery]
    secondary_skills: [8.1 Market Data Context and Pattern Recognition, 8.4 Data Narrative and Stakeholder Communication]
    secondary_capability: 8 Data-Driven Insight (secondary only)
    rule: Workbook ids and names are copied exactly. No skill or competency is invented
  big_idea: >-
    AI can gather far more market signal than you can read: online sources, customer feedback, deals and any data
    you give it. All of it is noise until you put it in context: what matters to your customers and what your
    business is trying to do. The agent gathers and organizes. You bring the context and make the call.
    (Dan, Gate 2 comment, 2026-11-22.)
  themes:
    - There is no magic number. The agent reports the evidence and proposes a ranking. The PM decides the order.
    - Be great at product management before you are great at AI.
    - Win/loss is the data most teams do not get. Module 2 shows what it reveals (module 2 highlight, not a course theme).

promise: >-
  After this course, you can build and manage one AI agent that turns your interviews, win/loss deals,
  weekly feedback and past research into a checked problem backlog, and you decide what the evidence means
  and which problems come first.

course_objectives:
  - id: CO1
    text: Build a market evidence agent from a template on your platform and run it on your own research inputs
  - id: CO2
    text: Write and tune the agent brief (job, inputs, code book, quality checks, hand-off rules, output) after each audit
  - id: CO3
    text: Decide each flag report item and audit a sample of agent output against its sources
  - id: CO4
    text: Connect agent jobs so that one job's output feeds the next, with hand-off rules that control what passes and what stops
  - id: CO5
    text: >-
      Rank market problems against each other from their evidence profiles, by segment, and defend each priority
      decision with sourced evidence, not a count alone

learner_profile:
  audience: Experienced product managers, product marketers and product leaders who run or use market research
  prerequisites: None. Familiarity with building agents or skills is recommended. Lab 1 has a fast-start card per platform
  readiness_checklist: >-
    Learners get a platform readiness checklist before class (decision 44). It is a checklist they run, not a survey.
    It checks the platform minimums below, agent creation permission (Copilot), code execution (Claude) and one test upload.
  platform_mix: Mixed in every class. Claude, ChatGPT and Microsoft Copilot first; Gemini second (decision 10). Breakout rooms group learners by platform
  platform_minimums:   # Gate 1 decision e, accepted by Dan 2026-11-22
    claude:
      build: Project (instructions and knowledge files) on all plans. Custom skill as stretch (all plans)
      minimum: Any plan. Code execution and file creation must be on. An org owner can turn them off; the readiness checklist tests this (cl-fo-06)
    chatgpt:
      build: Project (instructions and files). ChatGPT skills only on business plans, so skills are stretch (cg-04)
      minimum: Go or Plus. Step cards assume 20 files per project (cg-01 and cg-03 conflict; use the lower number)
    copilot:
      build: Agent in Copilot agent builder (instructions up to 8,000 characters, up to 20 embedded files)
      minimum: Permission to create agents in agent builder, plus a Microsoft 365 Copilot license or pay-as-you-go billing for embedded files (mb-02, mb-03). Not GCC. Copilot Cowork and Fabric are not required (decision 26)
      file_types: >-
        Embedded knowledge accepts .doc, .docx, .pdf, .ppt, .pptx, .txt, .xls and .xlsx (mb-02). It does not list .md
        or .csv. Each kit ships every .md knowledge file with a .txt copy (same text) for Copilot. The case already
        has them (case/README.md). Learners on Copilot add the .txt copy. CSV run files go in chat, not in knowledge.
        Gate 2 proof item G2-PF-01 checks the .txt copies and checks if .md works, with a dated vendor doc. G2-PF-02
        checks .csv in Copilot chat. If .csv fails, Stage 3 adds an .xlsx copy of each CSV to the kits
      fallback: See copilot_no_license_fallback below. Defined for every module. Gate 2 proof P1, P2 and P3 test it
    copilot_no_license_fallback:   # critic M6. mb-03: no license and no billing means no embedded file content
      who: Learners with Copilot Chat only, no license and no pay-as-you-go billing
      character_budget: >-
        Instructions hold 8,000 characters (mb-01). The five knowledge files are about 11,900 characters together, so
        they do not all fit. The fallback agent holds only the current module's job. Course design budget (not a
        vendor number): core brief 3,500 characters or fewer, job card 1,500 or fewer, knowledge file 2,800 or fewer.
        Total 7,800 or fewer
      per_module:
        - { module: 1, instructions: "Core brief + problem backlog job card + code book", paste_or_upload_in_chat: "Batch 1, then batch 2. The problem backlog from the last run" }
        - { module: 2, instructions: "Core brief + win/loss job card + driver code book (replaces the module 1 job)", paste_or_upload_in_chat: "CRM export (pasted as text) and win/loss notes" }
        - { module: 3, instructions: "Core brief + weekly feedback job card + tag list (replaces the module 2 job)", paste_or_upload_in_chat: "Week 1, then week 2 feedback. The problem backlog from module 1" }
        - { module: 4, instructions: "Core brief + alternatives map job card + current map (replaces the module 3 job)", paste_or_upload_in_chat: "Evidence pack (driver log, problem backlog, CRM extract)" }
        - { module: 5, instructions: "Core brief + stakeholder answer job card + past reports (replaces the module 4 job)", paste_or_upload_in_chat: "Problem backlog, driver log, alternatives map, stakeholder questions" }
      logs: The learner keeps each log as a file on their own computer and pastes or uploads it in chat at the next run
      kit: Each catch-up kit includes a fallback instructions text per module, already under 8,000 characters
      backup_if_swap_fails: Keep only the core brief in the instructions. Paste the job card and the knowledge file in chat at the start of each run
      what_is_lost: >-
        The fallback agent does one job at a time. The hand-off between jobs (modules 4 and 5) happens through files the
        learner pastes, not inside one agent. The step card says so
      gate_2_risk: >-
        Not verified: chat file upload for an unlicensed agent user, and the longest message Copilot accepts in chat.
        Gate 2 proof items G2-PF-02 and G2-PF-03 test both. The longest case run file is m4-evidence-pack.md (about
        15,400 characters, measured 2026-11-22 after the case rework). If paste fails for it, the kit splits it into 2 parts. If upload
        and paste both fail, the plan is: the learner pairs with a learner on another platform for the lab and runs
        the job on their own work after class with a licensed account. Gate 2 proof P1, P2 and P3 run this fallback
        for every module
    gemini:
      build: Gemini skill with instructions and up to 100 MB of files (gm-01). Gems are now skills; the step card says so (PA-09)
      minimum: Gemini app, personal or Workspace account. Test on a Workspace account at Gate 2 (gm-03). Do not use Canvas or Deep Research in a skill (gm-06)
      file_update: To update a file in a skill, re-upload the whole skill (gm-01). So logs stay in chat during a lab, and the learner re-uploads the skill once at the end of the lab with the log save card
  stretch_scope:   # Gate 2 decision 10 (final)
    core_path: The same on all 4 platforms in every lab
    schedule_and_second_agent_stretch: >-
      Only on the step cards of platforms where Stage 3 verifies the feature with a dated vendor doc and a test.
      Likely Claude and ChatGPT. Not verified yet
    copilot_and_gemini_cards: >-
      Stay on the core path. The card says: "The schedule and second-agent stretch steps are not available on this
      platform in this course."
    out_of_scope_at_launch: [Copilot Studio, Power Automate, Google Antigravity]
    slides: Module 3 (schedule) and module 4 (second agent) each name the platform gap once, on one slide
  data_access_limits:
    - The core path of every lab needs no connectors. Learners upload files
    - Learners do not paste client data, health data protected by HIPAA or personal data (PII) into a tool their company has not approved
    - Learners who cannot use their own work use the fallback case data
    - A "know before you design" slide in the course open names company limits (approved tools, connectors, sharing, code execution)

data_safety_note:   # Gate 1 PA-03, every lab, every step card (lab design rule 5)
  standard_text: >-
    Use an approved tool only. Do not put client data, health data protected by HIPAA or personal data (PII) into a
    tool your company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss.
  teaching_point: An agent that keeps a backlog stores sensitive data longer than a one-off prompt. Decide what the backlog may keep and for how long
  placement: Lab brief slide and the top of each step card, in every lab

course_agent:   # house rule 12, decision 38
  name: Market Evidence Agent
  idea: >-
    One agent for the whole course. Learners build it in module 1 from a template and add one job per module.
    The agent does the workflow. The learner is the agent manager: writes the brief, sets quality checks and
    hand-off rules, reviews the flag report and audits.
  manager_loop: [write the brief, set quality checks, set hand-off rules, run, review the flag report and the proposed ranking, audit a sample, tune the brief, run again]
  structure:
    instructions: Core brief (role, shared rules, evidence profile format, output format, flag report format). Must stay under 8,000 characters for Copilot (mb-01)
    job_cards: One file per job (problem backlog, win/loss, weekly feedback, alternatives map, stakeholder answers). Uploaded as knowledge, so the core instructions stay short
    knowledge_file_budget: 13 files or fewer across the whole course, under the Copilot and ChatGPT Plus limit of 20 (methods.md risk 2). The case agent ends with 12 knowledge files. They are 5 job cards, 5 case knowledge files and 2 logs (the problem backlog and the driver log). The .txt copies for Copilot replace the .md file on Copilot. They do not add to the count
    file_formats: Knowledge files ship as .md, with a .txt copy for Copilot (mb-02; case/README.md). CSV run files go in chat. Gate 2 proof G2-PF-01 and G2-PF-02 (critic M5)
    file_names: Short names, for example problem-backlog, driver-log, job-card-problem-backlog
  problem_backlog:   # rework brief 2, item 1 (Gate 2 decision 4 proposal). Replaces the v0.2 "insight log" and the PM's bar
    what: >-
      The agent's running list of market problems. Each problem has an evidence profile. Priority is relative: each
      problem is judged against the other problems in the backlog, not against a fixed bar. Supports workbook skill
      1.1D and the "prioritized problem backlog" in skill 3.3
    evidence_profile:   # facts only, no verdict
      - "Interviews: count interviews, not quotes. Also accounts, segments and personas"
      - "Source type for each source: PM-held, AI-moderated, win/loss, feedback item or past report"
      - "Urgency, with one quote"
      - "Pervasiveness: how many accounts and how many segments"
      - "Willingness to pay clues"
      - "Source dates"
    learner_facing_terms: Urgency, pervasiveness and willingness to pay clues (workbook skill 1.1D). Do not use "intensity", "frequency" or "impact" in learner-facing text
    fact_labels:
      - "single source: 1 interview, however many quotes"
      - "AI-moderated only: no PM-held interview supports the problem"
      - "one segment only: all evidence comes from one segment"
    fact_label_rule: >-
      Fact labels state facts. They are not verdicts. A problem with a fact label stays in the backlog for trend
      tracking. The agent does not drop it
    no_threshold: >-
      No number in the brief, the template or the case decides that a problem is real. No "meets the PM's bar".
      No "emerging" status
    ranking:
      agent: Proposes a ranking with a reason for each problem. Each reason cites the evidence profile
      pm: Decides the order, decides what is a pattern and decides what goes to validation
      agent_never_writes: [pattern, validated]
  segment_rule: >-
    Gate 2 decision 3 (provisional A, course rule until Dan runs the exercises). The agent ranks problems within a
    segment before it makes any claim about that segment. It never writes "<segment> buyers want" from one
    interview in that segment. Lab 5 tests it: the agent must not say "food service buyers want" from the one Food
    service interview I-105
  uploads_per_lab:   # critic S3. Case path counts from case/company.md ("Files this lab"); own work is similar
    rule: >-
      Each lab adds the job card and 1 case knowledge file to the agent (lab 1 also adds the empty problem backlog).
      Run files and the check file go in chat, as uploads or pasted text. Logs made by a run are saved back to the
      agent with the log save card
    per_lab:
      - { module: 1, to_agent: 3, in_chat: 3, files_this_lab: 6, note: "2 run files, 1 check file" }
      - { module: 2, to_agent: 2, in_chat: 3, files_this_lab: 5, note: "CSV export, win/loss notes, check file. New driver log" }
      - { module: 3, to_agent: 2, in_chat: 3, files_this_lab: 5, note: "2 CSV exports, check file. Writes to the problem backlog" }
      - { module: 4, to_agent: 2, in_chat: 2, files_this_lab: 4, note: "Evidence pack, check file" }
      - { module: 5, to_agent: 2, in_chat: 1, files_this_lab: 3, note: "Questions file (the check question is in it). Logs already in the agent" }
    peak_need: 3 files added to the agent and 3 files in chat in one lab. 12 knowledge files in the agent at the end
    platform_fit: >-
      Claude and ChatGPT Go or Plus: fits (10 files per upload, 80 every 3 hours, cg-01, cg-03). Copilot and
      Gemini chat upload limits are not in the platform matrix. Gate 2 proof items G2-PF-02 (Copilot) and G2-PF-04
      (Gemini) find them against the peak need above. Do not put a number on a slide or card until the proof item
      passes. Paste as text is the backup on every platform
  log_save_card:   # critic S3. A 2-step card at the end of each debrief, so the log persists to the next module
    steps:
      - Download the updated log file from the last run
      - Replace the old log file in your agent's knowledge
    platform_notes:
      claude: Replace the file in project knowledge
      chatgpt: Replace the file in project files
      copilot: Replace the embedded file and select Update. No-license fallback keeps the log on your computer
      gemini: Re-upload the whole skill with the new log (gm-01)
    gate_2_proof: P2 tests that the saved log is read in the next run on each platform
  growth:
    - module: 1
      adds: >-
        Problem backlog job. Brief v1 from the template: code book, evidence profile, fact labels, proposed ranking
        with reasons, flag report. The template has "count interviews, not quotes" (v3, decision 2). It has no
        flag rule for a problem whose quotes all come from 1 interview. The learner adds that flag rule after the
        audit (brief v2), as in case/planted-errors.md
      files_after: [core instructions, job-card-problem-backlog, code-book, problem-backlog]
    - module: 2
      adds: Win/loss job. Driver code book, deal source label, match rate table
      files_after: [job-card-win-loss, driver-code-book, driver-log]
    - module: 3
      adds: Weekly feedback job. Tag list with definitions, count by unique account, the "no fit" rule. Writes into the module 1 problem backlog (feedback items add to pervasiveness)
      files_after: [job-card-weekly-feedback, tag-list]
    - module: 4
      adds: Alternatives map job. First hand-off between jobs. Reads the driver log and the problem backlog. Hand-off rule says what passes and what stops
      files_after: [job-card-alternatives-map, alternatives-map]
    - module: 5
      adds: >-
        Stakeholder answer job, with ranking and validation proposals by segment (row 07 fold). Reads all logs and
        past reports. Hand-off rules say what the agent may tell other people. The PM decides
      files_after: [job-card-stakeholder-answers, past-reports]
  catch_up_kits:   # methods.md M10. Text kit, no sharing feature needed. Rebuild in about 5 minutes. Not tested yet (Gate 2 proof)
    rule: One kit per module. Each kit holds the brief text and the knowledge files as they are at the start of that module, plus a one-page rebuild card per platform
    kits:
      - kit-m1-template: The starter template. Brief v1 (v3 quality checks, evidence profile, fact labels and hand-off rules; no single-source flag rule), code book, empty problem backlog
      - kit-m2: State after module 1. Brief v2 (with the single-source flag rule), code book, problem backlog after batch 2
      - kit-m3: State after module 2. Adds win/loss job card, driver code book, driver log
      - kit-m4: State after module 3. Adds weekly feedback job card, tag list, updated problem backlog
      - kit-m5: State after module 4. Adds alternatives map job card and map
      - kit-final: The complete agent with all five jobs. Learners take it home to rebuild on their own work
    gemini_note: Gemini can also share a skill as an editable copy where Drive sharing is allowed (gm-04, not verified). The text kit stays the core path
    copilot_note: Each kit holds .txt copies of the knowledge files and a fallback instructions text under 8,000 characters for learners with no Copilot license

autonomy_ladder:   # decision 35. Rung 2 and rung 3 scope accepted (Gate 2 decision 10, final)
  rungs:
    - rung: 1
      name: Hand-run batch
      meaning: The PM runs the agent on a batch, reads every flag and audits a sample
      modules: [1, 2]
    - rung: 2
      name: Recurring run with a flag report
      meaning: >-
        The agent runs on each new week of input. The PM reads only the flag report and a sample, not each item.
        Core path is a hand-started run on week 2 on all 4 platforms (a schedule with no new input does nothing in a
        no-connector lab, methods.md M8). Schedule or trigger is a stretch step only on step cards where verified
        (stretch_scope). No scheduled-task setup slide (CAW-AI slide 9)
      modules: [3]
    - rung: 3
      name: Hand-off between jobs
      meaning: >-
        One job's output is the next job's input, with a hand-off rule that says what passes and what stops. In this
        course "agents that hand work to other agents" means jobs inside the one course agent (research brief limit 2).
        Stretch: a second agent, only on step cards where verified (stretch_scope)
      modules: [4, 5]
    - rung: 3 plus
      name: Agent that faces other people
      meaning: The chain ends in an answer to a stakeholder. Hand-off rules guard what the agent may say. The PM sends, changes or holds each answer
      modules: [5]

planted_error_fade:   # house rule 13, decision 34
  levels:
  - { module: 1, warning: told, slide_text: "This batch has one planted AI error. Find it in your audit." }
  - { module: 2, warning: hint, slide_text: "Audit before you approve." }
  - { module: 3, warning: hint, slide_text: "Audit before you approve." }
  - { module: 4, warning: hint, slide_text: "Audit before you approve." }
  - { module: 5, warning: none, slide_text: "" }
  reveal: The debrief of each lab reveals the error and asks which check or audit found it
  success_checks: >-
    Critic S2. The success check on the lab brief slide is general (PRD rule 7). It names the outputs and the
    manager actions, never the error. The error-specific pass condition is shown only in the debrief
    (debrief_check in each module). Step card steps also stay general
  case_counts: >-
    Debrief checks name case record ids. The counts for each check are in case/expected-results.md, recounted by the
    case builder under the problem backlog model (rework brief 2, item 10)

module_arc:   # PRD module arc, 40/60 split per module
  steps:
    - { step: Why this matters (optional open) and the workflow and its bottleneck, mode: instructor-led }
    - { step: Live build demo on one platform (this module's extension only), mode: instructor-led }
    - { step: Build pattern and lab brief (goal, data safety, success criteria, planted error warning), mode: instructor-led }
    - { step: Hands-on lab in platform breakout rooms, mode: hands-on }
    - { step: Debrief, error reveal and "what you do Monday" close (optional). Ends with the 2-step log save card, mode: hands-on }
  arc_minutes_order: [why this matters, live demo, build pattern and lab brief, lab, debrief]
  card_rules: >-
    Critic S5. 6 steps or fewer. One action per step. A step that sends files with a prompt is one action ("Send ...
    with the prompt ..."). Saving is not a step: the card header says how each platform saves (Claude and ChatGPT
    save as you go; Copilot: select Update; Gemini: select Save). The rerun after the fix is in the debrief where the
    card has no room. Card text in this spec is the outline; Stage 3 writes the platform cards from it.
    Core steps are the same on all 4 platform cards (decision 10)
  capability_map: Off (settings). If Dan turns it on, it goes in the debrief
  breakout_setup: >-
    Zoom: breakout rooms by platform, 3 to 5 learners each. In person: tables by platform. Each step card starts:
    "Build and save your own agent. Share your screen only when someone is stuck."

course_open:
  minutes: 25
  instructor_led: 15
  hands_on: 10
  segments:
    - { minutes: 5, mode: instructor-led, item: "Bond story (slot open, Dan picks before module 1 is built; see open_items OI-01)" }
    - { minutes: 10, mode: hands-on, item: "Opening build check (ends by minute 15). Each learner creates, saves and runs a minimal agent on their platform. A blocked learner changes platform or pairs with another learner" }
    - { minutes: 10, mode: instructor-led, item: "Course frame. You are the agent manager. The one course agent and its five jobs. Know before you design (company limits). Data safety note. The big idea: AI gathers the signal, you bring the context. Theme: be great at product management before you are great at AI" }
  build_check: >-
    Create a Project (Claude, ChatGPT), an agent (Copilot) or a skill (Gemini) named "Market Evidence Agent".
    Paste a 3-line starter instruction. Upload one sample file. Ask it to list the file and its first heading.
    Save, close and reopen it. Pass: the agent answers after reopen.
  half_days: Same 25 minutes at the start of day 1

course_close:
  minutes: 15
  instructor_led: 5
  hands_on: 10
  segments:
    - { minutes: 5, mode: instructor-led, item: "Recap of the manager loop. Theme: there is no magic number. The agent proposes, you decide" }
    - { minutes: 10, mode: hands-on, item: "Monday plan. Each learner picks the first job to run on their own work, sets an audit date and saves kit-final" }
  half_days: { minutes: 10, instructor_led: 4, hands_on: 6, note: "Same content. Recap 4 minutes, Monday plan 6 minutes" }

modules:
  - id: m1
    number: 1
    title: Run your first batch and manage it by flags
    workflow_row: mr-wf-01
    folded_rows: [mr-wf-05]
    workflow: Turn each new batch of buyer interviews into an updated, checked problem backlog
    category: Market
    focus_area: Market Problems
    capability_standards: { status: "confirmed by Dan, Pragmatic to confirm", skills: [1.1 Market Problem Identification, 1.3 Market Discovery], competencies: [1.1A, 1.1B, 1.3D] }
    bottleneck: Synthesis takes days per study, so insight reaches the roadmap late. AI cuts the analysis time, but the work moves to checking AI output (E4, E10, E5)
    minutes: 70   # full day
    split: { instructor_led: 28, hands_on: 42, percent_instructor_led: 40 }
    arc:
      - { minutes: 8, mode: instructor-led, step: "Why this matters. Workflow and bottleneck. Start where PDW-AI stops: no slides on coding or quote checks" }
      - { minutes: 11, mode: instructor-led, step: "Live demo. Build the agent from the template, run batch 1, read the evidence profiles, the proposed ranking and the flag report" }
      - { minutes: 9, mode: instructor-led, step: "Build pattern and lab brief. The manager loop. The evidence profile and fact labels. Data safety. Planted error is told" }
      - { minutes: 33, mode: hands-on, step: "Lab 1 (fast-start card per platform for learners new to the builder)" }
      - { minutes: 9, mode: hands-on, step: "Debrief. Reveal the error (2 minutes). Check sample: each learner sends m1-check-sample.md in a new chat on the tuned brief and compares with the pass condition (3 minutes). No magic number: priority is relative across the backlog. Decide the order of your top problems by segment. The Pragmatic test: can you predict that the next buyer of this persona will raise it? Only the PM calls a pattern (2 minutes). What you do Monday (1 minute). Log save card (1 minute)" }
    half_day:   # Gate 2 decision 12
      minutes: 80
      split: { instructor_led: 32, hands_on: 48, percent_instructor_led: 40 }
      arc_minutes: [9, 12, 11, 38, 10]
      note: The extra time goes to the evidence profile in the lab brief and to the lab. The debrief gives 1 more minute to the order by segment (3 minutes)
    rung: 1
    rung_name: Hand-run batch
    objectives:
      - id: m1-o1
        text: Build the Market Evidence Agent from the template on your platform, with a brief, a code book, an evidence profile and an output format
        practiced_in: lab step 1 to 2
      - id: m1-o2
        text: Decide each item in the flag report (keep, fix, send to discovery)
        practiced_in: lab step 3
      - id: m1-o3
        text: Audit 3 random problems in the backlog against the source interviews and record what you find
        practiced_in: lab step 4
      - id: m1-o4
        text: Add a flag rule to the brief for what the audit found, rerun, and decide the order of your top problems by segment
        practiced_in: lab step 5, step 6 and debrief
    lab:
      goal: Delegate interview synthesis to an agent that keeps a problem backlog, and manage it by its checks and flags
      core_message: Do not do the work between AI steps. Set the job, the checks and the hand-off rules. Read the evidence, then decide the order
      pm_decision: >-
        The order of the market problems in each segment, which problems go forward to prioritization, and which
        need more discovery. The agent proposes a ranking. Only the PM decides the order and calls a pattern
      build: Agent from the template (kit-m1-template)
      template_contents:   # matches the approved worked example row v3 (critic S7), plus the PA-02 rules and the backlog model
        quality_checks:
          - Each quote is found word for word in its source interview
          - Each problem counts interviews, not quotes, by persona and segment (decision 2, provisional C)
          - Each problem has an evidence profile, reported as facts (urgency with a quote, pervasiveness, willingness to pay clues, source dates)
          - Each source is labeled PM-held or AI-moderated (PA-02)
          - Each problem in the proposed ranking has a reason that cites its evidence profile
        handoff_rules:
          - Notes that fit no code
          - A new problem that contradicts the backlog
          - A segment with no PM-held interview (PA-02)
          - A claim about one segment before the problems in that segment are ranked (segment_rule)
        fact_labels: single source, AI-moderated only, one segment only. A labeled problem stays in the backlog for trend tracking
        agent_never_writes: The agent never writes "pattern" or "validated" (PA-01)
        left_out_on_purpose: >-
          A flag rule for single-source problems. The template counts interviews, not quotes, and asks for a
          ranking with reasons. It does not say what to do when all quotes for a problem come from 1 interview.
          With no such rule, the agent weighs quotes and urgency, so the vocal buyer ranks near the top even though
          the evidence profile shows 1 interview. The learner adds the flag rule for what the audit found
          (case/planted-errors.md, lab 1). That edit is the tuned brief (learner evidence). If proof P1 fails on 2
          or more platforms, Dan reviews option B (decision 2)
      card_steps:   # 6 or fewer, 1 action each (critic S5). Same core steps on all 4 platforms
        - Add the template brief and the code book to your agent
        - Send batch 1 with the prompt "Run the problem backlog job"
        - Decide each item in the flag report
        - Audit 3 random problems against the source interviews
        - Add one flag rule for what you found to the brief
        - Send batch 2 with the prompt "Run the problem backlog job"
      core_path_no_connectors: yes. Upload batch files and run
      inputs:
        own_work: 5 to 15 of your own interview notes or transcripts, from an approved tool, with consent
        fallback_case: "Larkspan: m1-code-book.md (knowledge), m1-interviews-batch-1.md and m1-interviews-batch-2.md (run), m1-check-sample.md (check)"
      stretch:
        - Screen the next round of applicants against the study criteria and hand only edge cases to the PM (row 05 fold; see OI-04)
        - Turn the job into a custom skill (Claude all plans, ChatGPT business plans, Gemini)
      planted_error:
        error: >-
          One vocal buyer ranks near the top. Interview I-104 (persona P05) gives 3 real quotes in 1 interview, and
          the agent ranks that problem near the top of the proposed ranking. The quote check passes. The learner
          finds it by reading the evidence profile (1 interview, single source) and in the audit. Workbook
          competency 1.1B: the noisy 20% versus the quiet 80%
        warning: told
        fix: >-
          The learner adds a flag rule (case/planted-errors.md, lab 1): "If all quotes for a problem come from 1
          interview, send it to the flag report. Keep single-source problems in the backlog." The problem stays in
          the backlog with its single source label. Optional second rule, a ranking rule: "Rank by interviews,
          accounts and segments. Quote count is not evidence of pervasiveness. State the interview count in each
          reason"
      success_check: >-
        Batch 2 run. The backlog updates. Each problem has an evidence profile and any fact labels that apply. The
        agent proposes a ranking with a reason for each problem. The agent writes "pattern" and "validated" nowhere.
        Each flag report item has your decision. You recorded 3 audit findings and added a flag rule to the brief
      debrief_check: >-
        Shown in the debrief only. After the fix, the flag report lists the I-104 problem (case: P05): all 3 quotes
        come from 1 interview. It is not ranked near the top on quotes. Its reason states its interview count. It
        stays in the backlog. The batch 2 flag report lists the P06 disagreement. The agent wrote "pattern"
        nowhere. Counts: case/expected-results.md
      check_sample: >-
        Critic S10. m1-check-sample.md runs in the debrief (3 minutes): new chat, tuned brief, empty backlog. The
        learner compares the result with the pass condition (case/expected-results.md, lab 1 second sample)
      learner_evidence: [tuned brief (v1 to v2 with the single-source flag rule), flag report decisions for batch 1, audit findings for 3 problems, the PM's order of the top problems by segment]
      data_safety: standard (see data_safety_note)
    agent_growth: Builds the agent. Adds the problem backlog job
    catch_up_kit: kit-m1-template (start); kit-m2 (end state)
    registry_guard: >-
      PDW-AI teaches one-pass synthesis and the quote check. Refer to them as known. No slides on them. PDW-AI and
      Foundations teach urgency, pervasiveness and willingness to pay, and PDW-AI uses a planted outlier. Refer to
      the three tests as known. New slides only on how the agent reports them in the evidence profile and how the
      manager audits that report (critic S8). Time goes to
      batches, the backlog over time, the evidence profile, the flag report, the audit and tuning. AI Agents course
      boundaries and guardrails are referred to, with new slides only (decision 33). Not CAW-AI buyer voice watch.
      Brief template is close to PRW-AI JOB AND CONTEXT, RULES, OUTPUT: refer to it as known
    talk_track_slots:
      why_this_matters: PMs lack time with customers (N5, n = 677, 2026). Synthesis moved from doing to checking (E4, E10 vendor; E12 counterweight). No speed figure on slides
      story_slot: Optional. A client team that shipped a reworded quote into a roadmap deck. Told as a story heard from a client team, not as the instructor's own experience
      monday_close: Run your agent on your last interview batch. Audit 3 problems before you share anything
      cautions:
        - Synthetic respondents flatten opinion (E16, E17). Use once in the course. If Dan picks bond story candidate 2, do not repeat it here
        - AI-moderated interviews (PA-02, de-emphasized by Dan at Gate 2, 2026-11-22: few enterprise customers use them today; mention briefly, list last among source types, keep the PM-held or AI-moderated source label). AI may run some interviews. PMs still talk to every segment. AI personas only from data the team collected. The therapy preference study needs a 2026 primary source before any slide use

  - id: m2
    number: 2
    title: Win/loss and the match rate
    workflow_row: mr-wf-02
    folded_rows: []
    workflow: Run a win/loss program that turns each decided deal into an updated, checked decision-driver report
    category: Market
    focus_area: Win/Loss Analysis
    capability_standards: { status: "confirmed by Dan, Pragmatic to confirm", skills: [1.3 Market Discovery, 8.1 Market Data Context and Pattern Recognition], competencies: [1.3A, 1.3C, 8.1B], gap: "Win/Loss Analysis box has no primary skill (capability-mapping.md gap 2)" }
    bottleneck: Manual win/loss is slow and does not scale. Sales-entered loss reasons often differ from buyer reasons. Many teams do not run win/loss at all (W1, W2; claims only, no figure on slides)
    minutes: 70   # full day
    split: { instructor_led: 28, hands_on: 42, percent_instructor_led: 40 }
    arc:
      - { minutes: 8, mode: instructor-led, step: "Why this matters. Most teams do not get this data. Pragmatic program rules: interview 2 to 4 weeks after the decision, by someone outside sales. Add each interview as it arrives; do not wait for 10" }
      - { minutes: 10, mode: instructor-led, step: "Live demo. Add the win/loss job. Join the CRM export and the interview notes" }
      - { minutes: 10, mode: instructor-led, step: "Build pattern and lab brief. Source labels. Match rate, not truth rate. Report counts, not verdicts. Hint: audit before you approve" }
      - { minutes: 32, mode: hands-on, step: "Lab 2" }
      - { minutes: 10, mode: hands-on, step: "Debrief. The aha: each learner writes one sentence on what the match rate table shows (3 minutes). Reveal the error. One win/loss interview can change a decision; the deal count tells you how far it reaches (2 minutes). Check sample: each learner sends m2-check-sample.md in a new chat and compares with the pass condition (3 minutes). How to share findings with sales. What you do Monday (1 minute). Log save card (1 minute)" }
    half_day:   # Gate 2 decision 12
      minutes: 75
      split: { instructor_led: 30, hands_on: 45, percent_instructor_led: 40 }
      arc_minutes: [8, 11, 11, 34, 11]
      note: The extra time goes to the match rate read in the debrief (4 minutes) and to the lab
    rung: 1
    rung_name: Hand-run batch, two sources joined
    objectives:
      - id: m2-o1
        text: Extend the agent with a win/loss job that labels each deal "interview" or "CRM only"
        practiced_in: lab step 1 to 2
      - id: m2-o2
        text: Compare CRM loss reasons with buyer reasons in a match rate table
        practiced_in: lab step 3 and debrief (one-sentence read of the table)
      - id: m2-o3
        text: Audit the deal source labels on 2 random deals and correct the brief
        practiced_in: lab step 4 and 5
      - id: m2-o4
        text: Decide which findings go to sales, marketing or leadership, and frame them so sales does not read them as blame
        practiced_in: debrief
    lab:
      goal: Extend the course agent to run win/loss on a batch of decided deals and report the gap between sales reasons and buyer reasons
      core_message: The agent's report is only as true as its sources. Make the agent label where each finding comes from, then audit the labels
      pm_decision: Which market problems, pricing or positioning issues and sales gaps to act on, and who hears about them
      build: Extend the agent with the win/loss job card, the driver code book and a driver log
      quality_checks:
        - Each driver has a buyer quote found word for word in the interview
        - Each driver shows its count of interviewed deals, its accounts and its segments (counts, not a verdict)
        - Each deal is marked "interview" or "CRM only"
      handoff_rules:   # match case/company.md rule 3. Critic S2: the one-segment driver rule is removed; counts by segment are a quality check
        - A deal where the CRM reason and the buyer reason differ
        - A lost deal that names an alternative not in the code book
      no_threshold: >-
        Rework brief 2, item 9. The agent reports deal counts and changes per driver and flags them. It does not
        apply a pass or fail number to a driver. The v0.2 case "3 deals" bar is removed
      program_rules: >-
        Add each win/loss interview to the driver log as soon as it is coded. Do not wait for a minimum number of deals. A win/loss interview covers the whole buyer journey, so one interview can change a decision. The agent shows the deal count with each driver; the PM decides what to act on. Someone outside sales runs the interviews (Dan, Gate 2 decision 7, 2026-11-22. Replaces the PA-04 minimum of 10 deals)
      card_steps:   # 6 or fewer, 1 action each (critic S5). Same core steps on all 4 platforms
        - Add the win/loss job card and the driver code book to your agent
        - Send the CRM export and the interview notes with the prompt "Run the win/loss job"
        - Decide each flag in the flag report
        - Audit 2 random deals, including the deal source column
        - Add one rule for what you found to the brief
        - Send the same files again with the prompt "Run the win/loss job"
      core_path_no_connectors: yes. Upload a CRM export (CSV) and interview notes
      inputs:
        own_work: An export of recent decided deals and any win/loss notes, from an approved tool, with confidentiality agreed
        fallback_case: "Larkspan: m2-driver-code-book.md (knowledge), m2-crm-export-q2.csv and m2-winloss-notes-q2.md (run), m2-check-sample.md (check)"
      stretch:
        - Run the job on each new batch when the export file arrives. Schedule stretch, only on step cards where verified (stretch_scope)
      planted_error:
        error: >-
          A CRM-only deal leaks into the buyer findings. The agent fills a missing interview with the CRM reason
          ("price"), so price looks like a top buyer driver. The quote check passes on deals with interviews.
          Only the audit of the deal source column finds it
        warning: hint
      success_check: The match rate table is complete. Each deal has a source label. Each driver shows its counts. Each flag has your decision. You audited 2 deals and added a rule to the brief
      debrief_check: >-
        Shown in the debrief only. The match rate table counts only deals with interviews. No "CRM only" deal appears
        in the buyer driver findings. The flag report lists each deal where the CRM reason and the buyer reason
        differ. Counts: case/expected-results.md
      check_sample: >-
        Critic S10. m2-check-sample.md runs in the debrief (3 minutes): new chat, tuned brief. The learner compares
        the result with the pass condition (case/expected-results.md, lab 2 second sample)
      learner_evidence: [match rate table with the learner's read of it, flag report decisions, audit findings for 2 deals, brief change]
      data_safety: standard (see data_safety_note). Interview notes and CRM exports hold customer names and deal values
    agent_growth: Adds the win/loss job, driver code book and driver log
    catch_up_kit: kit-m2
    registry_guard: Not a CAW-AI agent. CAW-AI module 4 compares own buyer sources with public reviews; this lab does not reteach that. Says "match rate", never "truth rate" (PA-04)
    talk_track_slots:
      why_this_matters: Teams that skip interviews act on the wrong loss reason (W1, W2 as claims; no 50 to 70% figure)
      story_slot: Optional. A sales leader who changed a pricing plan from CRM loss reasons. Told as a story from Pragmatic's work with companies
      monday_close: Pull your last 10 decided deals. Find out how many have a buyer interview
      hardware_and_internal_examples: Hardware deals through distributors and resellers. Internal platform adoption wins and losses. Gaps recorded; examples only

  - id: m3
    number: 3
    title: "The weekly run: read flags, not every item"
    workflow_row: mr-wf-03
    folded_rows: [mr-wf-04]
    workflow: Route each week's inbound customer feedback into the problem backlog
    category: Market
    focus_area: Market Problems
    capability_standards: { status: "confirmed by Dan, Pragmatic to confirm", skills: [1.1 Market Problem Identification, 8.1 Market Data Context and Pattern Recognition], competencies: [1.1B, 1.1C, 8.1B, 8.1D] }
    bottleneck: Feedback is spread across many tools. Tagging by hand is slow, subjective and does not scale. Tags drift, so trends become unreliable (W4, W5)
    minutes: 60   # full day and half days
    split: { instructor_led: 24, hands_on: 36, percent_instructor_led: 40 }
    arc:
      - { minutes: 8, mode: instructor-led, step: "Why this matters. Workflow and bottleneck. Count accounts, not mentions. Internal platform example (decision 9): the Fleet Data Platform team at the case company gets requests from other teams; the loudest channel is not the most pervasive problem" }
      - { minutes: 8, mode: instructor-led, step: "Live demo. Add the weekly feedback job. Run week 1, then week 2" }
      - { minutes: 8, mode: instructor-led, step: "Build pattern and lab brief. Rung 2: read only the flag report and a sample. One slide names the platform gap: schedule stretch only where verified (decision 10). Hint: audit before you approve" }
      - { minutes: 28, mode: hands-on, step: "Lab 3" }
      - { minutes: 8, mode: hands-on, step: "Debrief. Rerun week 2 with the new rule (3 minutes). Reveal the error. What makes an agent say no fit (2 minutes). Check sample: the instructor shows the m3-check-sample.md result from the demo run against the pass condition; learners run it after class (1 minute). Which problems move in the backlog. What you do Monday (1 minute). Log save card (1 minute)" }
    rung: 2
    rung_name: Recurring run with a flag report
    objectives:
      - id: m3-o1
        text: Extend the agent to tag a week of feedback against the problem backlog, counted by unique account
        practiced_in: lab step 1 to 3
      - id: m3-o2
        text: Write a "no fit" rule that makes the agent say "no fit" instead of guessing
        practiced_in: lab step 6 and the debrief rerun
      - id: m3-o3
        text: Audit a sample of 10 tagged items and the whole "no fit" group, and decide which changes need discovery
        practiced_in: lab step 4 and 5
    lab:
      goal: Extend the course agent to tag a week of feedback against the problem backlog and report what changed
      core_message: The hard part is not the tagging. It is the rule that makes the agent say "no fit" instead of guessing
      pm_decision: Which problems move up or down the backlog, and which new problems need discovery interviews
      build: Extend the agent with the weekly feedback job card and the tag list. It writes into the module 1 problem backlog. Feedback items add to pervasiveness (accounts and segments) with source type "feedback item"
      quality_checks:
        - Each tag has a one-line reason that quotes the item
        - Each item has exactly one primary tag or "no fit"
        - Counts are by unique account
        - The "what changed" summary reports the change in accounts for every tag (case/company.md rule 4)
      handoff_rules:   # match case/company.md rule 4 (critic M1). No number in these rules
        - Every "no fit" group goes to the flag report, with its item IDs and accounts
        - Items that hold personal or health data
      no_threshold: >-
        Critic M1, rework brief 2 item 4. The agent reports every change in accounts and flags every "no fit" group.
        No number in the brief decides which change or which group the PM sees. The agent does not call a one-week
        change a trend. The PM reads the changes and decides which need discovery
      card_steps:   # 6 or fewer, 1 action each (critic S5). Rerun of week 2 is in the debrief. Same core steps on all 4 platforms
        - Add the weekly feedback job card and the tag list to your agent
        - Send the week 1 export with the prompt "Run the weekly feedback job"
        - Send the week 2 export with the prompt "Run the weekly feedback job"
        - Decide each flag in the flag report
        - Audit 10 random tagged items and the "no fit" group
        - Add a "no fit" rule for what you found to the brief
      core_path_no_connectors: yes. Upload or paste CSV exports of feedback
      inputs:
        own_work: One or two weeks of feedback items (tickets, call notes, requests) with personal data removed, from an approved tool
        fallback_case: "Larkspan: m3-tag-list.md (knowledge; .txt copy for Copilot), m3-feedback-week-1.csv and m3-feedback-week-2.csv (run), m3-check-sample.md (check)"
      stretch:
        - Set a schedule or a file trigger. Only on step cards where verified (stretch_scope). Copilot and Gemini cards say it is not available in this course. No CAW-AI setup slide
        - >-
          Add the survey wave as a source for the evidence profile (case: m3-stretch-survey-wave.csv). Code the
          open-text answers and set them next to the closed answers (row 04 fold, PA-06). Urgency, pervasiveness and
          willingness to pay are known from PDW-AI and Foundations, and the core profile already has them. No new
          slide (critic S8)
      planted_error:
        error: >-
          Forced fit. The agent tags a new problem to the nearest old tag, so the "no fit" group stays empty and the
          new problem is hidden. The reason check passes because the item shares words with the tag. The audit of
          random items finds it
        warning: hint
      success_check: >-
        The week 2 "what changed" summary is complete and counted by unique account. Each flag has your decision. You
        audited 10 items and the "no fit" group and added a "no fit" rule to the brief
      debrief_check: >-
        Shown in the debrief only, after the rerun of week 2. The new problem (case: remote inspector access) is in
        the "no fit" group and the flag report names it. The forced-fit items no longer inflate a nearby tag, so the
        change for that tag is reported correctly (case: P02 stays at 3 accounts). Counts are by account, not
        mention (case: P01). The item with personal data is
        flagged (case: F-1221). Counts: case/expected-results.md
      check_sample: >-
        Critic S10. The debrief has no room for a learner run. The instructor shows the m3-check-sample.md result
        from the demo run (1 minute). Learners run it after class on the tuned brief (about 5 minutes) and compare
        with the pass condition (case/expected-results.md, lab 3 second sample). The step card says so
      learner_evidence: [flag report decisions for week 2, audit findings for 10 items and the no-fit group, the "no fit" rule added to the brief]
      data_safety: standard (see data_safety_note). Support tickets can hold PHI, account or card data. Remove it before upload
    agent_growth: Adds the weekly feedback job and tag list. Same problem backlog as module 1
    catch_up_kit: kit-m3
    registry_guard: CAW-AI buyer voice watch reads public reviews of competitors monthly. This job reads the company's own feedback into its own backlog. No scheduled-task setup slide (CAW-AI slide 9). New slides only
    talk_track_slots:
      why_this_matters: Teams with hundreds of items a week stop reading. The manager reads flags and a sample instead
      internal_platform_example: >-
        Required (Gate 2 decision 9, final). Use the case Fleet Data Platform (internal PM) as the example: internal
        teams send requests in many channels, and the loudest channel gets served first. Count accounts (here,
        internal teams), not mentions. The case builder adds one lab 5 question from the same PM
      story_slot: Optional. An internal platform team where the loudest Slack channel got served first (W18, one source; example only). Told as a story from Pragmatic's work with companies
      monday_close: Export last week's feedback. Run the job. Read only the flag report
      hardware_and_internal_examples: Field service work orders and technician notes (W17, one source). Internal intake requests and office hours (W18, one source)

  - id: m4
    number: 4
    title: "First hand-off: the alternatives map from your own deals"
    workflow_row: mr-wf-10
    folded_rows: []
    workflow: Keep the alternatives map current from the team's own evaluator and deal evidence
    category: Market
    focus_area: Competitive Landscape
    capability_standards: { status: "confirmed by Dan, Pragmatic to confirm", skills: [1.2 Market Segmentation], competencies: [1.2A], gap: "Competitive Landscape box has primary skill 2.2 (capability 2). 1.2 is a secondary skill on the box. Do not claim 2.2 (capability-mapping.md gap 1)" }
    bottleneck: >-
      Keeping the competitive landscape current is recurring work that no one has time for, and hand-built documents
      age quickly (N13, W21 weak). Gap: no source on an alternatives map built from own deal evidence. Dan supplies one
      real example (Gate 1 decision f), told as a Pragmatic or unnamed client story (Gate 2 decision 6)
    minutes: 55   # full day and half days. Gate 2 decision 8 (final)
    split: { instructor_led: 22, hands_on: 33, percent_instructor_led: 40 }
    arc:
      - { minutes: 7, mode: instructor-led, step: "Why this matters. Buyers choose workarounds and do nothing more often than teams track. Example slot (decision 6)" }
      - { minutes: 8, mode: instructor-led, step: "Live demo. Add the map job. The win/loss job hands its driver log to the map job" }
      - { minutes: 7, mode: instructor-led, step: "Build pattern and lab brief. What a hand-off rule is. One slide names the platform gap: second-agent stretch only where verified (decision 10). Hint: audit before you approve" }
      - { minutes: 25, mode: hands-on, step: "Lab 4" }
      - { minutes: 8, mode: hands-on, step: "Debrief. Rerun with the fixed hand-off rule (3 minutes). Reveal the error (2 minutes). Check sample: the instructor shows the m4-check-sample.md result from the demo run against the pass condition; learners run it after class (1 minute). Which alternative to beat in each segment. What you do Monday (1 minute). Log save card (1 minute)" }
    rung: 3
    rung_name: Hand-off between jobs
    objectives:
      - id: m4-o1
        text: Connect the win/loss job to a new alternatives map job, so the driver log feeds the map
        practiced_in: lab step 1 to 3
      - id: m4-o2
        text: Write a hand-off rule that says which evidence passes to the map and which goes to the flag report
        practiced_in: lab step 2 and step 6
      - id: m4-o3
        text: Trace 3 map entries back to their interviews and deal records
        practiced_in: lab step 5
      - id: m4-o4
        text: Choose the alternative your team must beat in one segment, and state the evidence for it
        practiced_in: debrief
    lab:
      goal: Extend the course agent to keep an alternatives map from the team's own evaluator and deal evidence
      core_message: Map what buyers chose, not what competitors announce. Every entry must trace back to a buyer or a deal
      pm_decision: Which alternatives the team must beat in each segment, and what goes to positioning, pricing and the roadmap. Scoring and weighting stay with the Product Strategy and Planning course
      build: Extend the agent with the alternatives map job card and the map file. The map job reads the driver log (module 2) and the problem backlog (modules 1 and 3)
      quality_checks:
        - Each map entry links to 1 or more evidence rows with a deal id or interview id
        - Each entry shows its source type (buyer interview or CRM only)
        - Each "growing" or "fading" label states the two periods compared and the counts in each
      handoff_rules:
        - An alternative that is not in the map
        - A deal where the CRM competitor field and the buyer's answer differ
        - A segment where "do nothing" or a workaround is the top alternative
      card_steps:   # 6 or fewer, 1 action each (critic S5). Rerun is in the debrief. Same core steps on all 4 platforms
        - Add the alternatives map job card and the current map to your agent
        - Write one hand-off rule from the win/loss job to the map job
        - Send the evidence pack with the prompt "Run the alternatives map job"
        - Decide each flag in the flag report
        - Audit 3 random map entries against the interviews and deal records
        - Fix the hand-off rule for what you found
      core_path_no_connectors: yes. Own work uses the driver log and problem backlog in the agent plus the CRM export. The case sends one evidence pack
      inputs:
        own_work: Your module 2 driver log, or your CRM export of decided deals with a competitor field, plus any interview notes
        fallback_case: "Larkspan: m4-alternatives-map.md (knowledge; .txt copy for Copilot), m4-evidence-pack.md (run; holds the driver log, CRM export, interviews and problem backlog), m4-check-sample.md (check)"
      stretch:
        - Run the map job on each new win/loss batch. Schedule stretch, only on step cards where verified (stretch_scope)
        - Build the map job as a second agent that reads the first agent's output file. Only on step cards where verified (stretch_scope). Copilot and Gemini cards say it is not available in this course
      planted_error:
        error: >-
          A named competitor is counted where the buyer chose "do nothing". The CRM competitor field says
          "Rimecore", but the buyer said in the interview that they kept the spreadsheet (case: deal D-3108). The
          agent trusts the CRM field, so Rimecore looks like it is growing. The link check passes, because each entry
          has a deal id. Only the audit against the interview finds it
        warning: hint
      success_check: >-
        Every map entry shows its source type and links to a deal id or interview id. Each "growing" or "fading"
        label names the two periods and the counts. Each flag has your decision. You audited 3 entries and fixed the
        hand-off rule
      debrief_check: >-
        Shown in the debrief only, after the rerun. The mismatched deal moves to "do nothing" (case: D-3108). Rimecore
        shows no change (case: 2 in Q2, 2 in Q3). The flag report lists the CRM and buyer mismatch. Do nothing is the
        top alternative in Food service. Counts: case/expected-results.md
      check_sample: >-
        Critic S10. The debrief has no room for a learner run. The instructor shows the m4-check-sample.md result
        from the demo run (1 minute). Learners run it after class on the fixed brief (about 5 minutes) and compare
        with the pass condition (case/expected-results.md, lab 4 second sample). The step card says so
      learner_evidence: [hand-off rule as written and as fixed, audit findings for 3 traced entries, the alternative to beat in one segment with its evidence]
      data_safety: standard (see data_safety_note). Deal records hold customer names, deal values and competitor prices
    agent_growth: Adds the alternatives map job. First hand-off between jobs
    catch_up_kit: kit-m4
    registry_guard: >-
      Not CAW-AI (positioning proof check, buyer voice watch, competitive signal watch) and not the AI Agents course
      Competitive Intel Watchdog. No public sources, no competitor moves. Only the team's own interviews and deals
    talk_track_slots:
      why_this_matters: Teams track named competitors and miss the workarounds and "do nothing" that buyers choose
      story_slot: >-
        Required example slot (Gate 1 decision f, Gate 2 decision 6, final). Dan sends one real example before module
        4 is built. Script it as Pragmatic's or an unnamed client's story, with identifying details removed, so any
        instructor can tell it (decision 43)
      monday_close: List the top 3 alternatives your last 10 lost deals chose. Check how many are named competitors
      hardware_and_internal_examples: Hardware buyers keep the installed product longer, repair it or buy a distributor brand. Internal platform alternatives are team-built tools and spreadsheets. Gaps recorded

  - id: m5
    number: 5
    title: The agent answers stakeholders, and you stay accountable
    workflow_row: mr-wf-09
    folded_rows: [mr-wf-07]
    workflow: Answer stakeholder questions from past research and the problem backlog with sourced, dated answers
    category: Market
    focus_area: Market Problems
    capability_standards: { status: "confirmed by Dan, Pragmatic to confirm", skills: [1.1 Market Problem Identification, 8.4 Data Narrative and Stakeholder Communication], competencies: [1.1C, 1.1D, 8.4A, 8.4C] }
    bottleneck: People cannot find past insights, stakeholders do not remember study names, and teams commission new studies on questions already answered (W13 age flag kept by Dan, W20)
    minutes: 65   # full day
    split: { instructor_led: 26, hands_on: 39, percent_instructor_led: 40 }
    arc:
      - { minutes: 8, mode: instructor-led, step: "Why this matters. Workflow and bottleneck. Theme: be great at product management before you are great at AI" }
      - { minutes: 9, mode: instructor-led, step: "Live demo. Add the answer job. Ask it a stakeholder question. Show the ranking and validation proposals by segment" }
      - { minutes: 9, mode: instructor-led, step: "Build pattern and lab brief. Boundaries for an agent that faces other people (new slides, decision 33). No error warning" }
      - { minutes: 30, mode: hands-on, step: "Lab 5" }
      - { minutes: 9, mode: hands-on, step: "Debrief. Reveal the error (2 minutes). Fix the brief for what the citation audit found (2 minutes). Run Q4 and compare: each learner sends the check question (case: Q4) on the fixed brief and compares the answer with the pass condition, the decision 3 segment rule test (3 minutes). Rank within a segment before you claim anything about it. The PM, not the agent, decides the order and what goes to validation (1 minute). What you do Monday (1 minute)" }
    half_day:   # Gate 2 decision 12
      minutes: 60
      split: { instructor_led: 24, hands_on: 36, percent_instructor_led: 40 }
      arc_minutes: [7, 8, 9, 28, 8]
      note: >-
        5 minutes shorter than the full day. Times can flex in delivery (decision 8). The lab keeps all 6 card
        steps (see card_step_minutes). The debrief keeps Run Q4 and compare (3 minutes). The brief fix gets 1
        minute, not 2
    rung: 3 plus
    rung_name: Agent that faces other people
    objectives:
      - id: m5-o1
        text: Extend the agent to answer stakeholder questions with a citation, date and segment for each claim, and a "what we do not know" line
        practiced_in: lab step 1 to 3
      - id: m5-o2
        text: Write hand-off rules that limit what the agent may tell stakeholders
        practiced_in: lab step 2 and debrief
      - id: m5-o3
        text: Decide to send, change or hold each answer after you open each citation
        practiced_in: lab step 4 and 5, and the Q4 run in the debrief
      - id: m5-o4
        text: Judge the agent's ranking and validation proposals by segment, and decide the order and what goes to validation
        practiced_in: lab step 6 and debrief
    lab:
      goal: Extend the course agent to answer stakeholder questions from the team's own research store and problem backlog
      core_message: An answer is only as good as what it admits it does not know
      pm_decision: Whether a question needs new research or can be answered now, what to tell the stakeholder, the order of the problems in each segment, and which problems go to validation
      build: >-
        Extend the agent with the stakeholder answer job card and past reports. The job reads the problem backlog,
        driver log and alternatives map. It gives ranking and validation proposals by segment, with reasons from the
        evidence profiles (segment_rule; row 07 fold). The PM decides. The agent never writes "validated"
      quality_checks:
        - Each claim has a citation to a study or backlog entry in scope
        - Each cited source shows its date and segment
        - The answer has a "what we do not know" line
      handoff_rules:
        - Any source older than the age limit the PM writes in the brief goes to the flag report (case PM's choice, 18 months; see case/company.md rule 1)
        - Sources disagree
        - The question needs new research
        - The evidence for a claim has a fact label (single source, AI-moderated only, one segment only). The answer states the label and may not say "buyers want"
        - A claim about one segment before the problems in that segment are ranked. Never "<segment> buyers want" from one interview in that segment
      card_steps:   # 6 or fewer, 1 action each (critic S5). Brief fix after the audit is in the debrief. Same core steps on all 4 platforms
        - Add the answer job card and the past reports to your agent
        - Write your age limit and hand-off rules into the brief
        - Send your 3 run questions (case Q1, Q2 and Q5) with the prompt "Run the stakeholder answer job"
        - Decide to send, change or hold each answer
        - Open each citation in one answer
        - Decide the order and what goes to validation in each segment
      card_step_minutes:   # critic M2. One budget per card step, in card order
        full_day: [3, 4, 3, 6, 5, 6]   # 27 of 30 lab minutes. 3 minutes slack
        half_day: [3, 4, 3, 6, 5, 5]   # 26 of 28 lab minutes. 2 minutes slack
        step_4_basis: 2 minutes per answer, 3 answers
        slack_use: Copilot no-license learners paste the logs and the questions in chat. Others may ask the optional Q3
      case_question_plan: >-
        Critic M2. 4 run questions did not fit: the estimate was 27 to 29 minutes with no slack, before the Copilot
        paste. On the case path, Q3 (Support lead) is optional: ask it in the slack time or after class. Q1, Q2 and
        Q5 are core. Q2 holds the planted error. Q5 must stay (Gate 2 decision 9). Q4 is the check question and runs
        in the debrief. With Q3 optional, the "sources disagree" hand-off rule is tested only by learners who ask
        Q3, or on their own work. case/company.md and case/m5-stakeholder-questions.md still say "Q1, Q2, Q3 and
        Q5". The case builder must change that line (open item OI-24)
      core_path_no_connectors: yes. The logs are already in the agent. Upload past reports and the questions
      inputs:
        own_work: Your logs from this course plus one or two past study reports, from an approved tool
        fallback_case: >-
          Larkspan: m5-past-reports.md (knowledge; .txt copy for Copilot), m5-stakeholder-questions.md (run: Q1, Q2
          and Q5 core, Q3 optional; Q4 is the check question, run in the debrief). Includes one question from the Fleet Data Platform (internal) PM, answered from the
          problem backlog (Gate 2 decision 9; the case builder adds it, with no change to any planted error or lab
          1 to 4 count)
      stretch:
        - Share the agent with a stakeholder to ask it directly, where the company allows (not verified)
      planted_error:
        error: >-
          Old research presented as current. The agent answers from a 2-year-old study for another segment. The
          citation check passes and the date is shown in small print, but the answer text says "buyers want". The
          audit finds that the answer goes past its evidence
        warning: none
      success_check: >-   # fade level none: no error-specific condition before the lab (critic S2)
        Each answer has your send, change or hold decision. You opened every citation in one answer. Each segment
        has your decided order and your validation decisions
      debrief_check: >-
        Shown in the debrief only. The fixed answer names the date and segment of every source. The flag report
        lists the old evidence for another segment (case: R-2024-07). The answer does not say "buyers want".
        Proposals are by segment and stay proposals until the PM decides. The agent does not write "food service
        buyers want" from the one Food service interview (case: I-105; decision 3 test). Counts:
        case/expected-results.md
      check_sample: Q4 in m5-stakeholder-questions.md runs in the debrief (3 minutes, "Run Q4 and compare"). Pass condition in case/expected-results.md, lab 5 second sample
      learner_evidence: [send, change or hold decisions for the answers, audit findings for the cited answer, the hand-off rules for what the agent may say, the PM's order and validation decisions by segment]
      data_safety: standard (see data_safety_note). The research store holds customer names and quotes. Share answers only inside approved tools
    agent_growth: Adds the stakeholder answer job and the ranking and validation proposals. The agent now has five jobs
    catch_up_kit: kit-m5 (start); kit-final (complete agent, take home)
    registry_guard: No workshop teaches research reuse. AI Agents course boundaries are referred to and taught again with new slides only (decision 33)
    talk_track_slots:
      why_this_matters: The question "what do we know about X?" arrives every week. The answer goes past its evidence when no one checks
      story_slot: Optional. An executive who repeated an old finding as current in a board deck. Told as a story heard from executives, not as the instructor's own experience
      monday_close: Ask your agent the last stakeholder question you got. Open every citation before you send it

