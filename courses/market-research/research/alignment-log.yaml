  - "Verify AI output: every row has quality checks, an audit and a planted error. Matches guide page 4, PDW-AI 'every claim needs a source', and the Pragmatic article 'AI outputs should be treated as inputs, not final answers'."
  - "PM keeps the decision: pm_decides in every row keeps meaning, priority and go or stop with the PM. Matches PDW-AI RED 'Letting AI decide what to build' and guide 'remain accountable'."
  - "mr-wf-07 core message 'The agent can propose a status; only the PM can call a problem validated' matches PDW-AI RED 'Treating AI-generated problems as validated'."
  - "Market Definition (mr-wf-06) follows the 5 steps on guide page 8."
