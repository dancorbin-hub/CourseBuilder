# Source register, course market-research. Stage 1, track 4. Written 2026-11-20.
# type: vendor | practitioner | study | analyst | Pragmatic
# independence: which sources count as one source (same study, same publisher or same data).

sources:
  - id: S1
    publisher: Perspective AI
    type: vendor
    items: [E1, E2]
    url: https://s.getperspective.ai/
    independence: Sells an AI interview tool. E1 and E2 are one source. Own panel and customer data

  - id: S2
    publisher: Delight Path (with research partners Lyssna, Userflow, Foldspace)
    type: practitioner
    items: [E3, E30]
    url: https://www.delightpath.com/product-leadership-report-2026
    independence: >-
      Survey hosted on Lyssna and partly recruited from the Lyssna panel. The Lyssna article (S3) repeats this
