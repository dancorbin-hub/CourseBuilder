  # ---------------- Microsoft Copilot agent builder ----------------
  - id: mb-01
    platform: copilot
    feature: Agent builder instructions, name and description
    plans: See mb-03 for licenses
    limits: Instructions 8,000 characters. Name 30 characters. Description 1,000 characters. Response mode Auto, Quick response or Think deeper. Natural language authoring only in some languages
    use_in_core_lab: "yes"
    url: https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/agent-builder-build-agents
    source_date: 2026-11-16
    checked_on: 2026-11-20
    status: "verified"
    verifier_note: "Opened 2026-11-20 (updated 2026-11-16). 8,000 / 30 / 1,000 characters and 3 response modes confirmed"
    note: Recheck of E6. Still 8,000 characters. Same page date
  - id: mb-02
    platform: copilot
    feature: Embedded files as knowledge (upload from device)
    plans: Needs a Microsoft 365 Copilot license or pay-as-you-go billing (see mb-03). Not in Microsoft 365 GCC
    limits: Up to 20 files per agent, no folders. .doc, .docx, .pdf, .ppt, .pptx, .txt up to 512 MB. .xls, .xlsx up to 30 MB. Password-protected files fail. Some sensitivity labels make agent creation fail
    use_in_core_lab: "yes"
    url: https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/agent-builder-add-knowledge
    source_date: 2026-11-16 (ms.date 2026-09-30)
    checked_on: 2026-11-20
    status: "verified"
    verifier_note: "Opened 2026-11-20 (updated 2026-11-16). 20 files, 512 MB / 30 MB, no GCC, password and label failures confirmed. License condition is on the prerequisites page (mb-03), not this page"
    note: A course agent with a code book, log, brief template and case files must stay at 20 files or fewer. Merge files where possible. Spreadsheet limit is 30 MB. Labelled company files can fail
  - id: mb-03
    platform: copilot
    feature: Agent capabilities by license
    plans: Microsoft 365 Copilot license; Copilot Chat with pay-as-you-go billing; Copilot Chat with no billing
    limits: Code interpreter, custom instructions, web search work for all three. Embedded file content, SharePoint and Copilot connectors need a license or billing. Email, People and Teams knowledge need a license. Pay-as-you-go bills only agents grounded in tenant data
    use_in_core_lab: "yes"
    url: https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/prerequisites
    source_date: 2026-11-06
    checked_on: 2026-11-20
    status: "verified"
    verifier_note: "Opened 2026-11-20 (ms.date 2026-11-06). Embedded files and SharePoint need license or usage billing; code interpreter, instructions, web search work for all. Self-conflict on unlicensed authoring confirmed"
    note: Key risk. A learner with Copilot Chat only and no billing cannot ground the agent in embedded files. The page also conflicts with itself on whether unlicensed users can author agents. Ask Microsoft or a second Copilot tester (PRD open item)
  - id: mb-04
    platform: copilot
    feature: Code interpreter ("Create documents, charts, and code" toggle)
    plans: All three license states in mb-03
    limits: Page names math, data analysis and charts. No file formats or size limits on the page
    use_in_core_lab: "yes"
    url: https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/agent-builder-build-agents
    source_date: 2026-11-16
    checked_on: 2026-11-20
    status: "verified"
    verifier_note: "Opened 2026-11-20. Toggle and math, data analysis, visualizations confirmed. No formats or downloads stated"
    note: Downloadable .xlsx or .docx output is not stated. Test at Gate 2 proof
  - id: mb-05
    platform: copilot
    feature: Share an agent (Can edit, Can chat, org-wide, copy chat link, edit link)
    plans: Recipients need the license that the agent's capabilities require. Admin can limit org-wide sharing
    limits: Groups only get Can chat. Can edit gives full owner rights. Embedded files are answered from by anyone who can use the agent. No copy or duplicate feature on the page
    use_in_core_lab: "no"
    url: https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/agent-builder-share-manage-agents
    source_date: 2026-11-16 (ms.date 2026-11-12)
    checked_on: 2026-11-20
    status: not verified
    note: Catch-up template. Can chat lets a learner run the template but not extend it. Can edit lets every learner change one shared agent. Neither fits. Use a catch-up kit (text brief + files). Also, learners are often in different tenants from the instructor, so sharing does not work across companies
  - id: mb-06
    platform: copilot
    feature: Scheduled workflows in agent builder (run a prompt hourly, daily, weekly, monthly or yearly)
    plans: Users who build agents in agent builder in Microsoft 365 Copilot (Premium)
    limits: Runs only for the user who created it. Not shared with the agent. Does not run for draft or unpublished agents. Rollout mid-November to mid-December 2026
    use_in_core_lab: "no"
    url: https://mc.merill.net/message/MC1302906
    source_date: 2026-10-30 (Message Center MC1302906, version 3, first posted 2026-05-06)
    checked_on: 2026-11-20
    status: not verified
    note: Source is a third-party mirror of the Microsoft 365 Message Center. Not a Microsoft Learn page. The Verifier needs a Microsoft-hosted copy. Stretch path once rolled out
  - id: mb-07
    platform: copilot
    feature: Scheduled tasks in Microsoft 365 Copilot (was Scheduled prompts)
    plans: Microsoft 365 Copilot license
    limits: 10 active and 50 total schedules per user. Moves to native Copilot scheduling and Tasks > Scheduled. Power Platform scheduled prompts retire 2026-12-31. Worldwide rollout 2026-11-30 to 2026-12-31
    use_in_core_lab: "no"
    url: https://learn.microsoft.com/copilot/microsoft-365/scheduled-prompts
    source_date: 2026-11-11 (ms.date 2026-11-03)
    checked_on: 2026-11-20
    status: not verified
    note: Rollout detail from Message Center MC1550533 (2026-11-12, via https://mc.merill.net/message/MC1550533). The Learn page does not say if a schedule can call an agent builder agent
  - id: mb-08
    platform: copilot
    feature: Copy an agent to Copilot Studio (to add actions, connectors or workflows)
    plans: Copilot Studio access
    limits: Agent builder cannot author actions that call external services
    use_in_core_lab: "no"
    url: https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/agent-builder-build-agents
    source_date: 2026-11-16
    checked_on: 2026-11-20
    status: "verified"
    verifier_note: "Opened 2026-11-20. Copy to Copilot Studio for actions confirmed"
    note: PRD decision 26 says Copilot Studio is not required. Stretch only
  - id: mb-09
    platform: copilot
    feature: Copilot Studio event triggers (Recurrence, file created in OneDrive, SharePoint item created, Planner, Dataverse)
    plans: Copilot Studio. Each trigger run uses Copilot Credits
    limits: Runs with the maker's credentials. Admins can block triggers with data policies. Needs generative orchestration
    use_in_core_lab: "no"
    url: https://learn.microsoft.com/microsoft-copilot-studio/authoring-triggers-about
    source_date: 2026-11-04 (ms.date 2026-11-03)
    checked_on: 2026-11-20
    status: not verified
    note: Stretch only, outside agent builder. Maker credentials are a data safety point for the lab
  - id: mb-10
    platform: copilot
    feature: SharePoint and OneDrive files as knowledge
    plans: License or pay-as-you-go billing (mb-03)
    limits: 100 SharePoint files, 50 OneDrive files, 1 SharePoint list (20,000 items, 50 MB text) per agent. Restricted SharePoint Search blocks it
    use_in_core_lab: "no"
    url: https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/agent-builder-add-knowledge
    source_date: 2026-11-16
    checked_on: 2026-11-20
    status: not verified
