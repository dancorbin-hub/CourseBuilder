id: mr-wf-01
workflow: Synthesize buyer interview notes into a coded insight table
topic_area: Research, buyer and market insight
trigger_and_cadence: After each batch of market visits, win/loss calls or discovery interviews. Typically every 2 to 6 weeks (assumption, to verify)

input: Raw notes or transcripts from 5 to 15 interviews
output: One table. Each row is an insight coded by theme, problem, segment and strength, with a verbatim quote and the source interview
pm_decision_informed: Which market problems to put forward for prioritization, and for which segment

bottleneck:
  description: Reading, tagging and grouping notes takes days. Synthesis waits, so insight reaches the roadmap late or not at all
  pdlc_stage: Discovery, before problem prioritization
  sources: [E1, E2]

scores:
  judgment: medium. Coding is rule-based; deciding what a pattern means needs the PM
  repetition: high. Same steps for each interview and each batch
  ai_candidate: yes for coding and grouping; no for the meaning

split:
  ai_does:
    - Apply the PM's code book to each interview
    - Pull verbatim quotes with the source interview
    - Count mentions by segment
    - Flag notes that fit no code
  pm_keeps:
    - The code book
    - Which patterns are real problems
    - Which segment matters
    - What goes forward to prioritization
  ai_error_to_catch: Invented or reworded quotes. The PM spot-checks each quote behind a top insight against the source notes

contexts:
  software: Discovery and win/loss interviews with buyers and users
  hardware: Field visits, distributor and installer interviews, service technician notes. gap, no source yet
  internal_pm: Interviews with employees who use an internal platform or tool. gap, no source yet
  fintech: gap, not searched yet
  health_care: gap, not searched yet
  services_manufacturing: gap, not searched yet

proposed_lab:
  goal: Build an assistant that turns raw interview notes into a coded insight table
  core_message: AI codes the notes. You decide what the pattern means
  build_type: project or agent with instructions and one knowledge file (the code book)
  core_path_no_connectors: yes. Learners paste or upload notes
  platforms:
    claude: Project with instructions and the code book file. Stretch, package the steps as a skill
    chatgpt: Project with instructions and the code book file (E7 not verified)
    copilot: Agent in Copilot agent builder with instructions and the code book as an embedded file
  stretch: Claude skill; scheduled re-run on each new batch where the platform allows
  planted_error: Sample data makes one quote easy to blend with another
  success_check: Run a second sample interview. Pass if each insight has a real quote and the right segment
  registry_check: Same topic area as CAW-AI buyer voice watch. Not a repeat; different input, build and skill. Dan to confirm

