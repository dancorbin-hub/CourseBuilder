- id: mr-wf-05
  workflow: Screen and shortlist each round of research participants against the study criteria
  topic_area: Research operations
  trigger_and_cadence: Each discovery, win/loss or validation study. Assumption, every 2 to 6 weeks
  input: Screener responses or a customer list export, the study criteria, and the do-not-contact and recent-participant lists
  output: A ranked shortlist with the reason for each pass, a reject list with reasons, quota fill by segment, and a flag report for the PM
  pm_decision_informed: Who the PM talks to, so the study hears from the right segment and roles
  bottleneck:
    description: Recruiting is one of the most failure-prone parts of research. Finding qualified participants and the time to recruit are top challenges, and participant fraud is now common, so each screener needs careful checks
    pdlc_stage: Market
    focus_area: Market Problems
    sources: [W10, W11, W12]
  scores:
    judgment: low to medium. Criteria checks are rules; edge cases need the PM
    repetition: high. Every applicant, every study
    ai_candidate: yes
  split:
    agent_does:
      - Check each applicant against the criteria
      - Check for inconsistent answers and fraud signals
      - Remove people on the do-not-contact or recent-participant lists
      - Rank the passes and fill quotas by segment
      - Draft invitation emails for the PM to send
      - Send flags to the PM
    pm_manages:
      brief: Job, study criteria, quotas, fraud signals, contact rules, output format
      quality_checks:
        - Each pass cites the screener answer for each criterion
        - Quotas are not over-filled
        - No one on the exclusion lists is shortlisted
      handoff_rules:
        - A fraud signal (the PM decides; a flag is not a verdict)
        - An applicant who meets most criteria but not all
        - A quota that cannot be filled
      audit: 5 random passes and 5 random rejects per study
    pm_decides:
      - The criteria and quotas
      - Each flagged applicant
      - Who gets an invitation
  ai_error_to_catch: The agent reads job title as buying role. A "Manager" title passes the "decision maker" criterion, but the screener answer says the person does not take part in buying. The citation check passes because a title is cited. The audit of passes finds it
  contexts:
    hardware: Recruiting installers, distributors and service technicians, often through channel partners. gap, no source found
    internal_pm: Recruiting employee users of an internal tool, often through managers or Slack. gap, no source found
    industry_notes:
      - "health care: recruiting clinicians or patients adds consent and privacy rules. Not yet researched"
      - "data safety: a customer list holds PII. Check that customers opted in to research contact, and use an approved tool"
  proposed_lab:
    goal: Extend the course agent to screen a round of applicants and hand only the edge cases to the PM
    core_message: Write the criteria so the agent can cite proof for each one. A flag is a question for the PM, not a verdict
    build_type: agent (extend the module 1 agent)
    core_path_no_connectors: yes. The learner uploads a screener export and a customer list from the fallback case
    data_safety: "Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)"
    platforms:
      claude: Skill with the criteria and contact rules
      chatgpt: Project with the criteria (E9 not verified)
      copilot: Agent with the criteria as an embedded file (E6)
      gemini: Gemini skill with the criteria (E8)
    stretch: Connect a recruiting panel or CRM where allowed (not verified)
    registry_check: PDW-AI teaches AI-assisted interview prep (guides and questions), not recruiting or screening. No overlap found. Fit, a support workflow; Dan may prefer it as a lab step inside another module, not a module of its own
  evidence:
    - id: W10
      claim: 95% of surveyed qualitative researchers reported participant fraud in the last 12 months
      type: statistic
      source: Bots, deepfakes and fake identities are sabotaging user research, Kathren Neuss, TechRadar Pro
      url: https://www.techradar.com/pro/bots-deepfakes-and-fake-identities-are-sabotaging-user-research
      source_date: 2026-10-02
      checked_on: 2026-11-20
      age_flag: false
      status: "partly verified"
      note: Opinion piece by a research agency head. Primary source is the Market Research Society Global Data Quality initiative; not opened, date and sample unknown. Do not use the figure until the primary is checked
    - id: W11
      claim: Recruiting is one of the most failure-prone parts of research; a human must spot-check AI vetting and treat fraud flags as a starting point, not a verdict
      type: claim
      source: Recruiting research participants with AI, Lyssna
      url: https://www.lyssna.com/guides/ai-in-user-research-guide/recruiting-research-participants-with-ai/
      source_date: 2026-09-17
      checked_on: 2026-11-20
      age_flag: false
      status: "verified"
      note: Research platform vendor with a participant panel. No author named
    - id: W12
      claim: Finding qualified participants, time to recruit and participant quality are the top recruiting challenges
      type: claim
      source: The Modern Guide to Research Participant Recruitment, User Interviews
      url: https://www.userinterviews.com/participant-recruitment-guide
      source_date: unknown (copyright 2026)
      checked_on: 2026-11-20
      age_flag: false
      status: "verified"
      note: Recruiting vendor. Its figures (54% cite participant quality) come from its 2025 State of User Research report and fail the 2026 rule. Use as a claim only
  open_gaps:
    - A 2026 primary statistic on recruiting time
    - Hardware and internal PM recruiting sources
  gate_1_decision: ""

- id: mr-wf-06
  workflow: Build and refresh a sourced market size and segment evidence model
  topic_area: Market and segment sizing
  trigger_and_cadence: A new market or segment question, then a refresh each quarter or when new data appears
  input: The market question, segment definitions, analyst and public data sources, and the PM's own customer data
  output: A top-down and bottom-up size model with each number linked to its source and date, an assumptions list with risk ratings, a "what changed" note on refresh, and a flag report for the PM
  pm_decision_informed: Which segment is large and reachable enough to pursue, and which to drop
  bottleneck:
    description: The number the PM needs is rarely in any report, so the PM builds it from gaps, conflicting sources and assumptions. Secondary research takes a lot of time, sources often copy one another, and the data goes stale, so the work repeats
    pdlc_stage: Focus
    focus_area: Market Definition
    sources: [W9, W19]
  scores:
    judgment: medium to high. Which assumptions to accept is a judgment
    repetition: medium. Each new question and each quarterly refresh
    ai_candidate: partly. The agent does the source search, the source checks and the arithmetic; the PM owns the assumptions
  split:
    agent_does:
      - Find data points for each input of the model
      - Record each source, its date and what it is based on
      - Build the top-down and bottom-up estimates
      - Mark where the two estimates differ by more than the set range
      - On refresh, find new data and report what changed
      - Send flags to the PM
    pm_manages:
      brief: Job, market question, segment definitions, approved source types, the maximum source age, output format
      quality_checks:
        - Each number has a source, a date and a link
        - Each source is checked for the study it repeats
        - Each assumption has a risk rating
      handoff_rules:
        - Two sources that differ by more than the set range
        - A number that rests on one source only
        - A source older than the maximum age
      audit: 3 numbers per model, traced back to the original source by hand
    pm_decides:
      - The segment definitions
      - Which assumptions to accept
      - Which segment goes forward
  ai_error_to_catch: Fake triangulation. Two articles that quote one analyst report are counted as two confirming sources, so a weak number looks strong. The "each number has a source" check passes. The trace-back audit finds it
  contexts:
    hardware: Sizing by installed base, units and replacement cycles instead of seats. gap, no source found
    internal_pm: Sizing the internal market (teams, users, workflows) for an internal platform. gap, no source found
    industry_notes:
      - "health care and FinTech: regulatory and licensing data shape the reachable market. Not yet researched"
  proposed_lab:
    goal: Extend the course agent to build a sourced size model and flag weak and conflicting numbers
    core_message: The agent can find numbers fast. The PM's job is to know which numbers to trust
    build_type: agent (extend the module 1 agent)
    core_path_no_connectors: partly. Web search is needed for live sources. Core path uses a source pack from the fallback case; web search is the stretch
    data_safety: "Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)"
    platforms:
      claude: Skill with the model template and source rules
      chatgpt: Project with the model template (E9 not verified)
      copilot: Agent with the model template as an embedded file (E6); web grounding not verified
      gemini: Gemini skill with the template (E8). Deep research does not work in skills
    stretch: Let the agent search the web for new data each quarter
    registry_check: MKT-2026 core course teaches segmentation and the segment evaluation worksheet. This lab does not reteach segmentation; it builds and audits a sourced size model. Category is Focus, not Market; Dan to decide fit with the Market course scope. The source rules mirror this repo's own research rules, which is a useful teaching point
  evidence:
    - id: W9
      claim: The needed market number rarely exists in reports; sources conflict and often quote one source; secondary research takes a lot of time
      type: claim
      source: Common challenges of TAM research, Joe Radwich, Product Marketing Alliance
      url: https://www.productmarketingalliance.com/common-challenges-of-tam-research/
      source_date: 2025-04-21
      checked_on: 2026-11-20
      age_flag: true
      status: "verified"
      note: Practitioner community. Older than 12 months; Dan decides
    - id: W19
      claim: Market sizing rests on unverified assumptions, needs a lot of desk research and several iterations, and data goes stale fast
      type: claim
      source: An innovative approach to market sizing, Bart Krawczyk, LogRocket
      url: https://blog.logrocket.com/product-management/innovative-approach-to-market-sizing
      source_date: 2023-12-20
      checked_on: 2026-11-20
      age_flag: true
      status: "verified"
      note: Practitioner blog. First published 2023-04-04. Older than 12 months; Dan decides. Independent of W9
  open_gaps:
    - A 2026 source for the market sizing burden
    - Confirm the Market course may include a Focus category workflow
  gate_1_decision: ""

- id: mr-wf-07
  workflow: Keep the problem and assumption evidence register current after each piece of new evidence
  topic_area: Problem validation
  trigger_and_cadence: Each new input (interview batch, survey wave, win/loss batch, test result). Assumption, weekly
  input: The register of market problems and key assumptions, and the new evidence (the insight log, survey results, win/loss report)
  output: The updated register (each assumption with evidence for, evidence against, segment, strength and last-tested date), a "status changed" list, a "stale or untested" list, and a flag report for the PM
  pm_decision_informed: Which problems count as validated, and what to test next
  bottleneck:
    description: Discovery makes many artifacts, so teams get overwhelmed and lose track of what has been tested and with whom. Tracking feels like extra work, so assumptions stay untested. One source author only
    pdlc_stage: Market
    focus_area: Market Problems
    sources: [W14, W15]
  scores:
    judgment: high for status changes; low for the linking and dating
    repetition: high. Every new piece of evidence
    ai_candidate: partly. The agent links evidence and proposes status; the PM decides status
  split:
    agent_does:
      - Link each new finding to the problems and assumptions it touches
      - Mark it as evidence for or against, with segment and source
      - Propose a status change with the reason
      - List assumptions not tested in the set number of weeks
      - Send flags to the PM
    pm_manages:
      brief: Job, register format, status levels and the evidence each needs, staleness limit
      quality_checks:
        - Each evidence link cites its source and date
        - A proposed status meets the evidence rule for that level
        - The segment of the evidence matches the segment of the assumption
      handoff_rules:
        - Every proposed status change
        - New evidence against a "validated" problem
      audit: 3 status changes per month, traced to the evidence
    pm_decides:
      - Each status change
      - What to test next
      - When to stop testing a problem
  ai_error_to_catch: Wrong-segment evidence. The agent marks an assumption about mid-size buyers as validated using evidence from enterprise buyers. The source and date check passes. The segment check misses it because the segment field was left blank in the insight. The audit finds it
  contexts:
    hardware: Assumptions often need lab, pilot or field test results, which arrive slowly. gap, no source found
    internal_pm: Assumptions about internal adoption and workarounds. gap, no source found
    industry_notes: []
  proposed_lab:
    goal: Extend the course agent to update the evidence register from the other labs' outputs
    core_message: The agent can propose a status; only the PM can call a problem validated
    build_type: agent (extend the module 1 agent)
    core_path_no_connectors: yes. The learner uploads the register and the outputs of earlier labs
    data_safety: "Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)"
    platforms:
      claude: Skill with the register format and status rules
      chatgpt: Project with the register (E9 not verified)
      copilot: Agent with the register as an embedded file (E6)
      gemini: Gemini skill with the register (E8)
    stretch: Keep the register in a shared file the agent updates in place, where allowed
    registry_check: PDW-AI tags problem statements "NOT YET VALIDATED" and teaches validation basics. This row does not reteach those; it keeps a register current over time. Risk of overlap is medium; Dan to decide. Good capstone, because it joins the outputs of the other labs
  evidence:
    - id: W14
      claim: Discovery work makes many artifacts and teams get overwhelmed by how much they generate; archiving gets neglected
      type: claim
      source: Keeping track of discovery, Teresa Torres, Product Talk
      url: https://www.producttalk.org/keeping-track-of-discovery.md
      source_date: 2026-09-29
      checked_on: 2026-11-20
      age_flag: false
      status: "not verified"
      note: Practitioner. First published 2022-10-05, updated 2026-09-29. Same author as W15 and E5
    - id: W15
      claim: Teams think they lack time for assumption testing because it is important but not urgent
      type: claim
      source: Assumption testing, Teresa Torres, Product Talk
      url: https://www.producttalk.org/assumption-testing.md
      source_date: 2026-09-30
      checked_on: 2026-11-20
      age_flag: false
      status: "not verified"
      note: Same author as W14, so W14 and W15 count as one source. It does not say tracking itself is the burden
  open_gaps:
    - A second independent source that describes the tracking burden
  gate_1_decision: ""

- id: mr-wf-08
  workflow: Turn each round of concept or prototype tests into a result per hypothesis
  topic_area: Solution validation
  trigger_and_cadence: Each round of concept tests, unmoderated tests or pilot sessions. Assumption, every 2 to 4 weeks during validation
  input: Session transcripts or notes, task results, the test plan with hypotheses and pass criteria
  output: A result per hypothesis (pass, fail, unclear) with evidence, stated preference set apart from observed behavior, and a flag report for the PM
  pm_decision_informed: Which concept goes forward, changes or stops
  bottleneck:
    description: Qualitative test cycles take weeks. Transcription, coding (2 to 3 hours per interview) and reporting add days, so concept reviews close before findings arrive. One vendor source with no primary data
    pdlc_stage: Planning
    focus_area: Ideation
    sources: [W16]
  scores:
    judgment: medium to high. Pass criteria are set in advance; reading mixed results needs the PM
    repetition: medium to high. Every session in each round
    ai_candidate: partly
  split:
    agent_does:
      - Code each session against the hypotheses
      - Separate what people said from what they did
      - Score each hypothesis against its pass criteria
      - Send flags to the PM
    pm_manages:
      brief: Job, hypotheses, pass criteria, output format
      quality_checks:
        - Each result cites sessions and quotes
        - Stated and observed evidence are in separate columns
      handoff_rules:
        - Stated preference and behavior disagree
        - A result that rests on fewer sessions than the brief allows
      audit: 2 sessions per round, read in full
    pm_decides:
      - The hypotheses and pass criteria
      - Go, change or stop for each concept
  ai_error_to_catch: Stated preference read as a pass. "8 of 10 liked it" scores the hypothesis as passed, but only 3 completed the task or agreed to pay. The quote check passes. The audit of full sessions finds it
  contexts:
    hardware: Tests with physical prototypes and field pilots. gap, no source found
    internal_pm: Pilots of an internal tool with one team. gap, no source found
    industry_notes:
      - "health care: tests with clinicians or patients need consent and privacy rules. Not yet researched"
  proposed_lab:
    goal: Extend the course agent to score a round of concept tests against the hypotheses
    core_message: Set the pass criteria before the agent reads the sessions
    build_type: agent (extend the module 1 agent)
    core_path_no_connectors: yes. The learner uploads session notes from the fallback case
    data_safety: "Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)"
    platforms:
      claude: Skill with the hypotheses and pass criteria
      chatgpt: Project (E9 not verified)
      copilot: Agent with the test plan as an embedded file (E6)
      gemini: Gemini skill (E8)
    stretch: Read video transcripts from a testing tool where connected (not verified)
    registry_check: Category is Planning / Ideation, not Market; Dan to decide scope. Close to the Product Discovery and Design courses; check that no other Advanced AI course plans this lab. No workshop overlap found
  evidence:
    - id: W16
      claim: Qualitative research takes about 6 weeks; manual coding takes 2 to 3 hours per interview; concept reviews close before findings arrive
      type: claim
      source: Is Qualitative Research Time-Consuming? A Framework for Research Operations Managers, Florian Hendrickx, Conveo
      url: https://conveo.ai/insights/is-qualitative-research-time-consuming
      source_date: 2026-08-18
      checked_on: 2026-11-20
      age_flag: false
      status: "not verified"
      note: AI research vendor. No primary data for any figure ("based on typical enterprise studies"). Do not use the figures
  open_gaps:
    - A second, non-vendor source for the concept test burden
    - Confirm Planning / Ideation fits the Market course
  gate_1_decision: ""

- id: mr-wf-09
  workflow: Answer stakeholder questions from past research with sourced, dated answers
  topic_area: Research sharing and reuse
  trigger_and_cadence: Stakeholders ask "what do we know about X?" in Slack, email and planning meetings. Assumption, several questions a week
  input: The question, the insight log, the evidence register, past study reports
  output: A short answer with each claim linked to a study, its date and segment, a "what we do not know" line, and a flag report for the PM
  pm_decision_informed: Whether a question needs new research or can be answered now, and what to tell the stakeholder
  bottleneck:
    description: Contributing to and searching repositories is too much work, so people cannot find past insights. Stakeholders do not remember study names, answers get lost, and teams commission new studies on questions already answered
    pdlc_stage: Market
    focus_area: Market Problems
    sources: [W13, W20]
  scores:
    judgment: medium. Finding and citing is low judgment; saying whether old research still holds needs the PM
    repetition: high. Many questions each week
    ai_candidate: yes
  split:
    agent_does:
      - Search the log, register and reports for the question
      - Draft a short answer with a citation for each claim
      - State the date and segment of each source
      - Write what the research does not cover
      - Send flags to the PM
    pm_manages:
      brief: Job, sources in scope, citation format, the maximum source age before a warning, answer length
      quality_checks:
        - Each claim has a citation to a study in scope
        - Each cited study shows its date and segment
        - The answer has a "what we do not know" line
      handoff_rules:
        - The only evidence is older than the age limit
        - Sources disagree
        - The question needs new research
      audit: 2 answers per week, each citation opened and checked
    pm_decides:
      - Whether to send, change or hold each answer
      - Whether to start new research
  ai_error_to_catch: Old research presented as current. The agent answers from a 2-year-old study for another segment. The citation check passes and the date is shown in small print, but the answer text says "buyers want". The audit finds that the answer goes past its evidence
  contexts:
    hardware: Questions from engineering and field teams about installed-base needs. gap, no source found
    internal_pm: Questions from internal teams about why the platform works the way it does. gap, no source found
    industry_notes:
      - "data safety: the research store can hold customer names and quotes. Share answers only inside approved tools"
  proposed_lab:
    goal: Extend the course agent to answer stakeholder questions from the team's own research store
    core_message: An answer is only as good as what it admits it does not know
    build_type: agent (extend the module 1 agent with the research store as knowledge)
    core_path_no_connectors: yes. The learner uploads the insight log and two past reports
    data_safety: "Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)"
    platforms:
      claude: Project with the research files as knowledge and a skill for the answer format
      chatgpt: Project with the files (E9 not verified)
      copilot: Agent with the files as embedded knowledge (E6); sharing the agent with stakeholders not verified
      gemini: Gemini skill with the files (E8); 100 MB file limit
    stretch: Share the agent with stakeholders so they ask it directly, where the company allows
    registry_check: No workshop teaches research reuse. AI Agents course teaches boundaries; this lab applies them to what the agent may answer. Uses the log from mr-wf-01, so it suits the one-agent design
  evidence:
    - id: W13
      claim: Research repositories fail because contributing and tagging is too much work and people cannot find or reuse past insights
      type: claim
      source: Why Research Repositories Fail and How to Get Them Right, Maria Rosala, Nielsen Norman Group
      url: https://www.nngroup.com/articles/why-repositories-fail/
      source_date: 2024-07-26
      checked_on: 2026-11-20
      age_flag: true
      status: "verified"
      note: Independent research firm. Based on a 2024 survey of 400+ UX and ReOps staff, so its figures fail the 2026 rule. Use as a claim only. Older than 12 months; Dan decides
    - id: W20
      claim: Repositories become unvisited archives; PMs do not remember study names; teams commission new studies on questions already answered
      type: claim
      source: Your research repository is probably a graveyard, UserTesting
      url: https://www.usertesting.com/blog/your-research-repository-probably-graveyard-heres-how-change-ai
      source_date: 2026-07-08
      checked_on: 2026-11-20
      age_flag: false
