      copilot: Agent in Copilot agent builder with the brief and templates as embedded files (Market Research ledger E6)
      gemini: Gemini skill with the brief and templates (Market Research ledger E8)
    stretch: Read the roadmap from a connected tool, where the platform allows (not verified)
    planted_error: A weak item hidden inside a strong theme
    success_check: The trace table lists the planted item as below the 'validated' rule after the brief is fixed
    registry_check: 'Focus 28.01 teaches outcome not output, timeframe not date, problems not features, and has an optional one-pass AI activity on one roadmap for two audiences. This row starts after: quarterly refresh with traceability and an audit. PRW-AI teaches requirements; not used. Partner course Mastering the Product Roadmap maps here; Dan to check overlap'
