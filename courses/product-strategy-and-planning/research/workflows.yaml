- id: sp-wf-10
  workflow: Track realized outcomes against the business case and OKRs each month, and flag where investment should change
  topic_area: Strategy, roadmaps, planning
  capability_skill: 2.3 Business Case Development (competency 2.3E Success Definition and Measurement)
  trigger_and_cadence: Each month after launch or after a funding decision, and before each quarterly review
  input: The business case success measures and baselines, the OKRs, metric exports, and last month's report
  output: 'An outcome report: each measure vs baseline and target, trend, data source, confidence; outputs kept apart from outcomes; and a flag report'
  pm_decision_informed: Whether to keep, change or stop investment in each product or initiative
  bottleneck:
    description: After approval, few teams compare results with the business case baseline. Reports rely on manual status updates, output measures stand in for outcomes, and evidence is weak or out of date. Few organizations fund by outcomes
    pdlc_stage: Business
    focus_area: Business Outcomes
    sources:
    - W23
    - W1
    sources_check: pass. W23 (2026) and W1 (2026, with primary W2) are independent
  scores:
    judgment: medium. Measuring is rule-based; reading why results moved is not
    repetition: high. Every month, every measure
    ai_candidate: 'yes'
  split:
    agent_does:
    - Pull the current value of each measure from its source
    - Compare with baseline, target and last month
    - Mark each measure as outcome or output
    - Note data gaps and stale data
    - Send flags to the PM
    pm_manages:
      brief: Job, the measures with baseline, target and source, the rule for outcome vs output, output format
      quality_checks:
      - Each value has a source and a date
      - Each measure is compared with its baseline
      - Each measure is labeled outcome or output
      handoff_rules:
      - A measure off target by more than the set range for 2 months
      - A measure with no current data
      - An outcome measure with no change while its outputs grow
      audit: '2 ''on track'' measures per month: check that the metric measures the outcome in the business case'
    pm_decides:
    - Which measures count as success
    - Whether to keep, change or stop investment
    - What to tell leaders
    ai_error_to_catch: Output counted as outcome. The key result 'reduce onboarding time' is reported on track using 'onboarding guide shipped' and 'users enrolled', because the metric names match. Each value has a source and a label, so the checks pass. The audit finds the metric does not measure the outcome
  contexts:
    hardware: gap. Hardware outcomes (field failure rate, service cost, attach rate) fit well, but no source found
    internal_pm: Partial. W23 covers benefits tracking for internal digital and equipment investments (public sector)
    industry_notes:
    - 'health care: outcome data can include patient data. Use aggregated data only. Not yet researched'
  proposed_lab:
    goal: Extend the course agent to track outcomes against the business case each month
    core_message: Shipped is not success. The agent tracks outcomes; the PM decides what to fund
    build_type: agent (extend the course agent built in module 1)
    core_path_no_connectors: yes. The learner uploads a metrics export from the fallback case
    data_safety: 'Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)'
    platforms:
      claude: Skill or Project with the brief, the templates and the rules
      chatgpt: Project with the brief and templates (Market Research ledger E9, not verified)
      copilot: Agent in Copilot agent builder with the brief and templates as embedded files (Market Research ledger E6)
      gemini: Gemini skill with the brief and templates (Market Research ledger E8)
    stretch: Run each month on a schedule, where the platform allows (not verified; CAW-AI already teaches scheduled tasks, so use new slides)
    planted_error: An output metric reported as a key result
    success_check: The report keeps outcomes and outputs apart and the audit finds the planted metric
    registry_check: 'Focus 28.01 teaches success measures; Build 28.01 teaches the metrics story; MKT-2026 teaches marketing metrics. This row starts after measures exist: monthly tracking against the business case with checks and an audit. Closes the loop with sp-wf-05. Scheduled run is a stretch with new slides (CAW-AI overlap)'
    pragmatic_fit: Good fit. The Framework Business Outcomes box monitors realized results against Measurement to inform investment
  evidence:
  - id: W23
    claim: 'After an investment goes live, reviewers check if business case benefits are realized: warning signs are output measures that only show delivery, weak or outdated evidence, reporting without action, unclear attribution, double counting, and no comparison to the business case baseline and forecast. Guidance suggests annual tracking for up to 3 years'
