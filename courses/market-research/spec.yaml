glossary:
  - { term: agent manager, meaning: "The learner's role. Writes the brief, sets checks and hand-off rules, reviews the flag report, audits" }
  - { term: Market Evidence Agent, meaning: "The one course agent. Built in module 1, one new job per module" }
  - { term: job, meaning: "One workflow the agent runs (insight log, win/loss, weekly feedback, alternatives map, stakeholder answers). One job card per job" }
  - { term: brief, meaning: "The agent's instructions: job, inputs, code book, quality checks, hand-off rules, output format, done criteria" }
  - { term: code book, meaning: "The list of codes and definitions the agent applies (problems, drivers, tags)" }
  - { term: quality check, meaning: "A test the agent runs on its own output before it reports, for example each quote found word for word" }
  - { term: hand-off rule, meaning: "A rule that says when the agent stops and gives an item to the PM, or what passes from one job to the next" }
  - { term: flag report, meaning: "The short list of items the agent hands to the PM to decide" }
  - { term: audit, meaning: "The PM checks a random sample of agent output against the sources" }
  - { term: tuned brief, meaning: "The brief after the PM adds a rule for what the audit found" }
  - { term: insight log, meaning: "The agent's running record of market problems and insights. Modules 1 and 3 write to it" }
  - { term: driver log, meaning: "The win/loss record per deal: primary and secondary drivers, alternative chosen, buyer quotes" }
  - { term: match rate, meaning: "How often the CRM loss reason matches the buyer's reason. Never 'truth rate' (PA-04)" }
  - { term: alternatives map, meaning: "What buyers chose instead: named competitors, substitutes, workarounds and do nothing, each traced to evidence" }
  - { term: single source and emerging, meaning: "Labels for an insight below the PM's bar. Kept in the log for trend tracking. Never called a pattern" }
  - { term: PM-held and AI-moderated, meaning: "Source labels for interviews. A segment with no PM-held interview goes to the flag report (PA-02)" }
  - { term: no fit, meaning: "The agent's answer when an item fits no code or tag. Better than a guess" }
  - { term: status proposal, meaning: "The agent proposes whether a problem has enough evidence. Only the PM calls a problem validated" }
  - { term: catch-up kit, meaning: "The brief text and knowledge files at the start of a module. Rebuild the agent in about 5 minutes" }
  - { term: planted error, meaning: "One AI error placed in each lab's case data. Learners find it in the audit" }
  - { term: rung, meaning: "A step on the autonomy ladder: hand-run batch, recurring run, hand-off between jobs" }
  - { term: category, meaning: "Pragmatic Framework 2027 category (here, Market). Say category, not life cycle stage (PA-08)" }

voice:
  tone: Practical, direct, peer to peer with experienced PMs. Real examples. Explain jargon once
  writing: ASD-STE100 for directions, 20 words or fewer per sentence, one action per step, no em dashes or en dashes
  examples_from: [software, FinTech, health care, manufacturing, hardware (priority), services, internal product management (priority)]
  stories: Story slots use stories from client teams, executives and Pragmatic's work with companies. Never the instructor's own experience (decision 43)
  talk_track: Complete enough for an instructor who did not build the course (decision 45). Slide notes are POINT then Talk Track. Activity talk tracks start "The goal of this activity is"
  terms_never_used:
    - exceptions, escalations (Pragmatic focus area names; say flags, flag report, hand-off rules)
    - magic number as a rule (say "the PM sets the bar")
    - truth rate (say match rate)
    - Gems, custom GPTs (say Gemini skills, ChatGPT Projects)
    - Playbook method (not taught; markdown files may be workbook handouts)
    - life cycle stage or pdlc_stage with learners (say category)
    - old Framework names from the MKT deck (2027 terms only, PA-07)
  claims_on_slides: No speed figure from vendor data (E1, E2). No win/loss figure (W1, W2 claims only). No E13 figure. Stats need a 2026 primary source

settings:
  capability_map: off

monday_value:   # quality bar 3: 3 or more working builds per learner
  builds_taken_home:
    - The Market Evidence Agent with five jobs, saved on the learner's platform
    - Insight log job run on the learner's own interviews (module 1)
    - Win/loss job with the learner's deal export (module 2)
    - Weekly feedback job (module 3)
    - Stakeholder answer job with the learner's past reports (module 5)
  templates: kit-final plus each module kit, the brief template, the job cards and the audit checklist

