- id: sp-wf-14
  candidate: C
  replaces: sp-wf-02 (candidate, rejected)
  workflow: When a competitor ships or changes price, check which problem backlog items, bets and business case assumptions are affected
  topic_area: Strategy, roadmaps, planning
  capability_skill: '2.2 Opportunity Prioritization (primary box Competitive Landscape) and 2.3 Business Case Development (the assumption register in sp-wf-05 is the closer home)'
  trigger_and_cadence: Each material competitor launch or price change. Assumption, a few times a quarter
  input: The competitor event with sources, the problem backlog, the current bets, and the business case assumption register
  output: 'An impact note: which backlog items, bets and assumptions the event touches, with the evidence, and a flag report'
  pm_decision_informed: Whether any bet, assumption or plan needs a new look
  bottleneck:
    description: 'Teams react to competitor news one item at a time and spin without a filter. Connecting competitive insight to decisions and measurable impact is a known hurdle for intelligence teams. No 2026 source found that describes the product-side burden of tracing a competitor move to backlog items or business case assumptions'
    pdlc_stage: Market
    focus_area: Competitive Landscape
    sources:
    - W34
    sources_check: 'fail. W34 (Forrester, signed, 2026-01-23, 21 organizations) says connecting intelligence to measurable impact is one of the field''s biggest hurdles, from the intelligence team side. W35 (Crayon, 2026) is about sales readiness, not product. The CAW-AI deck states the burden ("most teams react to competitor news one item at a time"), but it is Dan''s own workshop, not an independent source'
  scores:
    judgment: high. Reading what a competitor move means for a bet is close to strategy
    repetition: low to medium. Event-driven
    ai_candidate: 'partly. Tracing is rule-based; meaning is strategic'
  split:
    agent_does:
    - Separate what shipped from what was only announced
    - List backlog items, bets and assumptions that name the same problem or segment
    - Quote the assumption text the event touches
    - Send flags to the PM
    pm_manages:
      brief: 'Job, the event sources allowed, the assumption register, the rule that the agent never rates threat or recommends a response'
      quality_checks:
      - Each link quotes the assumption or backlog text
      - Each event is marked shipped or announced, with its source
      handoff_rules:
      - Any event that touches a business case assumption
      audit: Trace 2 links by hand to the source
    pm_decides:
    - Whether a bet or assumption changes
    - Whether to respond at all
    ai_error_to_catch: 'Announced read as shipped: a price page draft reported in the press is linked as a live price change. Same error family as the CAW-AI threat test (shipped, announced with a date, talk with no date)'
  contexts:
    hardware: gap. Not searched in this run (budget spent on A and B)
    internal_pm: 'gap. For internal products the "competitor" is a buy option or a shadow tool; this belongs to the Buy, Build or Partner row sp-wf-06 (deferred)'
    industry_notes: []
  proposed_lab:
    goal: Not proposed
    core_message: Not proposed
    build_type: none
    core_path_no_connectors: not assessed
    data_safety: 'Use an approved tool only. No client data, PHI or PII in a tool the company has not approved'
    platforms:
      claude: not assessed
      chatgpt: not assessed
      copilot: not assessed
      gemini: not assessed
    stretch: 'Option for Dan: add "a competitor event" as one trigger type for the sp-wf-05 assumption register red-team, with no competitive watch'
    planted_error: not proposed
    success_check: not proposed
    registry_check: 'Reject under house rule 11. CAW-AI module 3 (competitive signal watch, weekly) tests each competitor item against the company''s three goals and sorts it into noise, watch, attention or critical, then the learner decides to act. AI-AGENTS runs the Competitive Intel Watchdog (assess request, strategy score, severity, log, Slack update). This row is the same job with a different target list (backlog, bets, assumptions). Focus 28.01 has a one-pass AI competitive landscape. Also close to Dan''s strategy rule: deciding what a competitor move means for a bet is strategy work'
    pragmatic_fit: 'Best box fit for 2.2 (primary box Competitive Landscape), but blocked by overlap and evidence'
  evidence:
