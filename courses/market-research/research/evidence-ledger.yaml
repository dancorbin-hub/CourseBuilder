# Evidence ledger, course market-research. Stage 1, track 4 (evidence researcher).
# Written 2026-11-20. Schema: id, claim, type, source, url, source_date, checked_on, age_flag, status, note.
# E1 to E9 come from worked-example-row.yaml. Their ids are kept.
# type: statistic | study | claim | case_study | tool-feature
# vendor: true when the publisher sells a product or service in this area, or the page is a vendor customer story.
# age_flag: true = a non-statistic source older than 12 months (before 2025-11-20). unknown = page shows no date.
# Statistics and studies are all published in 2026 or later. Older items are under "dropped".
# Source details and independence notes are in sources.yaml (S ids).

merge_note: >-
  At finish (2026-11-20) platform-matrix.yaml exists with feature ids cg-01 to cg-08 (ChatGPT),
  cl-pj-01, cl-pj-02, cl-cl-03 to cl-cl-05, cl-fo-06, cl-sc-07 (Claude), gm-01 to gm-09 (Gemini) and
  mb-01 to mb-10 (Copilot agent builder). E6 to E9 may overlap these. workflows.yaml (W ids) and needs.md
  (N ids) did not exist yet. No ids are merged. Full merging happens later.

