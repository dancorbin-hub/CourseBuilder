      authors (paper or preprint) was found. CHECK: the ledger claim says "seven leading LLMs". The abstract
      says "seven core business tensions". Both may be true (the zby summary lists 7 models), but the
      Verifier should confirm the wording before a slide uses "seven". The figures (under 2%, about 11%,
      about 19%) still come only from the third-party summary. Keep status partly verified
    url: https://www.ebsco.com/articles/business-and-management/2b719c91-ae1b-588d-9ad1-2be2f30e67ec/researchers-asked-llms-for-strategic-advice-they-got-trendslop-in-return

