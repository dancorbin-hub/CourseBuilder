  # ---------------- Gemini ----------------
  - id: gm-01
    platform: gemini
    feature: Gemini skills (create with Gemini, from a template, or by uploading SKILL.md, a folder or a zip)
    plans: 18 or older, signed in to the Gemini app. Mobile, Mac and web apps. No subscription tier named
    limits: 100 MB total per skill. Name lowercase with hyphens. Not supported are legacy .doc, .xls, .ppt, audio, video, archives inside the skill, some code types. To update files, re-upload the whole skill. Scripts cannot use the internet. Unlimited skills, 100 active
