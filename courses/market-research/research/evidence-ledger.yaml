    source_id: [S18, S19]
    vendor: mixed. S18 not vendor; S19 vendor-funded
    url: https://www.norc.org/content/dam/norc-org/pdf2026/cpss-research-brief-fraud-lit-review.pdf
    source_date: 2026-04
    checked_on: 2026-11-20
    age_flag: false
    status: "partly verified"
    verifier_note: "NORC PDF not opened (web budget). Prolific side confirmed only through Retraction Watch (see E19)"
