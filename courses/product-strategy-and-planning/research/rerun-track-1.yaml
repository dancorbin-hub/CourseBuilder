#   1 Mind the Product, Product People on Prioritisation (rejected: published 2020-11-13, survey of 55, research rule 4)
#   2 Product-Led Alliance, The reprioritization trap (W25)
#   3 Pragmatic Institute, Managing Internal Feature Requests (rejected: no publish date, modified 2025-01-09;
#     does not describe scoring inconsistency, overrides or rescoring; Mike Savory, "constant flood of feature requests" only)
#   4 Product Coalition, Prioritization frameworks are just opinion laundering (W28, weak)
#   5 Grafana Labs, CERB scoring method (rejected: 2026-01-09, Dave Thompson; says top RICE scores were often
