    total_minutes: 450
    rows:
      - { time: "09:00", minutes: 25, item: "Course open: bond story, opening build check, course frame" }
      - { time: "09:25", minutes: 70, item: "Module 1: Run your first batch and manage it by flags" }
      - { time: "10:35", minutes: 15, item: Break }
      - { time: "10:50", minutes: 70, item: "Module 2: Win/loss and the match rate" }
      - { time: "12:00", minutes: 60, item: Lunch }
      - { time: "13:00", minutes: 60, item: "Module 3: The weekly run" }
      - { time: "14:00", minutes: 55, item: "Module 4: First hand-off, the alternatives map" }
