# Course spec: Advanced AI for Product Strategy and Planning (course id product-strategy-and-planning)
# Stage 2 draft (v0.1) by the course planner, 2026-11-26. Locked only when Dan approves Gate 2.
# Inputs: outline/stage-2-inputs.md (read first), research/gate-1-decisions.md (wins if files differ),
#   research/worked-example-row.yaml (sp-wf-09, approved), research/workflows.yaml (rows 03, 05, 07, 08, 10),
#   research/rerun-replacement-02.yaml (row 12), research/rerun-track-1.yaml (row 11), research/research-brief.md,
#   research/platform-matrix.yaml, research/bond-stories.md, research/alignment-log.yaml, shared/registry/registry.yaml.
# Format model: courses/market-research/spec.yaml. Syllabus pattern: outline/reference-mr-syllabus-approved.md.
# Companion file: outline/development-brief.md (decision 40).
# Where a fingerprinted research file and a Gate 1 decision differ, this spec follows the decision. See open_items.

course:
  id: product-strategy-and-planning
  title: Advanced AI for Product Strategy and Planning
  title_note: >-
    Planning here means annual and quarterly product planning. The course maps to Capability 2, Strategic
    Direction. (Gate 1 decision g. The title question goes to Pragmatic; see decisions_for_dan DD-03)
  status: draft
  version: 0.1
  drafted_on: 2026-11-26
  instructor: Dan Corbin (delivers, decision 45). Written so an instructor who did not build the course can deliver it
  offering_intent: Develop and Apply (decision 41)
  length: >-
    One day, 7.5 hours with lunch and breaks (360 teaching minutes). Also runs as two half days of 3.5 hours each,
    split after module 2 (195 teaching minutes each, 390 in total)
  modules: 5
  framework_boxes:   # Pragmatic Framework 2027 category / focus area. Learner text tags rows by box (decision g)
    - { module: 1, box: Focus / Product Portfolio }
    - { module: 2, box: Market / Market Problems, note: "Reply step touches Planning / Stakeholder Management" }
    - { module: 3, box: Business / Business Plan }
    - { module: 4, box: Focus / Product Roadmap, note: "workflows.yaml tags row 08 Planning / Stakeholder Management. With no audience drafting (decision c), the module sits in Product Roadmap. Dan to confirm (OI-07)" }
    - { module: 5, box: Business / Business Outcomes }
  capability_standards: { status: "proposed, Dan to confirm", capability: "2 Strategic Direction", detail: see capability_mapping }
  prerequisite_rule: >-
    Core courses are not prerequisites (Dan, PS-06). Use the Pragmatic terms (problem backlog, validated problem
    backlog, market, market segment, evaluator adoption, projected share) and define each one in this course. No "as
    in Focus" callbacks. No Focus examples
  themes:
    - Strategy is where product judgment is essential. The agent gathers evidence. The PM uses product sense, experience and judgment (Dan, 2026-11-26)
    - There is no magic number. The PM sets every range, tolerance and threshold in the brief. The agent reports evidence against it
    - Be great at product management before you are great at AI
    - The roadmap is direction. The release plan is the promise. The agent never turns one into the other
  aha_moment: >-
    Proposed (DD-08). Module 1: a shared firmware team planned at 100% in two programs. Every per-program check
    passes. The sum by team is 200%. Win/loss, the Market Research aha, is not in this course

promise: >-
  After this course, you can build and manage one AI agent that assembles your portfolio pack, request decisions,
  business case, roadmap changes and outcome reports with checked evidence, and you make every strategy, priority
  and investment call yourself.

course_objectives:
  - id: CO1
    text: Build a strategy evidence agent from a template on your platform and run it on your own planning inputs
  - id: CO2
    text: Write and tune the agent brief (job, inputs, quality checks, hand-off rules, output) after each audit, with every range and threshold set by you
  - id: CO3
    text: Decide each flag report item and audit a sample of agent output against its sources and its numbers
  - id: CO4
    text: >-
      Connect agent jobs so one job's output feeds the next, with hand-off rules that stop the agent before any
      strategy, priority, funding or release plan call
  - id: CO5
    text: >-
      Record each strategy, request, business case, roadmap and investment decision yourself, with a written reason
      that cites the evidence

learner_profile:
  audience: >-
    Experienced product managers, product leaders and portfolio or planning leads who run quarterly reviews,
    request intake, business cases, roadmaps or outcome reviews. Software, hardware, services and internal platform teams
  prerequisites: >-
    None. Pragmatic core courses are not prerequisites. Familiarity with building agents or skills is recommended.
    Module 1 has a fast-start card per platform. ChatGPT learners need ChatGPT Plus or higher (decision f1)
  readiness_checklist: >-
    Sent before class (decision 44). A checklist learners run, not a survey. It checks: the platform minimums below,
    ChatGPT plan (Plus or higher), Copilot agent creation permission and license or billing, Claude code execution
    and file creation on, web search on (Claude Team and Enterprise need owner opt-in), one test upload of a .xlsx
    file, and for Gemini, that the learner can open a Google Sheet copy
  platform_mix: Mixed in every class. Claude, ChatGPT and Microsoft Copilot first; Gemini second (decision 10). Breakout rooms group learners by platform
  platform_minimums:   # Gate 1 decision f (this course). The planner role file says "decision e"; in this course decision e is data safety
    claude:
      build: Project (instructions and knowledge files) on all plans. Custom skill as stretch (cl-pj-01, cl-cl-03)
      minimum: Any plan. Code execution and file creation must be on (cl-fo-06). An org owner can turn them off. If XLSX upload fails, use the CSV copy (cl-up-10)
      numeric_steps: Code execution on the course sheet. Output .xlsx (cl-fo-06; the vendor page does not state formulas, so the sheet template holds them)
    chatgpt:
      build: Project (instructions and files) (cg-01). Skills only on business plans, so skills are stretch (cg-04)
      minimum: ChatGPT Plus. A course prerequisite (Dan, decision f1, 2026-11-26). Day-of fallback, a Go learner pairs with a Plus learner
      numeric_steps: >-
        ChatGPT Work file output with formulas is the core path (cg-09, cg-10). ChatGPT Work is not available in a
        project with project-only memory (cg-14), so the card says which memory mode to use. Gate 2 proof G2-PF-02
      blind_run: The check sample runs in a new ChatGPT chat outside the project, so project memory does not leak run 1 into run 2 (decision f5, cg-14)
    copilot:
      build: Agent in Copilot agent builder (instructions up to 8,000 characters, embedded files) (mb-01, mb-02)
      minimum: Permission to create agents, plus a Microsoft 365 Copilot license or pay-as-you-go billing (mb-03). Not GCC. Copilot Cowork, Fabric and Copilot Studio not required (decision 26)
      numeric_steps: >-
        The learner uploads the sheet in chat each run and downloads the output in the same session (decision f3;
        mb-11 session only, mb-13). Case files for Copilot are .xlsx with one sheet each (mb-14). CSV is not allowed
        as embedded knowledge (mb-14). Gate 2 tests the code interpreter toggle and the embedded copy (mb-04, mb-15 conflict)
      copilot_chat_only: Learners with Copilot Chat only use a reduced path that runs one job at a time (see copilot_no_license_fallback)
    gemini:
      build: Gemini skill with instructions and files (gm-01, gm-03). Gems are now skills; the card says so (gm-02)
      minimum: Gemini app, personal or Workspace account. Do not use Canvas or Deep Research in a skill (gm-06)
      numeric_steps: >-
        A Google Sheet template with formulas. The skill writes the inputs and reads the results (decision f2). Gate 2
        tests one skill run that asks for a Sheet (G2-PF-04)
      market_size_source: Gemini learners upload the new source. No live search on the Gemini card (decision f4)
      file_update: To update a file in a skill, re-upload the whole skill (gm-01). Logs stay in chat during a lab; the learner re-uploads at the log save card
    copilot_no_license_fallback:
      who: Learners with Copilot Chat only, no license and no pay-as-you-go billing (mb-03)
      design: >-
        The fallback agent holds only the core brief and the current module's job card in its instructions (8,000
        characters or fewer, mb-01). Course design budget (not a vendor number): core brief 3,500 characters or
        fewer, job card 1,500 or fewer, one knowledge text 2,800 or fewer. Run files, sheets and logs are pasted or
        uploaded in chat each run
      what_is_lost: The hand-off between jobs (modules 4 and 5) happens through files the learner pastes, not inside one agent. The card says so
      gate_2_risk: Not verified. Gate 2 proof G2-PF-05 measures each kit. If upload and paste both fail, the learner pairs with a learner on another platform
  stretch_scope:
    core_path: The same on all 4 platforms in every lab
    stretch_rule: Stretch steps only on the step cards of platforms whose features Stage 3 verifies with a dated vendor doc and a test
    live_search: Market size refresh by live search is stretch on Claude, ChatGPT and Copilot only (decision f4). One link per number
    schedule: Stretch only, where verified (cl-sc-07, cg-06, mb-06, gm-07 are not verified). New slides; not the CAW-AI setup slide
    out_of_scope_at_launch: [Copilot Studio, Power Automate, Google Antigravity]
  data_access_limits:
    - The core path of every lab needs no connectors. Learners upload or paste files
    - Learners follow the data safety note and the data check card in every lab (see data_safety_note)
    - Learners who cannot use their own work use the Larkspan case data
    - A "know before you design" slide in the course open names company limits (approved tools, connectors, sharing, code execution, web search)

data_safety_note:   # Gate 1 decision e (option 2, provisional). Classroom design for Gate 2: gate_2_designs.decision_e
  status: provisional (Dan, decision e, 2026-11-26). Revisit at Gate 2 with the design in gate_2_designs.decision_e
  standard_text: >-
    Use an approved tool only. Do not put client data, health data protected by HIPAA or personal data (PII) into a
    tool your company has not approved. Do not put unreleased roadmaps or release dates, forecasts, pricing, supplier
    terms or other non-public financial data into a tool your company has not approved. Do not put confidential names
    in web search queries.
  teaching_point: >-
    With no audience drafting in the labs (decision c, option 1), the confidential content teaching point shrinks to
    one check in the module 4 commitment guard: no term from the PM's confidential terms list in any text marked for
    people outside the team
  running_log_point: >-
    An agent that keeps a pack, a request log, a register or a decision log stores sensitive data longer than a
    one-off prompt. At each log save card, decide what the log may keep and for how long
  placement: Lab brief slide, the top of each step card, and the data check card (if Dan picks design option B)

course_agent:   # house rule 12, decision 38
  name: Strategy Evidence Agent
  name_status: proposed, Dan to confirm (DD-04)
  idea: >-
    One agent for the whole course. Learners build it in module 1 from a template and add one job per module. The
    agent gathers, totals, traces and flags. The learner is the agent manager: writes the brief, sets quality checks
    and hand-off rules, reviews the flag report, audits and decides
  core_rule: >-
    The agent never sets, proposes, ranks or rewrites strategy. It never fills a decision field and never recommends
    funding, a priority, an investment change or a release date. Every job has a hand-off rule that stops the agent
    before such a step (Dan, decision b and course theme)
  no_magic_number: >-
    The PM writes every range, tolerance and threshold in the brief. The template leaves them blank. The case shows
    the Larkspan PM's choice for each rule, framed as a choice, not a standard
  manager_loop: [write the brief, set quality checks, set hand-off rules, run, review the flag report, audit a sample, decide and record the reason, tune the brief, run again]
  structure:
    instructions: Core brief (role, core rule, shared rules, flag report format, decision field rule, confidential terms list). Under 8,000 characters for Copilot (mb-01)
    job_cards: One file per job (portfolio pack, requests, business case, roadmap, outcome tracking). Uploaded as knowledge
    knowledge_file_budget: >-
      16 knowledge files or fewer at the end of the course, under the ChatGPT Plus and Copilot limit of 20 (cg-03,
      mb-02). The case builder counts the real files. Copilot gets .txt copies of .md files; they replace, not add
    sheets: >-
      Three course sheets with formulas: capacity sheet (module 1), business case sheet (module 3), outcome sheet
      (module 5). Each ships as .xlsx (one sheet each, for Copilot), a Google Sheet template (Gemini) and a CSV copy
      (decision f6). The agent writes inputs and reads results. The formulas keep calculations auditable (workbook 2.3)
    file_size: 30 MB or less per file in step cards (decision f6, cl-up-10 conflict)
  flag_report_format: >-
    One line per flag: flag type, record id, what the agent found, the evidence (source and date), and "PM decides".
    Never a recommended action
  growth:
    - module: 1
      adds: >-
        Portfolio pack job with the strategy consistency check. Brief v1 from the template: strategy overview, OKRs
        and KPIs, submission template, per-program capacity check, link check ("names what the work does"), flag
        report. The template has no check that totals a shared team across programs. The learner adds it after the
        audit (brief v2)
      files_after: [core instructions, job-card-portfolio-pack, strategy-overview, okrs-kpis, capacity-sheet]
    - module: 2
      adds: >-
        Request job. Decision card template with a blank decision field. Reads the problem backlog, the stated
        strategy and OKRs, the current roadmap and the request decision log. Drafts replies only after the PM decides
      files_after: [job-card-requests, problem-backlog, request-decision-log, roadmap]
    - module: 3
      adds: >-
        Business case job. Assumption register, red team of the assumptions with the largest effect, sensitivity in
        the business case sheet, market size inputs from a source pack, denominator check, "what changed" note
      files_after: [job-card-business-case, business-case, business-case-sheet, source-pack]
    - module: 4
      adds: >-
        Roadmap job in two parts. Refresh: trace each item to a theme, a validated problem and a stated objective.
        Change: impact note, displacement, dependency hits, decision log entry with a blank decision field, standing
        commitment guard against the release plan. First hand-off between jobs: an approved request (module 2) and the
        capacity table (module 1) feed the change assessment
      files_after: [job-card-roadmap, release-plan, roadmap-decision-log]
    - module: 5
      adds: >-
        Outcome tracking job. Reads the business case baseline (module 3) and the OKRs (module 1). Monthly run. Keeps
        outcomes apart from outputs
      files_after: [job-card-outcomes, outcome-sheet]
  log_save_card:
    steps:
      - Decide what the log keeps and delete the rest
      - Replace the old log file in your agent's knowledge
    platform_notes:
      claude: Replace the file in project knowledge
      chatgpt: Replace the file in project files
      copilot: Replace the embedded file and select Update. No-license fallback keeps the log on your computer
      gemini: Re-upload the whole skill with the new log (gm-01)
  catch_up_kits:   # Text kit, no sharing feature needed. Rebuild in about 5 minutes. Gate 2 proof P1 to P3 test them
    rule: One kit per module. Each kit holds the brief text, job cards, knowledge files and sheets as they are at the start of that module, plus a one-page rebuild card per platform
    kits:
      - kit-m1-template: Starter template. Brief v1 (no shared-team total check), portfolio pack job card, Larkspan strategy overview, OKRs and KPIs, capacity sheet
      - kit-m2: State after module 1. Brief v2 (with the shared-team total check), adds the request job card, problem backlog, request decision log, roadmap
      - kit-m3: State after module 2. Adds the matching rule, the decided cards in the request decision log, the business case job card, business case, sheet and source pack
      - kit-m4: State after module 3. Adds the tuned business case brief, the roadmap job card, release plan, roadmap decision log
      - kit-m5: State after module 4. Adds the tuned roadmap brief and the decided change, the outcome job card and outcome sheet
      - kit-final: The complete agent with five jobs. Learners take it home to rebuild on their own work
    copilot_note: Each kit holds .txt copies of .md files and a fallback instructions text under 8,000 characters for learners with no Copilot license

autonomy_ladder:   # decision 35. Climbs across the day
  rungs:
    - rung: 1
      name: Hand-run batch
      meaning: The PM runs the agent on one batch, reads every flag and audits a sample
      modules: [1]
    - rung: 1 plus
      name: Hand-run batch with a decision checkpoint
      meaning: >-
        The agent stops part way, leaves the decision field blank and waits. It continues (drafts replies) only after
        the PM writes the decision and the reason
      modules: [2]
    - rung: 2
      name: Refresh with a "what changed" report
      meaning: >-
        The agent updates a living record (the assumption register) when new evidence arrives. The PM reads the
        "what changed" note and the flag report, not each assumption. Schedule or file trigger is stretch only
      modules: [3]
    - rung: 3
      name: Hand-off between jobs
      meaning: >-
        One job's output is the next job's input. An approved request (module 2) and the capacity table (module 1)
        feed the roadmap change assessment. A hand-off rule says what passes and what stops. Second agent is stretch
        only where verified
      modules: [4]
    - rung: 3 plus
      name: Monthly run across jobs
      meaning: >-
        The agent runs each month on new exports and reads other jobs' records (module 3 baseline, module 1 OKRs). The
        PM reads only the flag report and audits 2 measures. Schedule is stretch only
      modules: [5]

planted_error_fade:   # house rule 13, decision 34
  levels:
    - { module: 1, warning: told, slide_text: "This batch has one planted AI error. Find it in your audit." }
    - { module: 2, warning: hint, slide_text: "Audit before you approve." }
    - { module: 3, warning: hint, slide_text: "Audit before you approve." }
    - { module: 4, warning: hint, slide_text: "Audit before you approve." }
    - { module: 5, warning: none, slide_text: "" }
  reveal: The debrief of each lab reveals the error and asks which check or audit found it
  rule: >-
    Each error lives in the case data and passes the agent's own quality checks and hand-off rules, so only the audit
    finds it. The success check on the lab brief slide is general. The error-specific pass condition is in the debrief only

module_arc:   # PRD module arc, 40/60 split per module
  steps:
    - { step: "Why this matters (optional open), the workflow and its bottleneck", mode: instructor-led }
    - { step: "Live build demo on one platform (this module's extension only)", mode: instructor-led }
    - { step: "Build pattern and lab brief (goal, data safety, success check, planted error warning)", mode: instructor-led }
    - { step: "Hands-on lab in platform breakout rooms", mode: hands-on }
    - { step: "Debrief, error reveal, check sample, \"what you do Monday\" close (optional), log save card", mode: hands-on }
  card_rules: >-
    6 steps or fewer. One action per step. 20 words or fewer per sentence. A step that sends files with a prompt is
    one action. Saving is not a step: the card header says how each platform saves. The data check card and "Start
    here with sample data" block sit outside the 6 steps. Core steps are the same on all 4 platform cards. Card text
    in this spec is the outline; Stage 3 writes the platform cards
  card_header: "Build and save your own agent. Share your screen only when someone is stuck."
  capability_map: Off (settings). If Dan turns it on, it goes in the debrief
  breakout_setup: Zoom breakout rooms by platform, 3 to 5 learners each. In person, tables by platform

course_open:
  minutes: 25
  instructor_led: 15
  hands_on: 10
  segments:
    - { minutes: 5, mode: instructor-led, item: "Bond story slot. Held to the module 1 deck build (Gate 1 decision k, lean Trendslop). No E3 numbers on slides until a licensed copy is read. See OI-01" }
    - { minutes: 10, mode: hands-on, item: "Opening build check, ends by minute 15. Each learner creates, saves and reopens a starter agent. A blocked learner changes platform or pairs with another learner" }
    - { minutes: 10, mode: instructor-led, item: "Course frame. You are the agent manager. The agent never sets strategy. The one course agent and its five jobs. Title note: planning means annual and quarterly product planning. Know before you design (company limits and the data safety note). Theme: be great at product management before you are great at AI" }
  build_check: >-
    Create a Project (Claude, ChatGPT), an agent (Copilot) or a skill (Gemini) named "Strategy Evidence Agent". Paste
    a 3-line starter instruction. Upload one sample .xlsx file. Ask it to list the sheet columns. Save, close and
    reopen. Pass: the agent answers after reopen
  half_days: Same 25 minutes at the start of day 1

course_close:
  minutes: 15
  instructor_led: 5
  hands_on: 10
  segments:
    - { minutes: 5, mode: instructor-led, item: "Recap of the manager loop. Themes: there is no magic number; the roadmap is direction, the release plan is the promise; the agent gathers, you decide" }
    - { minutes: 10, mode: hands-on, item: "Monday plan. Each learner picks the first job to run on their own work, sets an audit date and saves kit-final" }
  half_days: { minutes: 10, instructor_led: 4, hands_on: 6, note: "Same content. Recap 4 minutes, Monday plan 6 minutes" }

modules:
  - id: m1
    number: 1
    title: "The quarterly portfolio pack: is the work consistent with the strategy?"
    workflow_row: sp-wf-09
    folded_rows: [sp-wf-01]
    workflow: Assemble the quarterly portfolio review pack and check that planned work stays consistent with the stated strategy
    category: Focus
    focus_area: Product Portfolio
    capability_standards: { status: "proposed, Dan to confirm", skills: [2.1 Strategy Alignment], competencies: ["2.1B Explicit vs. Implicit Strategy Analysis"], box_role: "Product Portfolio has no primary skill; 2.1 is secondary (workbook)" }
    bottleneck: >-
      Portfolio reviews run on decks that are stale before the meeting. One person stitches updates by hand, so the
      meeting becomes data reconciliation instead of decisions. Leaders say strategy is clear, but few can show the
      work is linked to it (W1 with W2 as one source, W22; W3 for the strategy link gap)
    minutes: 70   # full day
    split: { instructor_led: 28, hands_on: 42, percent_instructor_led: 40 }
    arc:
      - { minutes: 8, mode: instructor-led, step: "Why this matters. Workflow and bottleneck. Strategy stays a human, forced-choice decision. Hardware note: shared firmware teams, test facilities and suppliers (W19, W22)" }
      - { minutes: 11, mode: instructor-led, step: "Live demo. Build the agent from the template. Add the strategy overview, OKRs and KPIs. Run Q3. Read the consistency section and the flag report" }
      - { minutes: 9, mode: instructor-led, step: "Build pattern and lab brief. The manager loop. The hand-off rule that stops before any funding, ranking or strategy change (new slides, house rule 14). Data safety and the data check card. Planted error is told" }
      - { minutes: 33, mode: hands-on, step: "Lab 1 (fast-start card per platform for learners new to the builder)" }
      - { minutes: 9, mode: hands-on, step: "Debrief. Reveal the error: the shared team at 200% (2 minutes). The aha: every per-program check passed. Check sample: each learner sends m1-check-sample in a new chat on the tuned brief and compares with the pass condition (3 minutes). Fund, pause or stop is yours; so is \"change the work or change the strategy\" (2 minutes). What you do Monday (1 minute). Log save card (1 minute)" }
    half_day:
      minutes: 80
      split: { instructor_led: 32, hands_on: 48, percent_instructor_led: 40 }
      arc_minutes: [9, 12, 11, 38, 10]
      note: Extra time goes to the fast-start card in the lab and to the fund, pause or stop discussion (3 minutes)
    rung: 1
    rung_name: Hand-run batch
    objectives:
      - { id: m1-o1, text: "Build the Strategy Evidence Agent from the template, with the strategy overview, OKRs and KPIs in its brief", practiced_in: "lab step 1 to 2" }
      - { id: m1-o2, text: "Decide each flag report item, including work with no clear link to a stated objective", practiced_in: "lab step 3" }
      - { id: m1-o3, text: "Audit capacity totals for 2 shared teams and 3 linked items, and record what you find", practiced_in: "lab step 4" }
      - { id: m1-o4, text: "Add a quality check for what the audit found, rerun, and make fund, pause or stop calls with a reason", practiced_in: "lab step 5 to 6 and debrief" }
    lab:
      goal: Delegate the quarterly pack to an agent that totals, links and flags, and manage it by its checks and flags
      core_message: The meeting is for decisions, not reconciliation. The agent reconciles and shows the evidence. You make the strategy and funding calls
      pm_decision: Which programs to fund, pause or stop, where capacity goes next quarter, and whether the work or the stated strategy needs to change
      build: Agent from the template (kit-m1-template)
      template_contents:
        quality_checks:
          - Each program has a submission dated this quarter
          - Each status matches the source system
          - Capacity per program is inside the team's total
          - Each link to an objective names what the work does, not only its tag
        handoff_rules:
          - A status that differs between the submission and the source system
          - Work with no clear link to a stated objective. The agent lists it and does not judge it
          - Any step that would recommend funding, ranking or a strategy change. The agent stops and hands it to the PM
        left_out_on_purpose: >-
          A check that totals each shared team across all programs. The per-program check passes for the shared
          firmware team in both programs. The learner adds the cross-program total after the audit (brief v2)
      card_steps:
        - Add the template brief and the strategy inputs to your agent
        - Send the Q3 team submissions with the prompt "Run the portfolio pack job"
        - Decide each item in the flag report
        - Audit capacity for 2 shared teams and 3 linked items
        - Add one quality check for what you found to the brief
        - Send the Q4 team submissions with the prompt "Run the portfolio pack job"
      platform_cards:
        claude: Project with the brief and knowledge files. Code execution totals the capacity sheet. Output .xlsx
        chatgpt: Project with the brief and files. Totals through ChatGPT Work file output with formulas (cg-09, cg-10)
        copilot: Agent with the brief and embedded files. Upload the capacity sheet (.xlsx) in chat each run. Download the output in the same session
        gemini: Gemini skill with the brief. Totals in the Google Sheet template with formulas
      fast_start_card: One per platform, with one annotated screenshot of where to start and which field the template goes in
      core_path_no_connectors: yes. Upload submissions, status export and capacity sheet
      inputs:
        own_work: Your team plan submissions, a status export and capacity by team for one quarter, with names and spend removed if the tool is not approved
        fallback_case: "Larkspan: strategy overview, OKRs and KPIs, capacity sheet (knowledge); m1-submissions-q3, m1-status-q3 (run); m1-submissions-q4 (run 2); m1-check-sample (check)"
      stretch:
        - Compare 2 PM-named funding scenarios ("fund X instead of Y") and show what slips (sp-wf-13; Gate 1 places it here). The PM names both scenarios; the agent does not propose one
        - Turn the job into a custom skill (Claude all plans, ChatGPT business plans, Gemini)
      planted_error:
        error: >-
          Capacity counted twice. The shared firmware team is planned at 100% in two programs (case: Probe X cellular
          and Hub firmware). Each program's ask is inside the team's total, so the per-program check passes. The audit
          sums by team and finds 200%
        warning: told
        fix: Add the quality check "Total each shared team across all programs. Send any team over its capacity to the flag report"
      success_check: >-
