      align_with_pragmatic: "Rename the field to pragmatic_category in shared/templates/workflow-row.yaml and all rows."
      update_message_ai_changed_work: "Not applicable."
      keep_both_explain: "Keep the field name in the repo. Always write 'category' in learner-facing text."
    recommendation: keep_both_explain
    recommendation_reason: "The schema and the worked example are approved. A rename touches approved files for a small gain."
    dan_decision: ""

