# Platform matrix, course market-research. Stage 1, track 2 (methods and platforms).
# Written 2026-11-20 by the methods and platforms researcher.
# Every feature is "not verified" until the Verifier checks it (role rule 5).
# Rechecks of the worked example evidence: E6 = mb-01, E7 = cl-cl-03, E8 = gm-01 and gm-02, E9 = cg-01.
#
# Field notes:
#   use_in_core_lab: yes = a core lab can use it with no connectors (upload files, run, read output).
#   source_date: the date the vendor page shows. Help Center pages show only a relative date
#     ("updated 3 days ago"). For those, we record the date that the relative date gives, with "approx".
#   checked_on: the date this researcher loaded the page.
#
# Learner build per platform (CLAUDE.md, PRD decision 12 and 31):
#   Claude: Project or skill. ChatGPT: Project or skill. Copilot: agent in agent builder. Gemini: skill.
#   No custom GPTs. No Gems.

checked_on: 2026-11-20
course: market-research

summary:
  - platform: claude
    core_lab_feasible: "yes"
    core_build: Project (instructions + knowledge files) on all plans; or a custom skill (zip upload) on all plans
    key_limit: Code execution must be on for skills and file output. 30 MB per uploaded file. Project sharing needs Team or Enterprise
  - platform: chatgpt
    core_build: Project (instructions + files) on all plans. Skills only on Business, Enterprise, Healthcare and Edu
    core_lab_feasible: "yes"
    key_limit: Files per project are 5 (Free), 25 (Go, Plus), 40 (Pro and business plans). Skills are not on Free, Go, Plus or Pro
  - platform: copilot
    core_build: Agent in agent builder with instructions (8,000 characters) and up to 20 embedded files
    core_lab_feasible: yes, with a condition
    key_limit: Embedded file knowledge needs a Microsoft 365 Copilot license or pay-as-you-go billing. Copilot Chat-only users without billing cannot use embedded files
  - platform: gemini
    core_build: Gemini skill with instructions and up to 100 MB of files
    core_lab_feasible: yes, with a condition
    key_limit: Workspace business account status conflicts between two Google pages (see gm-03). Canvas and Deep Research do not work in skills. File output is not documented

features:

  # ---------------- Claude ----------------
  - id: cl-pj-01
    platform: claude
    feature: Projects with project instructions and project knowledge (uploaded files)
    plans: All plans, Free included. Free has a maximum of 5 projects
    limits: No file size or count limit on the page. On paid plans, RAG mode turns on when knowledge nears the context window limit. Chats in a project do not share context, except through project knowledge
    use_in_core_lab: "yes"
    url: https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects
    source_date: approx 2026-11-05 (page says "updated over 2 weeks ago")
    checked_on: 2026-11-20
    status: "verified"
    verifier_note: "Opened 2026-11-20 (curl). All users; Free max 5 projects; RAG on paid plans. Relative date only"
  - id: cl-pj-02
    platform: claude
    feature: Share a project (Can view, Can edit)
    plans: Team and Enterprise. An admin can turn sharing off
    limits: Can view members can chat but not edit. Can edit members change instructions and knowledge. No copy or duplicate feature on the page
    use_in_core_lab: "no"
    url: https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects
    source_date: approx 2026-11-05 (page says "updated over 2 weeks ago")
    checked_on: 2026-11-20
    status: not verified
    note: Catch-up template. Not usable on Free, Pro, Max or Ultra. A shared Can edit project lets one learner change the template for all, so do not use it for catch-up. Use a catch-up kit (text brief + files) instead
  - id: cl-cl-03
    platform: claude
    feature: Custom skills (SKILL.md folder, uploaded as a zip, then turned on in Customize > Skills)
    plans: Free, Pro, Max, Ultra, Team, Enterprise
    limits: Code execution must be on. Name 64 characters, description 200 characters. Folder name must match the skill name and sit at the zip root. No file size limit on the page
    use_in_core_lab: "yes"
    url: https://support.claude.com/en/articles/12512198-how-to-create-custom-skills
    source_date: approx 2026-10-28 (page says "updated over 3 weeks ago")
    checked_on: 2026-11-20
    status: "verified"
    verifier_note: "Opened 2026-11-20. Plans, code execution, 64/200 character limits, zip structure confirmed. Relative date only"
    note: Recheck of E7. Still true. The plan list now also names Ultra. The page changed date since 2026-11-19 ("over 2 weeks" then, "over 3 weeks" now, so no new edit). A catch-up skill can be a zip that the learner uploads, on all plans
  - id: cl-cl-04
    platform: claude
    feature: Record a skill (screen recording, Claude proposes a skill)
    plans: Pro, Max, Ultra, Team. Cowork in Claude for Mac only
    limits: Recording of about 10 minutes
    use_in_core_lab: "no"
    url: https://support.claude.com/en/articles/12512198-how-to-create-custom-skills
    source_date: approx 2026-10-28 (page says "updated over 3 weeks ago")
    checked_on: 2026-11-20
    status: not verified
    note: Mac only, so not a core path. Possible demo
  - id: cl-cl-05
    platform: claude
    feature: Share a skill with people, or publish it to the organization
    plans: Team and Enterprise. Group targeting and skill scanning are Enterprise only
    limits: Skill sharing toggle is on by default for Team. Recipients can use a shared skill but cannot edit it. Owner can revoke. Share with groups is off by default. Publish to org can need owner review
    use_in_core_lab: "no"
    url: https://support.claude.com/en/articles/13119606-provision-and-manage-skills-for-your-organization
    source_date: approx 2026-11-12 (page says "updated over a week ago")
    checked_on: 2026-11-20
    status: not verified
    note: Good for a company-run class (instructor shares a read-only catch-up skill). Recipients cannot edit, so the learner must download or rebuild to extend it. No copy feature documented
  - id: cl-fo-06
    platform: claude
    feature: Create and edit files (.xlsx, .pptx, .docx, .pdf, .csv, .md, .html, PNG charts)
    plans: Free, Pro, Max, Ultra, Team, Enterprise. Web, desktop and mobile
    limits: 30 MB per file for upload and download. Code execution and file creation must be on (user setting, or org owner on Team and Enterprise)
    use_in_core_lab: "yes"
    url: https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude
    source_date: approx 2026-11-05 (page says "updated over 2 weeks ago")
    checked_on: 2026-11-20
    status: "verified"
    verifier_note: "Opened 2026-11-20. All plans, 30 MB per file, formats confirmed; owners can disable on Team and Enterprise. Relative date only"
    note: Files in a project are available to the code environment. An org owner can turn code execution off. Check this with company learners before class
  - id: cl-sc-07
    platform: claude
    feature: Scheduled tasks in Cowork (hourly, daily, weekly, weekdays, manual)
    plans: Pro, Max, Ultra, Team, Enterprise (all paid plans). Not Free
    limits: Runs remotely in the cloud. If the learner picks a local folder, "Require this computer" turns on and the computer must be awake with Claude Desktop open. Tasks can use skills, plugins and connectors. A connector set to "Always ask" can stop the task
    use_in_core_lab: "no"
    url: https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork
    source_date: approx 2026-11-19 (page says "updated yesterday")
    checked_on: 2026-11-20
    status: not verified
    note: Stretch path. The input (new interviews) must reach the task without a connector, for example files saved to the Claude account. Not tested

  # ---------------- ChatGPT ----------------
  - id: cg-01
    platform: chatgpt
    feature: Projects with project instructions and project files
    plans: Signed-in users, subject to plan and workspace settings
    limits: Files per project are 5 (Free), 25 (Go, Plus), 40 (Edu, Pro, Business, Enterprise). Up to 10 files per upload. Project instructions override global custom instructions in that project
    use_in_core_lab: "yes"
    url: https://help-lb.openai.com/en/articles/10169521-projects-in-chatgpt
    source_date: approx 2026-11-17 (page says "updated 3 days ago")
    checked_on: 2026-11-20
    status: "verified"
    verifier_note: "Opened on help-lb.openai.com 2026-11-20. Files 5 / 25 / 40 and 10 per upload confirmed. help-lb is an openai.com subdomain, so OpenAI controls it. Cite help.openai.com in learner materials"
    note: Recheck of E9. The main URL (help.openai.com/en/...) failed again on 2026-11-20, and the sr-rs language URL failed too. The help-lb.openai.com host loaded the same article. The Verifier must confirm that help-lb is an official OpenAI host. Conflict with cg-03, which says Plus has 20 files per project. Use the lower number (20 on Plus) in step cards until resolved
  - id: cg-02
    platform: chatgpt
    feature: Share a project with collaborators
    plans: Free, Go, Plus, Pro, Business, Enterprise, Edu. Web and mobile
    limits: Collaborators 5 (Free), 10 (Go, Plus), 100 (Pro, Business, Enterprise, Edu). Owner and edit members can invite. A member who leaves can copy their chats into a new project named "Copy ..."
    use_in_core_lab: "no"
    url: https://help-lb.openai.com/en/articles/10169521-projects-in-chatgpt
    source_date: approx 2026-11-17 (page says "updated 3 days ago")
    checked_on: 2026-11-20
    status: not verified
    note: Catch-up template. No documented way to copy the project instructions and files into the learner's own project. "Copy" on leave copies chats only, as the page describes it. Use a catch-up kit (text brief + files) instead
  - id: cg-03
    platform: chatgpt
    feature: File upload limits
    plans: All plans
    limits: 512 MB per file. 2M tokens per text or document file. About 50 MB per spreadsheet or CSV. 20 MB per image. 25 GB per user, 100 GB per organization. 80 files every 3 hours. Projects 20 files (Plus) or 40 (Pro, Team, Education, Business)
    use_in_core_lab: "yes"
    url: https://help-lb.openai.com/en/articles/8555545-file-uploads-faq
    source_date: approx 2026-11-15 (page says "updated 5 days ago")
    checked_on: 2026-11-20
    status: "verified"
    verifier_note: "Opened on help-lb.openai.com 2026-11-20. Limits confirmed. Conflict with cg-01 is real (Plus 20 here, 25 there). Also: Free users get 3 uploads per day. No file-output content"
    note: Project file counts conflict with cg-01 (Plus 20 here, 25 there; Go and Free not listed here)
  - id: cg-04
    platform: chatgpt
    feature: Skills (create with chat, create in editor, or upload; use with @-mention or automatic)
    plans: Business, Enterprise, Healthcare and Edu only, subject to workspace settings. Off by default in the beta until a workspace owner turns it on
    limits: Admins set which roles can create, upload, share or install. Uploads are scanned and can be marked "Needs Review" or "Blocked". One default skill (skill-creator). No usage limits listed
    use_in_core_lab: "no"
    url: https://help-lb.openai.com/en/articles/20001066-skills-in-chatgpt
    source_date: approx 2026-11-07 (page says "updated 13 days ago")
    checked_on: 2026-11-20
    status: not verified
    note: Not on Free, Go, Plus or Pro, so a Project is the core ChatGPT build. A skill is an option for learners on Business or Enterprise with skills on. Second source, OpenAI Academy "Skills" (published 2026-02-25, updated 2026-09-17, https://academy.openai.com/public/resources/skills), confirms skills are off by default and controlled by the workspace owner
  - id: cg-05
    platform: chatgpt
    feature: Share a skill (people, groups or link) and export it in Agent Skills format
    plans: Same as cg-04. Workspace sharing and publishing need admin permission
    limits: Owner sets access to only me or to named people. Export and import to other tools that read Agent Skills (for example Codex)
    use_in_core_lab: "no"
    url: https://help-lb.openai.com/en/articles/20001066-skills-in-chatgpt
    source_date: approx 2026-11-07 (page says "updated 13 days ago")
    checked_on: 2026-11-20
    status: not verified
    note: Export uses the same Agent Skills format (SKILL.md) as Claude and Gemini. One catch-up skill folder could serve three platforms. Not tested
  - id: cg-06
    platform: chatgpt
    feature: Scheduled tasks (one-time or recurring)
    plans: Free, Go, Plus, Pro, Business, Enterprise, Edu, eligible Healthcare workspaces
    limits: Active tasks 3 (Free, Go), 5 (Plus), 10 (Business, Edu), 15 (Pro, Enterprise). Free runs at most once a day in a time window. Paid plans can run hourly and at exact times. A task created in a project cannot read the files uploaded to that project
    use_in_core_lab: "no"
    url: https://help-lb.openai.com/en/articles/10291617-scheduled-tasks-in-chatgpt
    source_date: approx 2026-11-02 (page says "updated 18 days ago")
    checked_on: 2026-11-20
