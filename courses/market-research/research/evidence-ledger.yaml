  - id: E12
    claim: >-
      In a 2026 peer-reviewed comparison, GPT-5 and Gemini 2.5 Pro over-coded qualitative text (181 and 183 code
      applications vs 138 by the human) and agreed with the human coder far less than two humans did
      (Krippendorff alpha 0.487 and 0.507 vs 0.703). The chat-based workflow saved no time
    type: study
    source: van den Berkmortel et al., J Med Internet Res 2026;28:e98374 (Maastricht University)
    source_id: S6
    vendor: false
    url: https://www.jmir.org/2026/1/e98374
    source_date: 2026-08-13
    checked_on: 2026-11-20
    age_flag: false
    status: "verified"
    verifier_note: "Opened 2026-11-20. 181/183 vs 138, alpha 0.487/0.507 vs 0.703, no time saved, 317 articles 2020 to 2023, published 2026-08-13 confirmed"
    note: >-
      Health care context. Corpus is 317 newspaper articles on nurses (2020 to 2023), not interviews. Phase 2
      sample is 31 articles. Part of the gap comes from how quotes were cut, not only from disagreement.
      Strong non-vendor counterweight to vendor speed claims: speed depends on the workflow, not only the model.
      Also supports E5 (one reworded quote in the pilot)

