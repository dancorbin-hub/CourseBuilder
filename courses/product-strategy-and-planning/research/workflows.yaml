- id: sp-wf-09
  workflow: Assemble the quarterly portfolio review and planning input pack
  topic_area: Strategy, roadmaps, planning
  capability_skill: '2.1 Strategy Alignment (skill objective: use strategy alignment to shape portfolio direction and resource allocation)'
  trigger_and_cadence: Each quarterly portfolio review and the annual planning cycle
  input: Team plan submissions, program status from source systems, capacity by team, the strategy choices, and last quarter's pack
  output: 'One pack: each program''s status, outcomes, strategic fit and capacity ask; conflicts and shared dependencies; a capacity total by team; and a flag report'
  pm_decision_informed: Which programs to fund, pause or stop, and where capacity goes next quarter
  bottleneck:
    description: Portfolio reviews run on decks that are stale before the meeting. One person stitches updates from many teams by hand, and meetings become data reconciliation instead of decisions. Large firms report weeks of preparation per quarterly review
    pdlc_stage: Focus
    focus_area: Product Portfolio
    sources:
    - W1
    - W22
    sources_check: pass. W1 and W22 are independent and from 2026. W1's Expedia item is an anecdote; its 72% figure is partly verified via W2
  scores:
    judgment: medium. Assembling is rule-based; funding calls are not
    repetition: high. Each quarter, every team
    ai_candidate: 'yes'
  split:
    agent_does:
    - Collect each team's submission and check it against the template
    - Pull status from the source system, not from the submission
    - Total capacity asks by team and by shared resource
    - List conflicts and shared dependencies
    - Send flags to the PM
    pm_manages:
      brief: Job, the submission template, source systems, the strategy choices, capacity rules, output format
      quality_checks:
      - Each program has a submission dated this quarter
      - Each status matches the source system
      - Capacity per program is inside the team's total
      handoff_rules:
      - A shared team or resource asked for more than its capacity across programs
      - A status that differs between the submission and the source system
      - A program with no strategy choice
      audit: Sum the capacity asks by team by hand for 2 shared teams
    pm_decides:
    - Fund, pause or stop
    - Capacity trade-offs
    - What goes to leadership
    ai_error_to_catch: Capacity counted twice. A shared firmware team is planned at 100% in two programs. Each program's ask is inside the team's total, so the per-program check passes. The audit sums by team and finds 200%
  contexts:
    hardware: Partial. W22 (vendor) describes hardware portfolio reviews with stage gates of months next to software sprints. W19 names shared components, test facilities and suppliers as cross-program dependencies
    internal_pm: 'Partial. W1: Expedia''s quarterly priority reviews took weeks and outreach to 50 or more PMs. Enterprise internal planning, anecdote only'
    industry_notes: []
  proposed_lab:
    goal: Extend the course agent to assemble the quarterly pack and flag capacity conflicts
    core_message: The meeting is for decisions, not reconciliation. The agent reconciles; the PM decides
    build_type: agent (extend the course agent built in module 1)
    core_path_no_connectors: yes. The learner uploads team submissions from the fallback case
    data_safety: 'Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)'
    platforms:
      claude: Skill or Project with the brief, the templates and the rules
      chatgpt: Project with the brief and templates (Market Research ledger E9, not verified)
      copilot: Agent in Copilot agent builder with the brief and templates as embedded files (Market Research ledger E6)
      gemini: Gemini skill with the brief and templates (Market Research ledger E8)
    stretch: Pull status from a connected work tracker, where the platform allows (not verified)
    planted_error: One shared team counted at 100% in two programs
    success_check: The pack shows capacity by team and the flag report names the over-allocated team
    registry_check: 'Focus 28.01 does not cover portfolio review packs. Build 28.01 teaches estimates from past performance and release planning; not retaught. Overlap with sp-wf-01 (same data, different job: 01 measures drift, 09 prepares decisions). Dan may merge them. Workshops Strategic Transformation and Implementation and Action Planning Workshop map to capability 2; Dan to check overlap'
    pragmatic_fit: Good fit. Workbook 2.1 objectives include shaping portfolio direction and resource allocation
  evidence:
  - id: W1
    claim: 80% of 308 senior leaders say their strategic priorities are clear, but only 11% can show that at least three quarters of portfolio work is explicitly linked to them. 83% rely on manual status updates and personal judgment. 72% say competing priorities chronically overstretch key teams. Expedia quarterly priority reviews took weeks of preparation and outreach to 50 or more PMs
    type: statistic
    source: 'Shift happens: Finding and fixing the gap between strategic intent and actual work, Sapphire Reels, Atlassian blog'
