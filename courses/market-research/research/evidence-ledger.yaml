  # ---------- New, track 4 ----------

  - id: E10
    claim: >-
      Of 332 research practitioners, 71% say AI lets them analyze data significantly faster, and 71% say
      validating AI output still takes significant time. 65% disagree that they can trust output with minimal
      review. 12% have no validation process
    type: statistic
    source: The State of AI in User Research Analysis, Condens (Halberstadt, Anusic)
    source_id: S4
    vendor: true
    url: https://condens.io/blog/ai-in-user-research-analysis-report
    source_date: 2026-05-22
    checked_on: 2026-11-20
    age_flag: false
    status: "verified, vendor"
    verifier_note: "Opened 2026-11-20. 71%, 71%, 65% disagree, 12% confirmed; 332 responses. 21% and 5% are two different questions (21% agree with the trust statement; 5% name 'trust with minimal review' as their practice), not a conflict. Survey period not stated"
    note: >-
      Sample 332: researchers 63%, designers 15%, PMs 9%, ReOps 9%. Survey period not stated. Condens sells a
      research repository with AI. The page gives 21% and 5% for "trust with minimal review"; the two figures
      conflict and are not explained. Use 71% / 71% only. Supports the bottleneck shift in mr-wf-01

