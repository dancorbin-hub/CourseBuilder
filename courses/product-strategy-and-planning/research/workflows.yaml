# Workflow inventory: Advanced AI for Product Strategy and Planning (Stage 1, track 1, run 1)
# Written 2026-11-22 by the workflow researcher. Schema: shared/templates/workflow-row.yaml.
# Model row for depth: courses/market-research/research/worked-example-row.yaml (not copied).
# Added fields: origin (carried-over rows), capability_skill (workbook skill id and name),
# bottleneck.sources_check (pass or fail for the 2-source rule), proposed_lab.planted_error, success_check, pragmatic_fit.
# Evidence ids W1 to W24 are unique in this file. A row repeats the full entry when it reuses an id.
# Competency names 2.1B and 2.4D are split across cells in the workbook extract; read as 'Explicit vs. Implicit Strategy Analysis' and 'Alignment to Market Problems and Strategy'.
# Platform notes cite the Market Research ledger (E6 to E9); not re-verified in this run.
# Fetch budget: 25 of 25 used. Unopened sources are listed in research/gaps.md under Track 1.
# Dropped: Atlassian State of Product 2026 (published 2025-09-03, a 2025 study, research rule 4);
#   airfocus stakeholder survey (2025, sponsored); Mind the Product 2025 survey (cited in W5).
- id: sp-wf-01
  workflow: Check where work and money actually go against the stated strategy, each quarter
  topic_area: Strategy, roadmaps, planning
  capability_skill: 2.1 Strategy Alignment (competency 2.1B Explicit vs. Implicit Strategy Analysis)
  trigger_and_cadence: Each quarter before planning, and when leadership changes a priority. Assumption, 4 times a year plus ad hoc
  input: The stated strategy (Strategy Matrix or strategy memo), the roadmap, a work export (epics or projects with team and effort), and headcount or budget by team
  output: 'A drift report: share of effort and spend per strategic choice, work that maps to no choice, choices with no work, the trend over quarters, and a flag report for the PM'
  pm_decision_informed: Where the implicit strategy differs from the explicit one, and whether to change the work or change the stated strategy
  bottleneck:
    description: Leaders believe the strategy is clear, but few can show that the work is linked to it. Showing the link means pulling data from many tools and status updates by hand, so drift is found late or not at all. Strategy work also gets little of the PM's time
    pdlc_stage: Market
    focus_area: Product Strategy
    sources:
    - W1
    - W3
    sources_check: 'pass. W1 (with its primary W2, one source) and W3 are independent and from 2026. Both statistics are partly verified: primary reports not opened'
  scores:
    judgment: medium. Mapping work to strategy choices is rule-based; deciding what the drift means needs the PM and leaders
    repetition: medium to high. Every quarter, across every team and epic
    ai_candidate: yes. The agent gathers, maps and totals; the PM interprets
  split:
    agent_does:
    - Map each epic or project to one strategic choice, with the reason
    - Total effort and spend per choice
    - List work that maps to no choice and choices with no work
    - Compare with last quarter and mark what grew or shrank
    - Send flags to the PM
    pm_manages:
      brief: Job, the strategy choices with a plain definition of each, the data sources, the mapping rules, output format
      quality_checks:
      - Each work item has one mapping and a written reason
      - Totals per choice add up to the total effort in the export
      - Each number shows its source file and date
      handoff_rules:
      - Work that maps to no choice and is larger than the set size
      - A choice that gets less than the share the PM set in the brief
      - A mapping that rests only on a label or tag, with no description to support it
      audit: 5 random work items per quarter, read in full and mapped by hand. Compare with the agent's mapping
    pm_decides:
    - The strategy choices and their definitions
    - Whether drift is a problem or a new implicit strategy to make explicit
    - What to raise with leaders
    ai_error_to_catch: 'Label laundering. Teams tag maintenance or pet projects with the name of a strategic theme, so the agent maps them as aligned. Each item has a mapping and a reason (the reason repeats the tag), so the checks pass. The audit reads what the work does and finds the gap. Fix: the brief tells the agent to map from the work description, not the tag'
  contexts:
    hardware: Partial. W22 says hardware programs run on stage gates of months while software ships in weeks, so a quarterly view hides drift. Drift in hardware shows in engineering hours, tooling and test spend. No source for a drift check itself
    internal_pm: gap. Internal platform teams fit well (stated platform strategy vs ticket mix), but no source found
    industry_notes:
    - 'health care and FinTech: compliance work is often large and maps to no choice. The brief needs a ''must do'' category. Not yet researched'
  proposed_lab:
    goal: Delegate the quarterly strategy drift check to the agent, and manage it by its checks, flags and an audit
    core_message: The stated strategy is what leaders say. The implicit strategy is where the work goes. The agent counts; the PM decides what the gap means
    build_type: agent (extend the course agent built in module 1)
    core_path_no_connectors: yes. The learner uploads a strategy page and a work export from their own work or the fallback case
    data_safety: 'Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)'
    platforms:
      claude: Skill or Project with the brief, the templates and the rules
      chatgpt: Project with the brief and templates (Market Research ledger E9, not verified)
      copilot: Agent in Copilot agent builder with the brief and templates as embedded files (Market Research ledger E6)
      gemini: Gemini skill with the brief and templates (Market Research ledger E8)
    stretch: Read the work export from a connected work tracker on a schedule, where the platform allows (not verified)
    planted_error: 'Label laundering: 3 epics tagged with a strategic theme that are maintenance work'
    success_check: The drift report lists work with no strategy choice, flags tag-only mappings, and the audit finds the planted epics
    registry_check: 'Focus 28.01 teaches explicit vs implicit strategy, strategic drift and the Strategy Matrix, and has a one-pass activity where AI drafts the Alignment to Strategy box. It also has a tip to use AI to check roadmap updates against the Strategy Matrix and OKRs. This row starts where Focus stops: no slides that reteach the concepts; the agent measures drift from real work data each quarter, with checks, flags, trend and audit. Risk: the Focus tip is close; Dan to confirm. No workshop overlap (CAW-AI and AI-AGENTS are about competitors)'
    pragmatic_fit: Good fit. Workbook 2.1B is exactly this comparison, and the 2.1 AI text says 'expose implicit strategy'
  evidence:
  - id: W1
    claim: 80% of 308 senior leaders say their strategic priorities are clear, but only 11% can show that at least three quarters of portfolio work is explicitly linked to them. 83% rely on manual status updates and personal judgment. 72% say competing priorities chronically overstretch key teams. Expedia quarterly priority reviews took weeks of preparation and outreach to 50 or more PMs
    type: statistic
    source: 'Shift happens: Finding and fixing the gap between strategic intent and actual work, Sapphire Reels, Atlassian blog'
    url: https://www.atlassian.com/blog/leadership/gap-between-intent-and-work
    source_date: '2026-09-28'
    checked_on: '2026-11-22'
    age_flag: false
    status: verified (secondary report of W2)
    note: Vendor of portfolio software reports its own study. Primary study is W2; W1 and W2 count as one source. Expedia item is a conference anecdote (Team 26, 2026-05-06), not study data
  - id: W2
    claim: Only 11% have execution work connected to strategy in a system; 80% say their strategy is clear; only 8% use dynamic, outcome-based funding; nearly two thirds take a month or more to decide after a performance signal
    type: statistic
    source: 'Leading the Human + AI Enterprise: A New Playbook for Strategic Portfolio Management, Atlassian (report landing page)'
    url: https://www.atlassian.com/collections/strategy/strategic-portfolio-management-evolution
    source_date: unknown (reported 2026-09-28 in W1)
    checked_on: '2026-11-22'
    age_flag: false
    status: partly verified
    note: 308 senior enterprise leaders. Publish date, method and field dates not stated on the page; whitepaper not opened. The 11% wording differs from W1. Vendor study. Confirm it is a 2026 study before any slide use
  - id: W3
    claim: 'Roadmap to strategy alignment averages 3.6 of 5 and outcome to company goal connection 3.5 of 5. Top causes of misalignment: resource and capacity limits (49.2%), short-term priority shifts (47.5%), leadership direction changes (43.9%). 72.2% spend 25% or less of their time on product strategy'
    type: statistic
    source: The strategy-execution gap in product teams, Rebecca Stewart, Product-Led Alliance
    url: https://www.productledalliance.com/the-strategy-execution-gap-in-product-teams/
    source_date: '2026-03-11'
    checked_on: '2026-11-22'
    age_flag: false
    status: partly verified
    note: Cites the 2026 State of Product Management report, about 250 product leaders, method not given. Primary report not opened. Practitioner community that sells reports. Independent of W1 and W2
  - id: W22
    claim: Portfolio and roadmap reviews run on decks and spreadsheets that are already stale; meetings become data reconciliation, not decisions; one person becomes the 'human integration layer' who stitches engineering and procurement updates; hardware runs on stage gates of months while software ships in weeks, so dependencies stay hidden
    type: claim
    source: Why product portfolio reviews keep tracking sideways, Maziar Adl, Gocious
    url: https://gocious.com/blog/why-product-portfolio-reviews-keep-tracking-sideways
    source_date: '2026-05-05'
    checked_on: '2026-11-22'
    age_flag: false
    status: verified
    note: Hardware product management software vendor. No data
  open_gaps:
  - Primary reports for W2 (date, method) and W3
  - Internal PM source
  - Hardware source for drift checks
  gate_1_decision: ''
- id: sp-wf-02
  workflow: Re-score the opportunity backlog each intake cycle, with sensitivity and consistency checks
  topic_area: Strategy, roadmaps, planning
  capability_skill: 2.2 Opportunity Prioritization (competencies 2.2C Weighting and Priority Logic, 2.2D Calibration and Consistency)
  trigger_and_cadence: Each intake or planning cycle, and when new evidence arrives for a scored item. Assumption, monthly or quarterly
  input: The scoring model (attributes, scales, weights), the opportunity list, new evidence per opportunity, and scores from each scorer
  output: An updated scored list with the evidence for each score, a sensitivity table (which weight changes flip the top items), a consistency table (where scorers disagree), an override log, and a flag report
  pm_decision_informed: Which opportunities advance, pause or stop this cycle
  bottleneck:
    description: 'Scores look objective but behave like opinions: scorers read the same criteria differently, weights change each cycle, and the loudest stakeholder wins. Teams re-litigate priorities every cycle instead of rescoring with evidence'
    pdlc_stage: Focus
    focus_area: Product Portfolio
    sources:
    - W4
    - W5
    sources_check: pass, weak. W4 and W5 are independent and from 2026, but both are unsigned content from vendor sites with no data
  scores:
    judgment: medium. Applying the scales is rule-based; weights and the final call are the PM's
    repetition: high. Every item, every cycle
    ai_candidate: 'yes'
  split:
    agent_does:
    - Score new items and rescore items with new evidence
    - Link each score to its evidence
    - Run the sensitivity test the brief sets
    - Compare scores between scorers and list gaps larger than the set range
    - Log every manual override with who and why
    - Send flags to the PM
    pm_manages:
      brief: Job, the scoring model, the evidence rules per attribute, the sensitivity range, the consistency range, output format
      quality_checks:
      - Each score has evidence and a date
      - Each score is inside the scale
      - The sensitivity test is run for each weight
      - Each override has a name and a reason
      handoff_rules:
      - Top items that change when one weight moves inside the set range
      - Scorers more than the set range apart on one attribute
      - An item that moved more than 2 places since last cycle
      - Any override of the model's ranking
      audit: '3 items per cycle: trace each attribute score to its evidence by hand'
    pm_decides:
    - The attributes, scales and weights
    - How to resolve scorer disagreement (calibration)
    - What advances, pauses or stops
    ai_error_to_catch: One piece of evidence counted twice. A single large customer request is cited as evidence for both 'Impact to buyers' and 'Competitive landscape', so one sales push lifts the score twice. Each score has evidence, and the ranking is stable in the sensitivity test, so the checks pass. The audit traces evidence per attribute and finds the reuse
  contexts:
    hardware: Partial. W6 (vendor, figures not usable) says hardware screening criteria should be calibrated against past ideas and kill triggers set before a gate, because each later stage costs about 10 times more. No independent source
    internal_pm: 'gap. Leads not opened: Pragmatic Institute ''Managing Internal Feature Requests'' and an ideaplan guide on internal tool requests'
    industry_notes:
    - 'regulated industries: some items are mandatory and must sit outside the scored list. Not yet researched'
  proposed_lab:
    goal: Delegate the scoring cycle to the agent, and manage it by sensitivity and consistency flags
    core_message: The model does not decide. It shows where the decision is fragile and where people disagree
    build_type: agent (extend the course agent built in module 1)
    core_path_no_connectors: yes. The learner uploads their scoring model and backlog, or the fallback case set
    data_safety: 'Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)'
    platforms:
      claude: Skill or Project with the brief, the templates and the rules
      chatgpt: Project with the brief and templates (Market Research ledger E9, not verified)
      copilot: Agent in Copilot agent builder with the brief and templates as embedded files (Market Research ledger E6)
      gemini: Gemini skill with the brief and templates (Market Research ledger E8)
    stretch: Rescore when new evidence lands in a shared folder, where the platform allows (not verified)
    planted_error: One customer request cited under two attributes
    success_check: The sensitivity table names the fragile items, the consistency flag lists the scorer gap, and the audit finds the double-counted evidence
    registry_check: 'Focus 28.01 teaches the 4 attributes, 1 to 5 scoring, weights and the scoring table, and a one-pass AI competitive landscape. This row does not reteach the model: it starts with a model and runs it each cycle with sensitivity, consistency and an override log. AI-AGENTS (Dan''s course) maps to 2.2; check its labs do not score opportunities. Must not use a competitive watch agent (CAW-AI, Competitive Intel Watchdog)'
    pragmatic_fit: 'Good fit. The 2.2 AI text says ''run sensitivity tests, surface scoring inconsistencies''. Tag note: the workbook primary box for 2.2 is Market / Competitive Landscape; this workflow fits the secondary box Focus / Product Portfolio better. Dan decides'
  evidence:
  - id: W4
    claim: Two groups read the same criteria (impact, effort) differently, so scores look objective but behave like opinions. Changing weights each cycle makes the rubric negotiable and teams re-litigate decisions each planning cycle. If small weight changes flip the top 10, the rubric is fragile
    type: claim
    source: Building a repeatable prioritization rubric that survives leadership changes, fitgap
    url: https://us.fitgap.com/stack-guides/building-a-repeatable-prioritization-rubric-that-survives-leadership-changes
    source_date: '2026-01-19'
    checked_on: '2026-11-22'
    age_flag: false
    status: verified
    note: No author named. Software comparison site. Weak source; no data
  - id: W5
    claim: Without systematic analysis the loudest stakeholder wins; features get built because a sales rep pushed a deal or an executive had a bad customer call; reasoning behind priorities is often undocumented
    type: claim
    source: How AI Product Management Ends the Loudest-Voice-Wins Problem, staff writer, Virtasant Enterprise AI Today
    url: https://virtasant.com/ai-today/how-ai-product-management-ends-the-loudest-voice-wins-problem
    source_date: '2026-02-24'
    checked_on: '2026-11-22'
    age_flag: false
    status: verified
    note: 'No author named. Cloud consultancy blog. Its survey figures come from Mind the Product 2025 and an unsourced 61% figure: do not use them. Independent of W4'
  - id: W6
    claim: 'Hardware stage gates: each stage raises the cost of being wrong about 10 times; most kills happen late, after 1M USD or more per program; kill triggers should come from each program''s original business case assumptions; screening criteria calibrated against 20 past ideas'
    type: claim
    source: Building Kill Discipline Into Hardware Product Portfolios, Christina Woelfel, ITONICS
    url: https://www.itonics-innovation.com/blog/hardware-product-portfolios
    source_date: '2026-06-01'
    checked_on: '2026-11-22'
    age_flag: false
    status: verified
    note: 'Innovation software vendor. Case figures are anonymized ''observed practice'' with no named source: do not use the numbers. Useful as a hardware context lead only'
  open_gaps:
  - A dated, signed source with data on scoring inconsistency
  - Hardware and internal PM sources
  gate_1_decision: ''
- id: sp-wf-03
  origin: mr-wf-06
  workflow: Build and refresh a sourced market size and segment evidence model
  topic_area: Strategy, roadmaps, planning
  capability_skill: 2.3 Business Case Development (competency 2.3B Market Value and Sizing)
  trigger_and_cadence: A new opportunity or segment question, then a refresh each quarter or when a new source appears
  input: The market question, segment definitions, analyst and public sources, and the PM's own customer data
  output: A top-down and bottom-up size model, each number linked to source, date, unit, scope and base year; an assumptions list with risk ratings; a 'what changed' note on refresh; and a flag report
  pm_decision_informed: Which segment is large and reachable enough to put into the business case
  bottleneck:
    description: Published estimates for one market can differ by 5 times or more because they measure different layers, scopes, units and base years. The PM must align each source before any comparison, and data goes stale, so the work repeats
    pdlc_stage: Focus
    focus_area: Market Definition
    sources:
    - W7
    - W8
    sources_check: pass. W7 and W8 are independent and from 2026 (both are data vendors). Old W9 and W10 kept with age flags; Dan decides
  scores:
    judgment: medium to high. Which assumptions to accept is a judgment
    repetition: medium. Each new question and each refresh
    ai_candidate: partly. The agent finds, normalizes and computes; the PM owns the assumptions
  split:
    agent_does:
    - Find data points for each model input
    - Record source, date, unit, scope, region and base year for each
    - Convert numbers to one basis before any comparison
    - Build top-down and bottom-up estimates
    - On refresh, find new data and report what changed
    - Send flags to the PM
    pm_manages:
      brief: Job, market question, segment definitions, approved source types, maximum source age, the common basis (unit, scope, region, year), output format
      quality_checks:
      - Each number has a source, date and link
      - Each number shows its unit, scope and base year
      - Each source is checked for the study it repeats
      - Each assumption has a risk rating
      handoff_rules:
      - Top-down and bottom-up differ by more than the set range
      - A number that rests on one source only
      - A source older than the maximum age
      - A number that could not be converted to the common basis
      audit: 3 numbers per model, traced to the original source by hand, with the scope read in the source
    pm_decides:
    - Segment definitions
    - Which assumptions to accept
    - Which segment goes into the business case
    ai_error_to_catch: Layer mixing. The agent 'confirms' a top-down figure with a second estimate that measures a different layer (end-use value, not vendor revenue) or a wider scope, and reports the two as agreeing. Each number has a source, unit and date filled in, so the checks pass. The audit reads the scope in the source and finds the mismatch. Market Research used 'fake triangulation' for this row; it can stay as a second error if Dan prefers
  contexts:
    hardware: Sizing by installed base, units and replacement cycles instead of seats. gap, no source found
    internal_pm: Sizing the internal market (teams, users, workflows) for an internal platform. gap, no source found
    industry_notes:
    - 'health care and FinTech: regulatory and licensing data shape the reachable market. Not yet researched'
  proposed_lab:
    goal: Extend the course agent to build a sourced size model and flag weak, stale and mismatched numbers
    core_message: The agent finds numbers fast. The PM decides which numbers to trust
    build_type: agent (extend the course agent built in module 1)
    core_path_no_connectors: partly. Core path uses a source pack from the fallback case; live web search is the stretch
    data_safety: 'Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)'
    platforms:
      claude: Skill with the model template and source rules
      chatgpt: Project with the model template (Market Research ledger E9, not verified)
      copilot: Agent with the model template as an embedded file (Market Research ledger E6); web grounding not verified
      gemini: Gemini skill with the template (Market Research ledger E8). Deep research does not work in skills
    stretch: Let the agent search for new data each quarter
    planted_error: Two estimates from different layers reported as agreeing
    success_check: The model shows one basis for every number and the flag report names the planted mismatch
    registry_check: 'Carried over from Market Research (Dan, Gate 1, 2026-11-22). Focus 28.01 teaches TAM, segment and projected share as a one-pass exercise. This row starts there: a living model with source and basis checks, refreshes and an audit. MKT-2026 teaches segmentation; not retaught. Check the Market Research course no longer includes this row'
    pragmatic_fit: Good fit. The 2.3 AI text says 'model market size' and 'source data and calculations remain auditable'
  evidence:
  - id: W7
    claim: Published 2030 estimates for one market range from about 4B to more than 20B USD because they measure different layers (vendor revenue, economic impact, end-use value), base years and scopes. Never add the two layers
    type: claim
    source: Why do quantum market size estimates differ so much?, TQI Market Intelligence team, The Quantum Insider
    url: https://thequantuminsider.com/why-do-quantum-market-size-estimates-differ/
    source_date: '2026-09-15'
    checked_on: '2026-11-22'
    age_flag: false
    status: verified
    note: Updated 2026-09-30. Publisher sells the dataset it cites. One market only (quantum), used as a worked example of the reconciliation burden
  - id: W8
    claim: Market size numbers differ between research firms by definition, base year, regional coverage, unit and currency, method, source depth and update timing. The buyer must align definitions, years and coverage before comparing; an estimate is a model, not a measured fact
    type: claim
    source: Why Do Market Size Numbers Differ Between Research Firms? A Buyer's Guide to Reading Forecasts, Likhil Gajbhiye, Polaris Market Research
    url: https://www.polarismarketresearch.com/blog/why-market-size-numbers-differ-between-research-firms
    source_date: 2026-10 (month only)
    checked_on: '2026-11-22'
    age_flag: false
    status: verified
    note: Market research vendor that sells reports. Independent of W7
  - id: W9
    claim: The needed market number rarely exists in reports; sources conflict and often quote one source; secondary research takes a lot of time
    type: claim
    source: Common challenges of TAM research, Joe Radwich, Product Marketing Alliance
    url: https://www.productmarketingalliance.com/common-challenges-of-tam-research/
    source_date: '2025-04-21'
    checked_on: '2026-11-20'
    age_flag: true
    status: verified (2026-11-20, not reopened)
    note: Was W9 in mr-wf-06. Older than 12 months; Dan decides
  - id: W10
    claim: Market sizing is a lot of desk research, rests on written assumptions, needs several iterations, and data goes stale fast
    type: claim
    source: A modern approach to market sizing, Bart Krawczyk, LogRocket
    url: https://blog.logrocket.com/product-management/innovative-approach-to-market-sizing
    source_date: '2023-04-04'
    checked_on: '2026-11-22'
    age_flag: true
    status: verified
    note: Was W19 in mr-wf-06. Last modified 2023-12-20. Older than 12 months; Dan decides. Its own worked example has arithmetic errors (10% of 23 million stated as 230,000), which is a usable teaching example
  open_gaps:
  - Hardware and internal PM sizing sources
  - A non-vendor 2026 source
  gate_1_decision: ''
- id: sp-wf-04
  origin: mr-wf-08
  workflow: Turn each round of concept or prototype tests into a result per hypothesis
  topic_area: Strategy, roadmaps, planning
  capability_skill: 6.4 Ideation, Evaluation, and Prototyping (no Capability 2 skill fits better; results feed 2.3 Business Case Development)
  trigger_and_cadence: Each round of concept tests, unmoderated tests or pilots. Assumption, every 2 to 4 weeks during validation
  input: Session notes or transcripts, task results, and the test plan with hypotheses and pass criteria set before the test
  output: A result per hypothesis (pass, fail, unclear) with evidence, stated preference set apart from observed behavior, the counts used for each result, and a flag report
  pm_decision_informed: Which concept goes forward into the business case, changes or stops
  bottleneck:
    description: Research demand grows faster than research capacity, so analysis is squeezed into tight timelines. Concepts that test well on stated intent often fail after launch, because what people say differs from what they do. The cost shows up only in a slow postmortem
    pdlc_stage: Planning
    focus_area: Ideation
    sources:
    - W11
    - W12
    sources_check: weak pass. W11 and W12 are independent and from 2026, but W12 is about research in general, not concept tests. W13 (old W16) not verified and not counted. Dan decides
  scores:
    judgment: medium to high. Pass criteria are set in advance; mixed results need the PM
    repetition: medium to high. Every session in each round
    ai_candidate: partly
  split:
    agent_does:
    - Code each session against the hypotheses
    - Separate what people said from what they did
    - Count results against the full sample in the test plan
    - Score each hypothesis against its pass criteria
    - Send flags to the PM
    pm_manages:
      brief: Job, hypotheses, pass criteria with the sample size, output format
      quality_checks:
      - Each result cites sessions and quotes
      - Stated and observed evidence are in separate columns
      - Each result shows its numerator and denominator
      handoff_rules:
      - Stated preference and behavior disagree
      - A result that rests on fewer sessions than the brief allows
      - A session that the agent left out of a count, with the reason
      audit: 2 sessions per round read in full, and each result recounted from the test plan
    pm_decides:
    - Hypotheses and pass criteria
    - Go, change or stop for each concept
    ai_error_to_catch: Denominator drift. The agent counts task success only among participants who reached the task (6 of 7) instead of all participants in the plan (6 of 12), so the hypothesis passes. Each result shows a numerator and denominator, so the check passes. The audit recounts against the test plan and finds it
  contexts:
    hardware: Tests with physical prototypes and field pilots. gap, no source found
    internal_pm: Pilots of an internal tool with one team. gap, no source found
    industry_notes:
    - 'health care: tests with clinicians or patients need consent and privacy rules. Not yet researched'
  proposed_lab:
    goal: Extend the course agent to score a round of concept tests against the hypotheses
    core_message: Set the pass criteria and the sample before the agent reads the sessions
    build_type: agent (extend the course agent built in module 1)
    core_path_no_connectors: yes. The learner uploads session notes from the fallback case
    data_safety: 'Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)'
    platforms:
      claude: Skill or Project with the brief, the templates and the rules
      chatgpt: Project with the brief and templates (Market Research ledger E9, not verified)
      copilot: Agent in Copilot agent builder with the brief and templates as embedded files (Market Research ledger E6)
      gemini: Gemini skill with the brief and templates (Market Research ledger E8)
