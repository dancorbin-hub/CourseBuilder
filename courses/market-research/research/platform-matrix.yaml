    source_date: unknown (page shows no date)
    checked_on: 2026-11-20
    status: "partly verified"
    verifier_note: "Opened 2026-11-20. Upload methods, 100 MB, unsupported types, no internet in scripts confirmed. 'Unlimited skills, 100 active' not found. Page undated, so no dated vendor doc for this row"
