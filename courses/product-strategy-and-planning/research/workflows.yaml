- id: sp-wf-07
  workflow: Refresh roadmap themes each quarter and trace every item to a validated problem and strategy
  topic_area: Strategy, roadmaps, planning
  capability_skill: 2.4 Product Vision and Roadmap (competencies 2.4B Roadmap Structuring and Framing and 2.4D Alignment to Market Problems and Strategy)
  trigger_and_cadence: Each quarterly roadmap refresh, and when new validated problems arrive
  input: The current roadmap, the validated problem backlog with evidence, the strategy choices, and the latest scored opportunity list
  output: Updated outcome themes, a trace table (item to theme to validated problem to strategy choice), a list of items with no trace, and a flag report
  pm_decision_informed: Which themes the roadmap shows next quarter, and which items leave the roadmap
  bottleneck:
    description: A roadmap that is not governed quickly becomes a historical record. Roadmap to strategy alignment is only middling, and keeping each item traced to evidence and strategy takes manual work each cycle
    pdlc_stage: Focus
    focus_area: Product Roadmap
    sources:
    - W19
    - W3
    sources_check: pass. W19 and W3 are independent and from 2026. W3 statistics are partly verified
  scores:
    judgment: medium. Clustering is rule-based; naming outcomes and cutting items needs the PM
    repetition: medium to high. Every quarter, every item
    ai_candidate: 'yes'
  split:
    agent_does:
    - Cluster validated problems into candidate outcome themes
    - Trace each roadmap item to a theme, a problem and a strategy choice
    - Check each item's own evidence
    - List items with no trace
    - Send flags to the PM
    pm_manages:
      brief: Job, the rule for 'validated', the strategy choices, the theme format (outcome, not output), output format
      quality_checks:
      - Each item traces to a theme, a problem and a choice
      - Each theme is written as an outcome
      - Each item shows its own evidence and date
      handoff_rules:
      - An item with no trace
      - An item whose evidence is below the 'validated' rule
      - A theme with no item, or an item in two themes
      audit: '5 random roadmap items: read each item''s own evidence, not the theme''s'
    pm_decides:
    - The themes and their wording
    - Which items leave the roadmap
    - What the roadmap shows to each audience
    ai_error_to_catch: Validation by association. An item backed only by one sales request sits in a theme with strong evidence, so the trace table shows it as linked to validated problems. The trace check passes. The audit reads the item's own evidence and finds it is weak
  contexts:
    hardware: Partial. W19 says hardware roadmaps must include manufacturing readiness, design freeze and shared components, so themes carry physical dependencies
    internal_pm: Partial. W24 (Thoughtworks, 2023, aged) says internal platform PMs own the roadmap and measure value by usage. No 2026 source
    industry_notes: []
  proposed_lab:
    goal: Extend the course agent to refresh themes and keep every roadmap item traced to evidence
    core_message: A roadmap item earns its place with its own evidence, not its theme's
    build_type: agent (extend the course agent built in module 1)
    core_path_no_connectors: yes. The learner uploads their roadmap and problem backlog, or the fallback case
    data_safety: 'Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)'
