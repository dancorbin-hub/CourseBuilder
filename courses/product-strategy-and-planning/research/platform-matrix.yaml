summary:
- platform: claude
  core_lab_feasible: 'yes'
  core_build: Project or custom skill (carried)
  new_for_this_course: Code execution and file creation give real formulas and .xlsx output on all plans (cl-fo-06). Web search on all plans (cl-ws-08). Research on paid plans only (cl-rs-09)
  key_limit: 'XLSX upload and file output need code execution on. An org owner can turn it off. Web search on Team and Enterprise needs owner opt-in. Upload size conflict: 30 MB or 500 MB (cl-up-10)'
- platform: chatgpt
  core_lab_feasible: 'yes'
  core_build: Project (carried)
  new_for_this_course: Data analysis runs Python on uploaded CSV and XLSX (cg-11). Web search on all plans (cg-13). Spreadsheet output with formulas through ChatGPT Work (cg-09, cg-10)
  key_limit: ChatGPT Work is not on Free or Go, and not in a project with project-only memory. Skills still only Business, Enterprise, Healthcare, Edu (cg-04 retry)
- platform: copilot
  core_lab_feasible: yes, with a condition
  core_build: Agent in agent builder (carried)
  new_for_this_course: Code interpreter reads CSV and Excel uploaded in chat (mb-13). Web search with 4 URLs or 'Search all websites' (mb-12), all license states
  key_limit: Code interpreter use of knowledge files not documented. Output files last for the session only. CSV not allowed as embedded knowledge (mb-14)
- platform: gemini
  core_lab_feasible: yes, with a condition
  core_build: Gemini skill in the Gemini app (carried)
  new_for_this_course: Skill can be named in a scheduled action (gm-12). Gemini app skills have no admin controls (gm-13)
  key_limit: No doc says a skill runs code for math (gm-11) or can use Google Search. Deep Research does not work in skills (gm-06). File output from a skill unproven (gm-09)
