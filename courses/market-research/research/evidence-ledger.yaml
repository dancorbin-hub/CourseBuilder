    source_id: [S5, S6, S4]
    vendor: mixed. S5 practitioner, S6 peer-reviewed study (not vendor), S4 vendor
    url: https://www.producttalk.org/customer-interview-analysis-ai/
    source_date: 2025-10-08 (Torres, updated 2026-09-27)
    checked_on: 2026-11-20
    age_flag: true
    status: "verified"
    verifier_note: "Opened JMIR and Condens 2026-11-20. JMIR pilot reworded quote confirmed. Condens 'hallucinates quotes' is the authors' summary of respondents, not a respondent quote; 42% context loss confirmed. Torres not reopened"
    note: >-
      Closes the worked-example gap. Torres is older than 12 months (Dan decides), but S6 and S4 are 2026.
      Torres' 30% wrong-quote figure is one project, not a statistic. JMIR reports one reworded quote in a pilot,
