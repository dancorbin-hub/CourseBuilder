# Carried entries come from courses/market-research/research/platform-matrix.yaml (checked 2026-11-20,
# Gate 1 approved 2026-11-22). They keep their id, status and dates and add carried_from: market-research.
# A carried entry that this run rechecked has a recheck_2026_11_22 field. Its status is not changed.
# New entries (checked_on 2026-11-22) are "not verified" until the Verifier checks them.
# Field notes: use_in_core_lab yes = a core lab can use it with no connectors.
# source_date: Help Center pages show only a relative date; we record the date it gives, with "approx".
# Learner build per platform: Claude Project or skill. ChatGPT Project. Copilot agent builder agent. Gemini skill.
# No custom GPTs. No Gems. Web fetch budget used: 15 of 15.

