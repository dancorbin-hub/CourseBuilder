    type: study
    source: Liu et al., How can LLMs Support Policy Researchers? arXiv 2604.04479
    source_id: S12
    vendor: false
    url: https://www.emergentmind.com/papers/2604.04479
    source_date: 2026-04-06
    checked_on: 2026-11-20
    age_flag: false
    status: "wrong"
    verifier_note: "Opened arXiv HTML 2026-11-20. 11 expert policy researchers, 'order of magnitude faster' (figure caption, 10 to 15 minute timed phases, no exact times) and about 2 more themes confirmed. 88.6% is wrong as stated: it is 31 of 35 themes across all sources that appeared in Reddit or interview outputs. Of the 22 report themes, Reddit found 16 and interviews found 16. Preprint, not peer reviewed"
    note: >-
      Preprint, not peer reviewed. Small user study (11). Policy research, not PM, but the workflow is the same
      as interview synthesis. Read through an abstract page (emergentmind), not the arXiv PDF. Authors call
      representativeness and trust open issues. Best non-vendor 2026 source found for the speed side of the bottleneck

