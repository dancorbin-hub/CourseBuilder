    rung: 1
    rung_name: Hand-run batch
    objectives:
      - { id: m1-o1, text: "Build the Strategy Evidence Agent from the template, with the strategy overview, OKRs and KPIs in its brief", practiced_in: "lab step 1 to 2" }
      - { id: m1-o2, text: "Decide each flag report item, including work with no clear link to a stated objective", practiced_in: "lab step 3" }
      - { id: m1-o3, text: "Audit capacity totals for 2 shared teams and 3 linked items, and record what you find", practiced_in: "lab step 4" }
      - { id: m1-o4, text: "Add a quality check for what the audit found, rerun, and make fund, pause or stop calls with a reason", practiced_in: "lab step 5 to 6 and debrief" }
    lab:
      goal: Delegate the quarterly pack to an agent that totals, links and flags, and manage it by its checks and flags
      core_message: The meeting is for decisions, not reconciliation. The agent reconciles and shows the evidence. You make the strategy and funding calls
      pm_decision: Which programs to fund, pause or stop, where capacity goes next quarter, and whether the work or the stated strategy needs to change
      build: Agent from the template (kit-m1-template)
      template_contents:
        quality_checks:
          - Each program has a submission dated this quarter
          - Each status matches the source system
          - Capacity per program is inside the team's total
          - Each link to an objective names what the work does, not only its tag
        handoff_rules:
          - A status that differs between the submission and the source system
          - Work with no clear link to a stated objective. The agent lists it and does not judge it
          - Any step that would recommend funding, ranking or a strategy change. The agent stops and hands it to the PM
        left_out_on_purpose: >-
          A check that totals each shared team across all programs. The per-program check passes for the shared
          firmware team in both programs. The learner adds the cross-program total after the audit (brief v2)
      card_steps:
        - Add the template brief and the strategy inputs to your agent
        - Send the Q3 team submissions with the prompt "Run the portfolio pack job"
        - Decide each item in the flag report
        - Audit capacity for 2 shared teams and 3 linked items
        - Add one quality check for what you found to the brief
        - Send the Q4 team submissions with the prompt "Run the portfolio pack job"
      platform_cards:
        claude: Project with the brief and knowledge files. Code execution totals the capacity sheet. Output .xlsx. Google Sheet option, download .xlsx or CSV, upload in chat
        chatgpt: Project with the brief and files. Totals through ChatGPT Work file output with formulas (cg-09, cg-10). Google Sheet option, download .xlsx or CSV, upload in chat
        copilot: Agent with the brief and embedded files. Upload the capacity sheet (.xlsx) in chat each run. Download the output in the same session. Google Sheet option, download .xlsx, upload in chat
        gemini: Gemini skill with the brief. Totals in the Google Sheet template with formulas
      fast_start_card: One per platform, with one annotated screenshot of where to start and which field the template goes in
      core_path_no_connectors: yes. Upload submissions, status export and capacity sheet
      inputs:
        own_work: Your team plan submissions, a status export and capacity by team for one quarter, with names and spend removed if the tool is not approved
        fallback_case: "Larkspan: strategy-okrs-kpis, capacity sheet (knowledge); m1-submissions-q3, m1-status-q3 (run); m1-submissions-q4 (run 2); m1-check-sample (check)"
      stretch:
        - Compare 2 PM-named funding scenarios ("fund X instead of Y") and show what slips (sp-wf-13; Gate 1 places it here). The PM names both scenarios; the agent does not propose one
        - Turn the job into a custom skill (Claude all plans, ChatGPT business plans, Gemini)
      planted_error:
        error: >-
          Capacity counted twice. The shared firmware team is planned at 100% in two programs (case: Probe X cellular
          and Hub firmware). Each program's ask is inside the team's total, so the per-program check passes. The audit
          sums by team and finds 200%
        warning: told
        fix: Add the quality check "Total each shared team across all programs. Send any team over its capacity to the flag report"
      success_check: >-
        The Q4 pack shows status, capacity and the link to an objective for each program. Each flag has your decision.
        You recorded audit findings for 2 shared teams and 3 linked items and added a check to the brief. The agent made
        no funding or strategy recommendation
      debrief_check: >-
        Shown in the debrief only. After the fix, the Q4 flag report names the shared firmware team over capacity, with
        both programs and the total. Work with no clear link is listed, not judged. Counts: case/expected-results.md
      check_sample:
        when: Debrief, 3 minutes. Learners run it. ChatGPT learners run it in a new chat outside the project (decision f5)
        input: m1-check-sample (a second quarter where a shared test lab is planned in two programs)
        pass_condition: The flag report names the shared test lab with its cross-program total. No funding or ranking line appears. Exact counts in case/expected-results.md
      learner_evidence: [tuned brief (v1 to v2 with the shared-team total check), flag report decisions for Q3, audit findings for 2 shared teams and 3 linked items, fund pause or stop calls with reasons and a note on whether the work or the strategy needs to change]
      data_safety: >-
        Standard note and the 3-question data check card above step 1. Plans hold spend, headcount and unreleased dates.
        Remove names and spend, or use the case, if the tool is not approved. No confidential terms list in this lab (it
        moves to lab 4). The pack log keeps totals and decisions; decide if it keeps names
    agent_growth: Builds the agent. Adds the portfolio pack job
    catch_up_kit: kit-m1-template (start); kit-m2 (end state)
    registry_guard: >-
      No Strategy Matrix, box mapping or "peanut butter" count (Dan, row 01). No Focus Strategy Alignment agent exists, so
      house rule 11 does not apply. Build teaches estimates and release planning; not retaught. AI Agents course
      boundaries: new slides only. Workshops Strategic Transformation and Implementation and Action Planning map to
      capability 2: Dan to check overlap (OI-09)
    talk_track_slots:
      why_this_matters: >-
        N21 (fieldwork Q4 2025): 72.2% of respondents spend 25% or less of their time on product strategy. W1 (vendor,
        Atlassian): leaders say priorities are clear but few can show the work is linked. W1 figures stay in the talk
        track until the primary W2 is opened (OI-10). The Expedia item is an anecdote, not data
      story_slot: Optional. A leadership team that found two programs counting on the same scarce team. Told as a story from Pragmatic's work with companies
      monday_close: Take last quarter's plan. Total each shared team across all programs before the next review
      internal_and_hardware: The Fleet Data Platform (internal) is one program in the pack. The shared firmware team is the hardware example

  - id: m2
    number: 2
    title: "Requests: the agent builds the case, you make the call"
    workflow_row: sp-wf-12
    folded_rows: []
    workflow: >-
      Decide on each request batch of feature and stakeholder requests against the problem backlog, the stated strategy
      and past decisions, and close the loop with each requester. Intake can be frequent. The agent only logs and flags
    category: Market
    focus_area: Market Problems
    capability_standards: { status: "confirmed by Dan, Gate 2 Q2, 2026-11-26", skills: [2.2 Opportunity Prioritization (AI text only), 1.1 Market Problem Identification (supporting)], competencies: ["2.2E Opportunity Comparison and Decision Support (light form, no scoring)", "1.1A Problem vs. Opinion Discrimination", "2.1D Opportunity-to-Strategy Fit Evaluation (PM-owned)"], gap: "2.2A to 2.2D are written around scoring; not covered (scoring is out, decision d)" }
    bottleneck: >-
      Requests arrive through many channels and every requester believes theirs is the most urgent. Leaders, sales and
      customers override agreed priorities, so the loudest voice wins and decisions get reopened. Requesters hear
      silence instead of a reason (W29, W25 with W27 and N9 as one family). "Past decisions are hard to find" is an
      assumption with no source; say so in the talk track
    minutes: 60   # full day
    split: { instructor_led: 24, hands_on: 36, percent_instructor_led: 40 }
    arc:
      - { minutes: 7, mode: instructor-led, step: "Why this matters. A request is not a problem. Why the decision field stays blank: people follow an agent's lean (E1, \"54% vs 36%\"). Evidence order is one input, not a priority. Cadence: intake can be frequent; the PM reviews the problem backlog at the PM's own cadence, often once a quarter. Internal platform example: the Fleet Data Platform PM gets requests from Support, Install and Finance" }
      - { minutes: 9, mode: instructor-led, step: "Live demo. Add the request job. Run request batch 1. Read one decision card. Write a decision. The agent drafts the reply" }
      - { minutes: 8, mode: instructor-led, step: "Build pattern and lab brief. The decision checkpoint (rung 1 plus). Reply rules: no date the roadmap does not hold, no promise beyond the decision. Data safety. Hint: audit before you approve" }
      - { minutes: 28, mode: hands-on, step: "Lab 2" }
      - { minutes: 8, mode: hands-on, step: "Debrief. Reveal the error (2 minutes). Check sample: each learner sends m2-check-sample in a new chat on the tuned brief and compares with the pass condition (3 minutes). Requests the agent links to no problem go to discovery, not to no (1 minute). What you do Monday (1 minute). Log save card (1 minute)" }
    half_day:
      minutes: 75
      split: { instructor_led: 30, hands_on: 45, percent_instructor_led: 40 }
      arc_minutes: [8, 11, 11, 35, 10]
      note: Extra time goes to the reply rules in the lab brief, to the lab, and to the discovery point in the debrief (3 minutes)
    rung: 1 plus
    rung_name: Hand-run batch with a decision checkpoint
    objectives:
      - { id: m2-o1, text: "Extend the agent with a request job that builds one decision card per request and leaves the decision field blank", practiced_in: "lab step 1 to 2" }
      - { id: m2-o2, text: "Audit 3 cards and 2 cited decision log entries against the source requests", practiced_in: "lab step 3" }
      - { id: m2-o3, text: "Add a matching rule to the brief for what the audit found", practiced_in: "lab step 4 and debrief check sample" }
      - { id: m2-o4, text: "Write yes, no or later and a reason on each flagged card, then check that each reply matches your decision", practiced_in: "lab step 5 to 6" }
    lab:
      goal: Extend the course agent to build a decision card for each request, then draft the reply after you decide
      core_message: The agent finds the problem, the evidence and the past decision. You make the call, and the requester hears a reason, not silence
      pm_decision: Yes, no or later for each request, the reason, any condition for "later", and whether a new problem goes to discovery
      build: Extend the agent with the request job card, the problem backlog, the request decision log and the current roadmap
      quality_checks:
        - Each card quotes the request and names the requester and source
        - Each duplicate or past decision cites a decision log id
        - Each card quotes the strategy or OKR text that may relate to the request, or says "none found". It makes no fit statement. The PM judges fit
        - The decision field is blank on every card the PM has not decided
        - Each reply matches the PM's decision and reason, with no new date
      handoff_rules:
        - A request with "no problem stated" or "no match" in the problem backlog
        - A request that contradicts a past decision, or a past "later" whose condition may now be met
        - Any request from an executive, or tied to a named deal or contract date
        - Any request that holds personal, health or client data
      agent_never: Fills the decision field, proposes an order of requests, or judges strategic fit. It quotes text. The PM judges fit. It may order the problem backlog by evidence (the evidence_order column). It never calls that order a priority
      card_steps:
        - Add the request job card and the decision log to your agent
        - Send request batch 1 with the prompt "Run the request job"
        - Audit 3 cards and 2 cited log entries
        - Add one matching rule for what you found to the brief
        - Write yes, no or later and a reason on each flagged card
        - Send your decisions with the prompt "Draft the replies"
      platform_cards:
        claude: Project with the brief and knowledge files
        chatgpt: Project with the brief and files
        copilot: Agent with embedded files. Upload the requests file (.xlsx) in chat
        gemini: Gemini skill with the brief. Requests file in chat
      core_path_no_connectors: yes. Upload one request batch and the decision log
      inputs:
        own_work: One request batch (8 to 15 requests) and any record of past decisions, with customer names, deal values and contract dates removed if the tool is not approved
        fallback_case: "Larkspan: problem backlog, request decision log, roadmap (knowledge); m2-requests-batch-1 (run); m2-check-sample (check)"
      stretch:
        - Read requests from a shared intake form or tracker, where the platform and company allow (not verified)
      planted_error:
        error: >-
          False duplicate. Two requests say "offline mode" but describe different problems: field installers at remote
          cold storage sites with no signal, and a pharmacy and lab customer that cannot send data off site. The agent
          merges them and attaches last year's "no" with its reason. The card cites a decision log id and quotes the
          request, so the checks pass. The audit opens the merge and finds two problems
        warning: hint
        fix: Add the rule "Match on the problem statement and the user, not on feature words. Send any merge across segments to the flag report"
      success_check: >-
        Every card has a blank decision field until you decide. Every past decision cites a log id. You audited 3 cards
        and 2 cited log entries, added a rule, decided each flagged card and checked that each reply matches your decision
      debrief_check: >-
        Shown in the debrief only. After the fix, the two "offline mode" requests are on separate cards. Only the field
        installer card links to last year's decision. The pharmacy and lab card goes to the flag report as "no match".
        Record ids: case/expected-results.md
      check_sample:
        when: Debrief, 3 minutes. Learners run it. ChatGPT learners run it in a new chat outside the project
        input: m2-check-sample (request batch 2, with two requests that share the words "custom alerts" but come from different users)
        pass_condition: Two separate cards. No decision field is filled. Exact result in case/expected-results.md
      learner_evidence: [tuned brief with the matching rule, flag report decisions, audit findings for 3 cards and 2 cited log entries, decision cards with yes no or later and a reason, reply drafts that match each decision]
      data_safety: >-
        Standard note. Requests often hold customer names, deal values and contract dates. Remove them or use the case.
        The request decision log keeps data longer than a one-off prompt; decide what it keeps
    agent_growth: Adds the request job, the problem backlog, the request decision log and the roadmap
    catch_up_kit: kit-m2
    registry_guard: >-
      Market Research module 3 owns tagging and counting feedback by account: no slides on tagging or counting; refer
      to it as known. Focus slide 29 splits a sales request across Strategy Matrix boxes; not used. AI-AGENTS names
      "triaging feature requests against strategy" as an example line only, with no build. Not a CAW-AI agent. No
      scoring, weights or rescoring (decision d). W36 (Pragmatic article) is method only, not on a slide
    talk_track_slots:
      why_this_matters: >-
        N21 (fieldwork Q4 2025): 60.2% of respondents name "leadership escalations or new directives" as a factor that
        most often overrides their prioritization framework (multi-select; survey wording, quoted). E1 (vendor RCT): "54%
        vs 36%". Say "54% vs 36%", not a points gap
      cadence_and_evidence_order: >-
        Intake can be frequent. The agent logs and flags each request batch. It changes nothing in the problem backlog.
        The PM reviews the problem backlog at the PM's own cadence, often once a quarter. Review too often and the team
        gets whiplash. Teams need focus on the problems with the biggest impact, then solve them and measure results.
        The agent may order the problem backlog by amount of market evidence. The column is "evidence order", never
        "priority". Evidence order is one input. The PM also weighs strategy, capacity, dependencies and other factors.
        Do not follow it blindly: people follow an agent's lean (E1, "54% vs 36%"; vendor RCT, state its limits)
      weigh_other_factors_example: >-
        A problem can rank high on market evidence and problem impact and still be deprioritized for other factors:
        strategy, risk, investment level, build time, customer relations, dependencies and resource allocation. Case
        example: PB-02 (audit preparation, evidence order 1) ranks first on evidence. The case PM says yes to REQ-112
        and acts on it (it becomes CR-07). Say: "Another PM could still defer a top problem for build time and
        dependencies." Do not say the case PM defers PB-02. The PM writes the reason in the decision card. The agent never writes it
      story_slot: Optional. An internal platform team that answered requests with silence until a decision log made the reason visible. Told as a story from Pragmatic's work with companies
      monday_close: Take the last 10 requests you got. Find the problem behind each one before you answer
      internal_and_hardware: Fleet Data Platform internal requests (W29 internal PM). Hardware, a "yes" can add a part variant (W30, one source; example only)

  - id: m3
    number: 3
    title: "The living business case: assumptions, red team and what changed"
    workflow_row: sp-wf-05
    folded_rows: [sp-wf-03, sp-wf-11]
    folded_checks: [sp-wf-04 denominator check, as one quality check]
    workflow: Keep the business case assumption register current and red-team it before each decision point
    category: Business
    focus_area: Business Plan
    capability_standards: { status: "confirmed by Dan, Gate 2 Q2, 2026-11-26", skills: [2.3 Business Case Development], competencies: ["2.3B Market Value and Sizing", "2.3C Cost, Profit, and Resource Logic"], not_claimed: "2.3F Stakeholder Argumentation (no lab step practices it; dropped after the critic)" }
    bottleneck: >-
      Business cases go stale during execution, and teams rarely recheck the original assumptions (W15, 2024, age flag
      kept by Dan; W14 is not a PM statistic). Hardware commits in stages, and the cost of a wrong decision rises
      steeply at each one (N10, N11). Published market estimates differ because they measure different scopes and
      base years (W7, W8). Gap: no 2026 product-team source on stale business cases
    minutes: 70   # full day
    split: { instructor_led: 28, hands_on: 42, percent_instructor_led: 40 }
    arc:
      - { minutes: 8, mode: instructor-led, step: "Why this matters. A business case is a living list of bets. Hardware: commit late, learn early (N10, N11). Market size terms defined here: market, market segment, evaluator adoption, projected share (projected share only from your internal data)" }
      - { minutes: 11, mode: instructor-led, step: "Live demo. Add the business case job and the sheet. Run the register and sensitivity. Read the red team note and the flag report" }
      - { minutes: 9, mode: instructor-led, step: "Build pattern and lab brief. The sheet holds the formulas; the agent writes inputs and reads results. One link per number. People pull their numbers toward an AI number (E16, E17), so the brief holds no target number (E4). Data safety. Hint: audit before you approve" }
      - { minutes: 33, mode: hands-on, step: "Lab 3" }
      - { minutes: 9, mode: hands-on, step: "Debrief. Reveal the error (2 minutes). Read the \"what changed\" note from run 2 together (2 minutes). Check sample: the instructor shows the m3-check-sample result from the demo run against the pass condition; learners run it after class (1 minute). Go, hold or stop to recommend is yours (2 minutes). What you do Monday (1 minute). Log save card (1 minute)" }
    half_day:
      minutes: 65
      split: { instructor_led: 26, hands_on: 39, percent_instructor_led: 40 }
      arc_minutes: [7, 10, 9, 31, 8]
      note: 5 minutes shorter than the full day (Gate 2 decision 4). The lab keeps all 6 card steps. The "what changed" read in the debrief gets 1 minute, not 2
    rung: 2
    rung_name: Refresh with a "what changed" report
    objectives:
      - { id: m3-o1, text: "Extend the agent to keep an assumption register with evidence, date, owner and effect, using a sheet that holds the formulas", practiced_in: "lab step 1 to 2" }
      - { id: m3-o2, text: "Audit the evidence for the 2 assumptions with the largest effect and record what you find", practiced_in: "lab step 3 to 4" }
      - { id: m3-o3, text: "Add a hand-off rule, rerun with new evidence and read the \"what changed\" note", practiced_in: "lab step 5 to 6 and debrief" }
      - { id: m3-o4, text: "State your gate recommendation (go, hold or stop) and the next assumption to test, with a reason", practiced_in: "debrief" }
    lab:
      goal: Extend the course agent to keep the business case register, run sensitivity and red-team the case before the next commit point
      core_message: A business case is a living list of bets. The agent keeps the list and the math. You decide which bets to keep
      pm_decision: Whether the case still holds at the next commit point (go, hold or stop to recommend), and which assumption to test next
      build: Extend the agent with the business case job card, the business case and the business case sheet. The market size source pack is a run file, sent with the business case
      quality_checks:
        - Each assumption has evidence, a date and an owner
        - Each assumption has a low, base and high value set by the PM
        - Each market size number has one link, a date, a unit and a scope
        - Each share or rate names its denominator (sp-wf-04 check)
        - The red team note covers the assumptions with the largest effect on the result
      handoff_rules:
        - An assumption with no evidence, or evidence older than the age the PM sets
        - An assumption whose evidence changed since the last version
        - Any result that flips sign (profit to loss) inside the tested range
        - Projected share from any source other than the PM's internal data
        - Any step that would recommend go, hold or stop. The agent stops and hands it to the PM
      agent_never: Recommends go, hold or stop, or changes an assumption value. It lists assumptions in the order of the sheet's swing column and adds no other order
      card_steps:
        - Add the business case job card and the sheet to your agent
        - Send the business case and the source pack with the prompt "Run the business case job"
        - Decide each item in the flag report
        - Audit the evidence for the 2 assumptions with the largest effect
        - Add one hand-off rule for what you found to the brief
        - Send the Q4 evidence file with the prompt "Run the business case job"
      platform_cards:
        claude: Project with the brief. Code execution writes inputs to the sheet and reads results. Output .xlsx. Google Sheet option, download .xlsx or CSV, upload in chat
        chatgpt: Project with the brief. ChatGPT Work file output with formulas (cg-09, cg-10). Check the memory mode (cg-14). Google Sheet option, download .xlsx or CSV, upload in chat
        copilot: Agent with embedded files. Upload the sheet (.xlsx) in chat each run. Download output in the same session (mb-11). Google Sheet option, download .xlsx, upload in chat
        gemini: Gemini skill with the brief. Google Sheet template with formulas. Upload any new source yourself
      core_path_no_connectors: yes. Case source pack for market size. Live search is stretch
      inputs:
        own_work: One business case or investment proposal and its model, with supplier names, prices and non-public financials removed if the tool is not approved
        fallback_case: "Larkspan: business case for Probe X, business case sheet (knowledge); m3-source-pack and m3-tooling-quote (run 1, sent with the business case); m3-evidence-q4 (run 2); m3-check-sample (check)"
      stretch:
        - Update the market size inputs by live web search at the PM's own cadence, one link per number (Claude, ChatGPT, Copilot only; decision f4). No confidential names in queries
        - Buy, build or partner pack for one component (sp-wf-06), only if time allows (Gate 1 decision a)
      connector_lane:   # Gate 2 late items 13 and 14. Labs 3 to 5 only. Not one of the 6 steps. Not needed for the pass condition
        card: Optional connector lane, a separate card after the data check card. Outside the 6 steps
        what: The learner reads the input from a connected source instead of an upload, or sends the output to a connected tool. Same quality checks and hand-off rules apply
        rules: Data safety check first. Approved connectors only. No new data class. The core path stays no-connector. No instructor troubleshooting promise
        naming: Name no connector on any card until a dated vendor doc exists for that platform and plan
      planted_error:
        error: >-
          The quote price needs a minimum yearly order. The supplier gives the lower price per set only above a minimum
          yearly order of 50,000 sets. The business case plans 18,000 sets in year 1 and uses that lower price. Each
          number has a source and a date and the sheet recomputes the same unit cost, so the checks pass. The audit
          reads the quote terms and finds that the plan buys less than the minimum order. Chosen by Dan, Gate 2
          decision 5. Say it as bulk pricing that needs a minimum volume, like a seat license or an API plan tier
        warning: hint
        fix: Add the hand-off rule "A price that needs a minimum yearly order above the plan volume goes to the flag report"
      success_check: >-
        The register shows evidence, date, owner and low, base and high values for each assumption. The sheet holds the
        formulas. Each flag has your decision. You audited 2 assumptions, added a hand-off rule and ran the update with the Q4 evidence. The
        agent made no go, hold or stop recommendation
      debrief_check: >-
        Shown in the debrief only. After the fix, the flag report names the quote's minimum yearly order, the plan
        volume and the unit cost line it affects. With the price for the plan volume, margin falls; the exact numbers
        are in case/expected-results.md (unit cost 52.30 to 59.10, year 1 gross profit 1,881,200 to 1,758,800).
        The "what changed" note lists the Q4 evidence changes
      check_sample:
        when: The instructor shows the result from the demo run in the debrief (1 minute). Learners run it after class (about 5 minutes). The card says so
        input: m3-check-sample (a supplier quote with a minimum yearly order above the plan volume)
        pass_condition: The flag report names the quote condition and the plan volume. No go, hold or stop line. Exact result in case/expected-results.md
      learner_evidence: [tuned brief with the quote terms hand-off rule, flag report decisions, audit findings for 2 assumptions, gate recommendation (go hold or stop) and the next assumption to test with a reason]
      data_safety: >-
        Standard note. Business cases hold forecasts, prices, supplier terms and non-public financials. Remove supplier
        names and prices, or use the case, if the tool is not approved. No confidential names in web search queries
    agent_growth: Adds the business case job, the register and the sheet. The source pack is a run file
    catch_up_kit: kit-m3
    registry_guard: >-
      Focus teaches value types, the Product Canvas, a one-pass Value and Cost Snapshot and market sizing as a one-pass
      exercise. This lab starts after a case exists: register over time, sensitivity, red team and refresh. Same layer
      names as Pragmatic, defined here; no "as in Focus" and no Focus example (PS-06). Focus AI-forward will include a
      market sizing agent: the source pack basis check here is one step inside the business case, not a market sizing
      agent. Dan to confirm the difference (house rule 11, OI-06)
    talk_track_slots:
      refresh_wording: Say "update with new evidence at your own cadence, often each quarter". Do not say "refresh the priorities"
      why_this_matters: A case approved on old evidence keeps spending. Hardware cost of a wrong commit rises steeply after hard tooling (N10, N11)
      story_slot: >-
        Optional. A business case whose headline assumption was wrong within weeks. Candidate: Commonwealth Bank
        (bond-stories candidate 3, 15 months old, Dan decides; keep to the business case, not the job cuts). Told as a
        story heard from executives, not the instructor's own experience
      plain_words: >-
        Core steps and cards use plain words: "the price drops only above a minimum yearly order, and the plan buys
        less". No hardware terms (hard tooling, mold, first article) in core steps. Hardware words stay in the talk track
      card_test_item: "Stage 3 card test: a PM with no hardware background reads the lab 3 card and the quote and says what the error is in one sentence"
      monday_close: Open your current business case. Find the 2 assumptions with the largest effect and read their evidence in full
      internal_and_hardware: "Hardware path is the core (Probe X tooling). Internal: equipment or vendor contracts for an internal platform (W23, public sector; example only)"

  - id: m4
    number: 4
    title: "Roadmap refresh and change: trace every item, guard every promise"
    workflow_row: sp-wf-07
    folded_rows: [sp-wf-08]
    workflow: >-
      Run the roadmap refresh at the PM's own cadence (often each quarter) with a per-item evidence trace to the validated problem backlog, then assess
      each roadmap change: what it displaces, dependency hits, a decision log entry and a standing commitment guard
      against the release plan
    category: Focus
    focus_area: Product Roadmap
    capability_standards: { status: "confirmed by Dan, Gate 2 Q2, 2026-11-26", skills: [2.4 Product Vision and Roadmap], competencies: ["2.4B Roadmap Structuring and Framing", "2.4C Assumption and Uncertainty Transparency", "2.4D Alignment to Market Problems and Strategy"], not_taught: "2.4E Stakeholder Communication and Alignment (no audience drafting, decision c)", boundary: "Release plan changes touch 3.4 Release Planning and Delivery Management (3.4B, 3.4D). Not claimed" }
    bottleneck: >-
      A roadmap that is not governed becomes a historical record. Keeping each item traced to evidence and strategy
      takes manual work each cycle (W19, W3 fieldwork Q4 2025). Shared roadmaps become de facto commitments, so every
      change needs a change log and one version of the plan (W20, W19). Evidence is weak; say so
    minutes: 65   # full day
    split: { instructor_led: 26, hands_on: 39, percent_instructor_led: 40 }
    arc:
      - { minutes: 7, mode: instructor-led, step: "Why this matters. The roadmap is direction; the release plan is the promise. Terms defined: problem backlog, validated problem backlog, release plan" }
      - { minutes: 10, mode: instructor-led, step: "Live demo. Add the roadmap job. Run the refresh. Then send the approved request from module 2 as a change request and read the impact note, the commitment guard and the flag report" }
      - { minutes: 9, mode: instructor-led, step: "Build pattern and lab brief. Hand-off between jobs. The release plan hand-off rule (gate_2_designs.ps_10). Data safety, the confidential terms list and the guard line. Talk track: the agent is a second check, not the control. Hint: audit before you approve" }
      - { minutes: 30, mode: hands-on, step: "Lab 4" }
      - { minutes: 9, mode: hands-on, step: "Debrief. Rerun the refresh with the fixed brief (3 minutes). Reveal the error (2 minutes). Check sample: the instructor shows the m4-check-sample result from the demo run against the pass condition; learners run it after class (1 minute). Which items leave the roadmap is your call (1 minute). What you do Monday (1 minute). Log save card (1 minute)" }
    half_day:
      minutes: 60
      split: { instructor_led: 24, hands_on: 36, percent_instructor_led: 40 }
      arc_minutes: [7, 9, 8, 28, 8]
      note: 5 minutes shorter than the full day (Gate 2 decision 4). The lab keeps all 6 card steps. The "which items leave" point moves into the reveal
    rung: 3
    rung_name: Hand-off between jobs
    objectives:
      - { id: m4-o1, text: "Extend the agent to trace each roadmap item to a theme, a validated problem and a stated objective, and list items with no trace", practiced_in: "lab step 1 to 2" }
      - { id: m4-o2, text: "Audit 3 roadmap items against the evidence log, and add a rule to the brief for what you find", practiced_in: "lab step 3 to 4 and debrief rerun" }
      - { id: m4-o3, text: "Write the hand-off rule that stops the agent on any change that touches the release plan, and read the rule that passes an approved request into the roadmap job", practiced_in: "lab step 1" }
      - { id: m4-o4, text: "Decide each flag on a roadmap change and write the decision log entry with your reason", practiced_in: "lab step 5 to 6" }
    lab:
      goal: Extend the course agent to keep every roadmap item traced to evidence and to assess each change against the release plan
      core_message: The roadmap is direction. The release plan is the promise. The agent traces, assesses and guards. You decide what becomes a promise
      pm_decision: Which items stay or leave, theme wording, accept, defer or reject each change, and whether a release plan change goes to the release plan owner
      build: >-
        Extend the agent with the roadmap job card, the release plan and the roadmap decision log. The roadmap is
        already in the agent from module 2. The validated problem backlog and the evidence log are run files, sent with
        the refresh. The job also reads the strategy and OKRs file and the capacity sheet (module 1) and the request
        decision log (module 2). The learner writes the confidential terms list in the data check block and pastes it into the brief (case learners paste the Larkspan list). Full design: gate_2_designs.ps_10
      template_contents:
        note: >-
          The template holds no check or rule that reads an item's own evidence ids. The learner writes the
          own-evidence rule and the "validated" range in step 4, after the audit (brief v2). The case shows the Larkspan
          PM's choice (3 accounts, 2 source types), framed as a choice, not a standard
        left_out_on_purpose: >-
          A rule that judges each item by its own evidence, not its theme's. The trace check passes RM-14 through its
          theme and its linked validated problem
        release_plan_rule_slot: Blank. The learner writes it in step 1 (rule text in gate_2_designs.ps_10, Gate 2 decision 1)
        request_pass_rule: The rung 3 rule text (autonomy_ladder, rung 3, handoff_rule_text) is in the template. The learner reads it in step 1
      fix_the_learner_adds: "Judge each item by its own evidence ids, not its theme's. Send any item below the validated range you set to the flag report"
      quality_checks:
        - Each item traces to a theme, a validated problem and a stated objective
        - Each theme is written as an outcome, in the PM's words
        - Each impact note lists displaced items and dependency hits with their source
        - The decision log entry has date, decider and reason, and its decision field is blank until the PM decides
      handoff_rules:
        - An item with no trace
        - A theme with no item, or an item in two themes
        - A change that touches an item on the release plan. The learner writes this rule (option A, decided by Dan, Gate 2 decision 1; text in gate_2_designs.ps_10)
        - A request with no PM decision of yes in the request decision log does not pass to this job (rung 3 rule text)
        - "Commitment guard, on every change: any date, \"will ship\", \"committed\" or \"available in\" not on the release plan"
        - "Commitment guard, confidential line: any term from the PM's confidential terms list in text marked for people outside the team"
        - A change that hits a dependency on another team
      agent_never: Proposes a theme, accepts or rejects a change, writes a new date, or edits the release plan. It lists validated problems that no item traces to. It does not group them, name themes or advise. The PM names themes and decides which problems reach the product backlog
      card_steps:
        - Add the roadmap job card, the release plan and your release plan hand-off rule to your agent
        - Send the validated problem backlog and the evidence log with the prompt "Run the roadmap refresh"
        - Audit 3 roadmap items against the evidence log
        - Write one rule in the brief for what you found
        - Send change request CR-07 with the prompt "Run the change assessment"
        - Decide each flag and write your decision and reason in the decision log entry
      platform_cards:
        claude: Project with the brief and knowledge files. Second agent is stretch only where verified
        chatgpt: Project with the brief and files. Second agent is stretch only where verified
        copilot: Agent with embedded files. Upload the change request in chat. No second-agent stretch on this card
        gemini: Gemini skill with the brief. No second-agent stretch on this card
      core_path_no_connectors: yes. Upload the validated problem backlog, the evidence log and the change request. The roadmap is already in the agent
      inputs:
        own_work: Your current roadmap, validated problem backlog or equivalent, release plan and one real change request, with unreleased dates and customer names removed if the tool is not approved
        fallback_case: "Larkspan: release plan, roadmap decision log (knowledge); roadmap (already in the agent from module 2); validated-problem-backlog and evidence-log (run); m4-change-request-cr-07 (run); confidential-terms-list (paste into the brief); m4-check-sample (check)"
      stretch:
        - Build the change assessment as a second agent that reads the first agent's output (only where verified)
        - Read the roadmap from a connected tool, where the platform allows (not verified)
      connector_lane:   # Gate 2 late items 13 and 14. Labs 3 to 5 only. Not one of the 6 steps. Not needed for the pass condition
        card: Optional connector lane, a separate card after the data check card. Outside the 6 steps
        what: The learner reads the input from a connected source instead of an upload, or sends the output to a connected tool. Same quality checks and hand-off rules apply
        rules: Data safety check first. Approved connectors only. No new data class. The core path stays no-connector. No instructor troubleshooting promise
        naming: Name no connector on any card until a dated vendor doc exists for that platform and plan
      planted_error:
        error: >-
          Validation by association. Roadmap item RM-14 is backed only by one sales request, but it sits in a theme with
          strong evidence. The trace table shows it linked to validated problems, so the trace check passes. The audit
          reads the item's own evidence and finds one request
        warning: hint
        fix: Add the rule "Judge each item by its own evidence, not its theme's. Send any item below the validated rule to the flag report"
      success_check: >-
        Every item shows its trace. The change assessment lists what it displaces and its dependency hits. The
        commitment guard ran. You wrote the release plan hand-off rule, audited 3 items and added a rule to the brief.
        Each flag has your decision. The decision log entry has your decision and reason
      debrief_check: >-
        Shown in the debrief only. After the rerun, RM-14 is in the flag report as below the validated rule. The CR-07
        flag report stops on the release plan item it displaces and writes no new date. Exact lines in
        case/expected-results.md
      check_sample:
        when: The instructor shows the result from the demo run in the debrief (1 minute). Learners run it after class (about 5 minutes)
        input: m4-check-sample (a second change request whose text says "ships in Q2" for an item not on the release plan)
        pass_condition: The commitment guard flags "ships in Q2" as not on the release plan. No new date in the impact note. Exact result in case/expected-results.md
      learner_evidence: [the release plan hand-off rule as written, tuned brief with the own-evidence rule (written by the learner in step 4), flag report decisions, audit findings for 3 items, decision log entry with decision and reason]
      data_safety: >-
        Standard note. Roadmaps and release plans hold unreleased dates and customer commitments. The guard checks your
        confidential terms list. The decision log keeps data longer than a one-off prompt; decide what it keeps
    agent_growth: Adds the roadmap job (refresh and change). First hand-off between jobs
    catch_up_kit: kit-m4
    registry_guard: >-
      Focus teaches roadmap criteria (outcome not output, timeframe not date, problems not features), one roadmap for
      two audiences and a Roadmap Translator prompt exercise. No audience drafting here (decision c, option 1). One
      talk track line may say audience versions are a separate step. Build teaches release planning and stakeholder
      updates; not retaught. Partner course Mastering the Product Roadmap maps here: Dan to check overlap (OI-09)
    talk_track_slots:
      why_this_matters: Shared roadmaps turn into promises. The release plan is the only promise
      story_slot: >-
        Optional. A company that advertised a feature before it was on any release plan. Candidate: Apple personal Siri
        (bond-stories candidate 2), only if Dan does not pick it as the bond story. Told as a public company story
      talk_track_lines:
        - "A one-off problem can reach the product backlog on its own merit and impact. It does not need a group or a theme. The PM still checks its evidence against the PM's own rule"
        - "One problem in the problem backlog can become one or more epics and many user stories in the product backlog"
        - "Themes and groups help focus the work and help you coordinate with marketing and sales. They are not required to reach the product backlog"
        - "Review the roadmap at your own cadence, often each quarter. Review too often and the team gets whiplash. This is a quarterly refresh at the PM's cadence, not a weekly reorder"
        - "Data (lab 4 debrief): the agent is a second check, not the control. It misses paraphrases. Hand out the Production readiness checklist. Test with data science, privacy and compliance before production use"
      monday_close: Pick 5 items on your roadmap. Read each item's own evidence, not its theme's
      internal_and_hardware: Hardware dependency on the shared firmware team (module 1). Internal platform changes affect other internal teams (gap, example only)

  - id: m5
    number: 5
    title: "Outcomes, not output: the monthly check against the business case"
    workflow_row: sp-wf-10
    folded_rows: []
    workflow: >-
      Track realized outcomes against the business case and OKRs each month, and flag measures that are off track for
      the PM's investment review (retitled per PS-14)
    category: Business
    focus_area: Business Outcomes
    capability_standards: { status: "confirmed by Dan, Gate 2 Q2, 2026-11-26", skills: [2.3 Business Case Development], competencies: ["2.3E Success Definition and Measurement"], box_role: "Business Outcomes has no primary skill; 2.3 is secondary (workbook)" }
    bottleneck: >-
      After approval, few teams compare results with the business case baseline. Reports rely on manual status
      updates, and output measures stand in for outcomes (W23 public sector, W1). Gap: no product-team source. Say
      "warning signs include", not a statistic
    minutes: 55   # full day
    split: { instructor_led: 22, hands_on: 33, percent_instructor_led: 40 }
    arc:
      - { minutes: 7, mode: instructor-led, step: "Why this matters. Shipped is not success. Outcome versus output, defined here. Theme: be great at product management before you are great at AI" }
      - { minutes: 8, mode: instructor-led, step: "Live demo. Add the outcome job. Run October on the module 3 baseline and the module 1 OKRs. Read only the flag report" }
      - { minutes: 7, mode: instructor-led, step: "Build pattern and lab brief. Rung 3 plus: the monthly run across jobs. The PM writes the off-target range. The agent never recommends an investment change. Data safety. No error warning" }
      - { minutes: 25, mode: hands-on, step: "Lab 5" }
      - { minutes: 8, mode: hands-on, step: "Debrief. Reveal the error (2 minutes). Fix the brief for what the audit found (1 minute). Check sample: each learner sends m5-check-sample on the fixed brief and compares with the pass condition (3 minutes). Keep, change or stop is yours (1 minute). What you do Monday (1 minute)" }
    half_day:
      minutes: 50
      split: { instructor_led: 20, hands_on: 30, percent_instructor_led: 40 }
      arc_minutes: [6, 7, 7, 23, 7]
      note: 5 minutes shorter than the full day (Gate 2 decision 4). The lab keeps all 6 card steps. Debrief drops the separate keep, change or stop minute; it goes into the reveal
    rung: 3 plus
    rung_name: Monthly run across jobs
    objectives:
      - { id: m5-o1, text: "Extend the agent to track each measure against the business case baseline and the OKRs, labeled outcome or output", practiced_in: "lab step 1 to 3" }
      - { id: m5-o2, text: "Write the off-target range and the number of months in the brief", practiced_in: "lab step 2" }
      - { id: m5-o3, text: "Audit 2 \"on track\" measures against the business case, starting with the outcome the business case names, and write the outcome-or-output rule for what you find", practiced_in: "lab step 5 and debrief" }
      - { id: m5-o4, text: "Write an investment review note: keep, change or stop, with a reason that cites the measures", practiced_in: "lab step 6" }
    lab:
      goal: Extend the course agent to track outcomes against the business case each month and flag measures for your investment review
      core_message: Shipped is not success. The agent tracks outcomes. You decide what to fund
      pm_decision: Which measures count as success, whether to keep, change or stop investment, and what to tell leaders
      build: Extend the agent with the outcome job card and the outcome sheet. The job reads the module 3 business case baseline and the module 1 OKRs and KPI targets
      quality_checks:
        - Each value has a source and a date
        - Each measure is compared with its baseline and its target
        - Each measure is labeled outcome or output, with one line on why
      handoff_rules:
        - A measure off target by more than the range the PM sets, for the number of months the PM sets
        - A measure with no current data
        - An outcome measure with no change while its outputs grow
        - Any step that would recommend keeping, changing or stopping investment. The agent stops and hands it to the PM
      agent_never: Recommends an investment change (PS-14). The monthly run measures results. It reorders no backlog and changes no priority
      card_steps:
        - Add the outcome job card and the outcome sheet to your agent
        - Write your off-target range and number of months into the brief
        - Send the October and November exports with the prompt "Run the outcome job"
        - Decide each item in the flag report
        - Audit 2 "on track" measures: the outcome named in the business case, and one other
        - Write your investment review note with keep, change or stop and a reason
      platform_cards:
        claude: Project with the brief. Code execution on the outcome sheet. Google Sheet option, download .xlsx or CSV, upload in chat
        chatgpt: Project with the brief. ChatGPT Work file output with formulas. Google Sheet option, download .xlsx or CSV, upload in chat
        copilot: Agent with embedded files. Upload the outcome sheet (.xlsx) and exports in chat each run. Google Sheet option, download .xlsx, upload in chat
        gemini: Gemini skill with the brief. Google Sheet template with formulas
      core_path_no_connectors: yes. Upload metrics exports
      inputs:
        own_work: Two months of metric exports for one product or initiative, plus its business case measures or OKRs, aggregated, with no customer or patient data
        fallback_case: "Larkspan: outcome sheet (knowledge); business case baseline and OKRs (in the agent); m5-metrics-oct and m5-metrics-nov (run); m5-check-sample (check)"
      stretch:
        - Run each month on a schedule, only where verified. New slides; not the CAW-AI setup slide
      connector_lane:   # Gate 2 late items 13 and 14. Labs 3 to 5 only. Not one of the 6 steps. Not needed for the pass condition
        card: Optional connector lane, a separate card after the data check card. Outside the 6 steps
        what: The learner reads the input from a connected source instead of an upload, or sends the output to a connected tool. Same quality checks and hand-off rules apply
        rules: Data safety check first. Approved connectors only. No new data class. The core path stays no-connector. No instructor troubleshooting promise
        naming: Name no connector on any card until a dated vendor doc exists for that platform and plan
      planted_error:
        error: >-
          Output counted as outcome. The business case outcome is "active paid Probe X sites". The agent reports it on
          track using "Probe X units shipped to resellers", because the metric names match. Each value has a source and
          a label, so the checks pass. The audit finds that the metric does not measure the outcome
        warning: none
        fix: Add the rule "Match each measure to the outcome text in the business case, not to the metric name. Units shipped is an output"
      success_check: >-   # fade level none: no error-specific condition before the lab
        Each measure shows its baseline, target, source and label. Each flag has your decision. You audited 2 measures
        and wrote an investment review note with a reason
      debrief_check: >-
        Shown in the debrief only. After the fix, "active paid Probe X sites" is reported from site activations, not
        units shipped, and goes to the flag report as off the PM's range. Exact numbers in case/expected-results.md
      check_sample:
        when: Debrief, 3 minutes. Learners run it. ChatGPT learners run it in a new chat outside the project
        input: m5-check-sample (a KPI "Cloud subscription attach rate" next to an output "Cloud trials started")
        pass_condition: Attach rate is reported as the outcome; trials started is labeled output. No investment recommendation. Exact result in case/expected-results.md
      learner_evidence: [off-target range and hand-off rules, outcome-or-output rule written in the debrief, flag report decisions, audit findings for 2 measures, tuned brief after the debrief, investment review note with keep change or stop and a reason]
      data_safety: >-
        Standard note. Use aggregated metrics only. Health care outcome data can hold patient data: never upload it to a
        tool the company has not approved
    agent_growth: Adds the outcome job. The agent now has five jobs
    catch_up_kit: kit-m5 (start); kit-final (complete agent, take home)
    registry_guard: >-
      Focus teaches success measures; Build teaches the metrics story; MKT-2026 teaches marketing metrics. This lab
      starts after measures exist: monthly tracking against the business case with checks and an audit. Schedule is
      stretch with new slides (CAW-AI overlap)
    talk_track_slots:
      why_this_matters: Most reviews report what shipped. The business case promised an outcome
      story_slot: Optional. An executive team that celebrated a launch while the outcome measure did not move. Told as a story heard from executives
      cadence_line: "The monthly run measures results against the business case. It changes no priorities. The PM sets how often to review priorities, often each quarter. Module 1 echo: a check can pass while the total is wrong. Here a metric name can match while the outcome is not measured"
      monday_close: Take one key result. Check that its metric measures the outcome, not the work

