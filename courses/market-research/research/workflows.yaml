      note: Page did not load. Retry in the first Stage 1 run

  dropped:
    - Lyssna Research Synthesis Report 2025 (2025 study, decision 32)

  open_gaps:
    - A non-vendor 2026 source for the bottleneck (E1 and E2 are one vendor)
    - Second source for E4 and E5
    - Primary Delight Path report for E3
    - Hardware and internal PM sources
    - Scheduling and triggers on each platform for the stretch path
  gate_1_decision: ""   # Dan only

- id: mr-wf-02
  workflow: Run a win/loss program that turns each decided deal into an updated, checked decision-driver report
  topic_area: Win/loss analysis
  trigger_and_cadence: Deals close as won or lost every week. Pragmatic says interview evaluators 2 to 4 weeks after the decision and use 10 or more deals to find patterns. Assumption, a monthly batch and a quarterly report
  input: CRM records for decided deals (stage, amount, segment, stated loss reason), win/loss interview notes or transcripts, and the current decision-driver log
  output: Decision-driver log per deal (primary driver, secondary drivers, alternative chosen, buyer quotes), a CRM versus buyer "match rate" table, a quarterly pattern report by segment, and a flag report for the PM
  pm_decision_informed: Which market problems, pricing or positioning issues and sales gaps to act on, and which to share with sales, marketing and leadership
  bottleneck:
    description: Manual win/loss is slow and does not scale, so quarterly reports arrive after the chance to act has passed. Sales-entered loss reasons often differ from what buyers say, so teams that skip interviews act on the wrong reason. Many teams do not run win/loss at all
    pdlc_stage: Market
    focus_area: Win/Loss Analysis
    sources: [W1, W2, W3]
  scores:
    judgment: medium. Coding a driver from an interview follows rules; deciding what a pattern means for strategy needs the PM
    repetition: high. Same steps for each deal and each batch
    ai_candidate: yes. The agent codes each deal and keeps the log; the PM manages by checks, flags and audits
  split:
    agent_does:
      - Match each interview to its CRM deal record
      - Code the primary and secondary decision drivers against the driver code book
      - Compare the CRM loss reason with the buyer's reason and update the match rate
      - Group drivers by segment, deal size and alternative chosen
      - Mark drivers as new, growing or fading against the last report
      - Send flags to the PM
    pm_manages:
      brief: Job, inputs, driver code book, minimum deals per pattern, output format, done criteria
      quality_checks:
        - Each driver has a buyer quote found word for word in the interview
        - Each driver shows its count of interviewed deals, accounts and segments (counts, not a verdict)
        - Each deal is marked "interview" or "CRM only"
      handoff_rules:
        - A deal where the CRM reason and the buyer reason differ
        - A lost deal that names an alternative not in the code book
      audit: 2 random deals per batch, read in full against the driver codes and the match rate entry
    program_rules: Add each win/loss interview to the driver log as soon as it is coded. Do not wait for a minimum number of deals. A win/loss interview covers the whole buyer journey, so one interview can change a decision. The agent shows the deal count with each driver; the PM decides what to act on. Someone outside sales runs the interviews (Dan, Gate 2 decision 7, 2026-11-22. Replaces the PA-04 minimum of 10 deals)
    pm_decides:
      - The driver code book
      - Which drivers to act on, and what goes to validation
      - Which findings go to which team, and how to frame them for sales
      - Which deals to add to the interview list
  ai_error_to_catch: A CRM-only deal leaks into the buyer findings. The agent fills a missing interview with the CRM reason ("price"), so price looks like a top buyer driver. The quote check passes on the deals that have interviews; only the audit of the deal source column finds it
  contexts:
    hardware: Wins and losses often go through distributors and resellers, so the PM may not reach the buyer directly. gap, no source found that describes win/loss burden in hardware
    internal_pm: Adoption wins and losses of an internal platform (teams that chose it, teams that kept their own tool). gap, no source found
    industry_notes:
      - "health care: some evaluators are clinicians who are hard to reach (W3). Remove patient data from notes first. Not yet researched"
      - "data safety: interview notes and CRM exports can hold customer names and deal values. Use only a tool the company has approved"
  proposed_lab:
    goal: Extend the course agent to run win/loss on a batch of decided deals and report the gap between sales reasons and buyer reasons
    core_message: The agent's report is only as true as its sources. Make the agent label where each finding comes from, then audit the labels
    build_type: agent (extend the module 1 agent with a win/loss skill or knowledge file)
    core_path_no_connectors: yes. The learner uploads a CRM export (CSV) and interview notes from the fallback case company
    data_safety: "Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)"
    platforms:
      claude: Skill with the driver code book and output format, added to the course agent project
      chatgpt: Project with the brief, code book and CSV (E9 not verified)
      copilot: Agent in Copilot agent builder with the code book as an embedded file (E6)
      gemini: Gemini skill with the brief and code book (E8). For Workspace, Gemini app skills are available to all Workspace customers per the Workspace Updates blog (gm-03, 2026-09-30, updated 2026-11-09); business Gems are removed from March 2027. Test on a Workspace account at Gate 2
    stretch: Run the agent on each new batch when the export file arrives, where the platform allows (not verified)
    registry_check: "Not a CAW-AI agent. CAW-AI module 4 (\"what only your buyers can tell you\") compares own buyer sources with public reviews; this lab does not reteach that. Inputs overlap with mr-wf-01 (win/loss calls). The difference is the deal-level driver log and the CRM match rate. Dan to decide whether this is a separate module or a lab inside mr-wf-01. Pragmatic fit is strong: the guide names win/loss, 2 to 4 weeks after the decision, at least 10 deals"
  evidence:
    - id: W1
      claim: Sales-entered CRM loss reasons are often inaccurate; buyer interviews give better data
      type: claim
      source: Win/loss analysis, 5 common mistakes, Andrew Peterson, Clozd
      url: https://www.clozd.com/blog/win-loss-analysis-5-common-mistakes
      source_date: 2026-04-20
      checked_on: 2026-11-20
      age_flag: false
      status: "verified"
      note: Vendor of win/loss services. Its "inaccurate 60% of the time" figure has no named source. Do not use the figure
    - id: W2
      claim: Manual win/loss programs are time-intensive and cannot scale; quarterly reports compiled by hand arrive too late. Sellers and buyers cite different loss reasons 50 to 70% of the time
      type: claim
      source: How to Conduct Win-Loss Analysis, A Practical Implementation Guide, Anton Rius, Corporate Visions
      url: https://corporatevisions.com/blog/how-to-conduct-win-loss-analysis-implementation-guide/
      source_date: 2026-07-30
      checked_on: 2026-11-20
      age_flag: false
      status: "verified (claim); 50 to 70% statistic partly verified"
      note: Vendor of win/loss services. First published 2024-11-12, updated 2026-07-30. The 50 to 70% figure is from its own analysis of 150,000+ B2B deals; study date and method not given, so it may fail the 2026 rule. Do not put the figure on a slide until the primary is found
    - id: W3
      claim: Win/loss is underused; self-reported reasons often differ from the real reason; teams need a tagging method to find patterns
      type: claim
      source: Comprehensive Approach to Win/Loss Analysis, Diana Igua and Jen Doyle, Pragmatic Institute
      url: https://www.pragmaticinstitute.com/resources/articles/product/comprehensive-approach-to-win-loss-analysis
      source_date: 2022-09-06
      checked_on: 2026-11-20
      age_flag: true
      status: "not verified"
      note: Last modified date only. Older than 12 months; Dan decides. Its "35% of teams" figure is an old survey and fails the 2026 rule. Independent of W1 and W2
    - id: W4
      claim: A manual win/loss program is slow; results arrive out of date
      type: claim
      source: Difficulty running win-loss analysis, Adam McQueen, Klue
      url: https://klue.com/blog/difficulty-running-win-loss-analysis
      source_date: 2025-09-04
      checked_on: 2026-11-27
      age_flag: true
      status: "verified"
      note: "Vendor. First-hand account: 'by the time I could share results, it was an out-of-date point in time.' Published 2024-05-29, modified 2025-09-04. Older than 12 months; Dan accepted the age flag (Gate 3 module 2 D1 option C, 2026-11-27). Independent of W1 and W2. Supports 'slow', not 'does not scale'"
    - id: W5
      claim: Win/loss tools now apply the same analysis to recorded sales calls as to buyer interviews, and the calls feed an AI analysis of the deal
      type: tool feature
      source: Gong integration, Clozd Help Center
      url: https://help.clozd.com/hc/en-us/articles/42193312117531
      source_date: 2026-11-02
      checked_on: 2026-11-27
      age_flag: false
      status: "verified"
      note: "Vendor doc. Quotes: 'Calls are included in Gong's AI analysis of an opportunity, account, or pipeline.' Gong call transcripts are 'tagged and summarized using the same analysis applied to interviews.' Covers calls and interviews. Does not cover emails, so emails stay in the talk track as the course view (module 2 slide 2.2, D1 option C)"
  open_gaps:
    - A 2026 primary study on win/loss time or CRM reason accuracy
    - Hardware and internal PM win/loss sources
  gate_1_decision: ""

- id: mr-wf-03
  workflow: Route each week's inbound customer feedback into the market problem log
  topic_area: Research, buyer and market insight
  trigger_and_cadence: Feedback arrives every day from support tickets, sales call notes, feature requests and survey comments. Assumption, a weekly batch
  input: An export of the week's feedback items with channel, account and segment, plus the current market problem log and tag list
  output: Each item tagged to a market problem or marked "no fit", a weekly "what moved" summary (by accounts, not mentions), and a flag report for the PM
  pm_decision_informed: Which market problems gain or lose weight, and which new problems need discovery interviews
  bottleneck:
    description: Feedback is spread across many tools. Tagging by hand is slow, subjective and does not scale. Tags drift over time, so trends become unreliable and the signal gets lost in the noise
    pdlc_stage: Market
    focus_area: Market Problems
    sources: [W4, W5]
  scores:
    judgment: low to medium. Tagging follows the tag list; naming a new problem needs the PM
    repetition: high. Hundreds of items each week, same steps each time
    ai_candidate: yes
  split:
    agent_does:
      - Remove duplicates and group items from one account
      - Tag each item to a problem in the log, or mark it "no fit"
      - Count each problem by accounts and segments, not by mentions
      - Compare with last week and write the "what moved" summary
      - Send flags to the PM
    pm_manages:
      brief: Job, channels in scope, tag list with definitions, counting rule (accounts, not mentions), output format
      quality_checks:
        - Each tag has a one-line reason that quotes the item
        - Each item has exactly one primary tag or "no fit"
        - Counts are by unique account
      handoff_rules:
        - Items marked "no fit" that repeat across 3 or more accounts
        - A problem that moves more than the threshold in the brief
        - Items that hold personal or health data
      audit: 10 random tagged items per week, plus every item in the "no fit" group
    pm_decides:
      - The tag list and when to add or merge a problem
      - Which moves are real and need discovery
      - What to tell the teams that sent the feedback
  ai_error_to_catch: Forced fit. The agent tags a new problem to the nearest old tag, so the "no fit" group stays empty and the new problem is hidden. The reason check passes because the item shares words with the tag. The audit of random items finds it
  contexts:
    hardware: Field service work orders, maintenance logs and technician notes hold product feedback, but they are fragmented and messy (W17). One source only
    internal_pm: Internal customers speak through intake requests, office hours and Slack threads; the loudest channel gets served first (W18). One source only
    industry_notes:
      - "health care and FinTech: support tickets can hold PHI, account or card data. Remove it before the agent reads the export"
      - "data safety: use only an approved tool for customer feedback exports"
  proposed_lab:
    goal: Extend the course agent to tag a week of feedback against the market problem log and report what moved
    core_message: The hard part is not the tagging. It is the rule that makes the agent say "no fit" instead of guessing
    build_type: agent (extend the module 1 agent)
    core_path_no_connectors: yes. The learner uploads a CSV export of feedback
    data_safety: "Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)"
    platforms:
      claude: Skill with the tag list and counting rule
      chatgpt: Project with the tag list and CSV (E9 not verified)
      copilot: Agent with the tag list as an embedded file (E6)
      gemini: Gemini skill with the tag list (E8)
    stretch: Connect a feedback source (help desk, CRM) where the platform and company allow (not verified)
    registry_check: CAW-AI buyer voice watch reads public reviews of competitors on a monthly schedule. This row reads the company's own feedback channels into its own problem log. Different source, different agent, different output. Risk, Dan may see it as close; it must not use a scheduled-task slide (CAW-AI slide 9). Feeds the same log as mr-wf-01, which suits the one-agent design
  evidence:
    - id: W4
      claim: Feedback synthesis is manual; tagging and categorizing is slow, subjective and does not scale; insights live in different tools
      type: claim
      source: Data-Rich, Insight-Poor, Why Customer Feedback Isn't Driving Your Roadmap, Payton Christopher, ProductPlan
      url: https://www.productplan.com/blog/data-rich-insight-poor-why-customer-feedback-isnt-driving-your-roadmap
      source_date: 2026-06-02
      checked_on: 2026-11-20
      age_flag: false
      status: "verified"
      note: Roadmap tool vendor. Cites its State of Product Management 2026 report (more than 50% of PMs want AI to synthesize customer insights). Primary report not opened; do not use the figure yet
    - id: W5
      claim: Tagging feedback by hand takes hours each month, labels are applied inconsistently, and label meanings drift so trends become unreliable
      type: claim
      source: The 6 Hidden Costs of Tagging Customer Feedback by Hand in 2026, Enterpret
      url: https://www.enterpret.com/guides/the-6-hidden-costs-of-tagging-customer-feedback-by-hand-in-2026
      source_date: 2026-07-27
      checked_on: 2026-11-20
      age_flag: false
      status: "verified"
      note: Feedback analytics vendor. Hour figures are its own arithmetic, not data. Cites its own arXiv paper (not verified). Independent of W4
    - id: W17
      claim: Maintenance and field service data is product design feedback, but it is fragmented across work orders and logs and is messy
      type: claim
      source: Using maintenance data for better manufacturing product development, Jake Hall, MaintainX
      url: https://www.getmaintainx.com/blog/using-maintenance-data-for-better-manufacturing-product-development
      source_date: 2026-02-20
      checked_on: 2026-11-20
      age_flag: false
      status: "not verified"
      note: Maintenance software vendor. About process and plant equipment, not only sold products
    - id: W18
      claim: Platform PMs get internal feedback through intake, office hours and Slack; proximity bias decides who gets served
      type: claim
      source: The 6 Ways Platform PMs Gather Feedback From Internal and External Customers, Enterpret
      url: https://www.enterpret.com/guides/the-6-ways-platform-pms-gather-feedback-from-internal-and-external-customers
      source_date: 2026-11-04
      checked_on: 2026-11-20
      age_flag: false
      status: "verified (1 of 2 sources)"
      note: Same vendor as W5. No author named
  open_gaps:
    - A non-vendor source for the feedback tagging burden
    - Second source for the hardware and internal PM contexts
  gate_1_decision: ""

- id: mr-wf-04
  workflow: Code the open-text answers of each problem validation survey and report them by segment
  topic_area: Problem validation
  trigger_and_cadence: Each validation or market survey wave. Assumption, 2 to 6 waves a year, each with hundreds of open-text answers
  input: Survey export (closed answers, segment fields, open-text answers) and the code frame from the market problem log
  output: Coded open-text answers, counts by code and segment, a short table that sets the open-text codes next to the closed answers, and a flag report for the PM
  pm_decision_informed: Whether a market problem is urgent, pervasive and one buyers are willing to pay to solve, in a segment, to go forward (all three Pragmatic tests, PA-06)
  bottleneck:
    description: Coding open-ended answers by hand is tedious, slow and error-prone. Good practice needs two coders and a reviewer, so the open-text data is often skipped or skimmed
    pdlc_stage: Market
    focus_area: Market Problems
    sources: [W7, W8]
  scores:
    judgment: medium. The code frame is a judgment; applying it is rule-based
    repetition: high. Every answer and every wave
    ai_candidate: yes
  split:
    agent_does:
      - Code each answer against the code frame
      - Mark answers that fit no code
      - Count codes by segment
      - Compare open-text codes with the matching closed answers
      - Send flags to the PM
    pm_manages:
      brief: Job, code frame with definitions and examples, segment fields, output format
      quality_checks:
        - Each code has a supporting phrase from the answer
        - No code holds less than the minimum share set in the brief without a flag
        - A second coding pass on a 10% sample agrees with the first
      handoff_rules:
        - An open-text code that disagrees with the closed answer of the same respondent
        - More than 10% of answers in "other"
      audit: 15 random coded answers, checked by hand
    pm_decides:
      - The code frame
      - Which differences between segments are real
      - Whether the problem passes the validation bar
  ai_error_to_catch: Negation and sarcasm. "Setup was not hard at all" is coded as "setup is hard". The supporting phrase check passes because the words "setup" and "hard" are in the answer. The audit finds it
  contexts:
    hardware: Surveys of installers, distributors or field engineers. gap, no source found
    internal_pm: Internal tool satisfaction or needs surveys of employees. gap, no source found
    industry_notes:
      - "data safety: remove names and emails from the export before the agent reads it"
  proposed_lab:
    goal: Extend the course agent to code a survey wave and set the codes next to the closed answers
    core_message: Make the agent check itself with a second pass, then audit the cases where the checks agree for the wrong reason
    build_type: agent (extend the module 1 agent)
    core_path_no_connectors: yes. The learner uploads a survey CSV
    data_safety: "Use an approved tool only. No client data, PHI or PII in a tool the company has not approved. Get consent before you record an interview. Agree confidentiality for win/loss. Teaching point: an agent that keeps a log stores sensitive data longer than a one-off prompt (Dan, PA-03, 2026-11-22)"
    platforms:
      claude: Skill with the code frame
      chatgpt: Project with the code frame and CSV (E9 not verified)
      copilot: Agent with the code frame as an embedded file (E6). Large CSV limits not verified
      gemini: Gemini skill with the code frame (E8)
    stretch: Add a chart of codes by segment where the platform runs code
    registry_check: PDW-AI teaches validation basics (urgency, pervasiveness, willingness to pay) as concepts. This lab does not reteach them; it runs survey coding on batches. No overlap with CAW-AI or BPW-AI. Risk, survey design is not taught here
  evidence:
    - id: W7
      claim: Manual coding of open-ended survey text is tedious, time-consuming and error-prone; coding standards need two independent coders; AI cut manual coding labor by about 55% on one survey
      type: claim
      source: What Can AI Do for Survey Efficiency, Peter Einaudi, RTI International
      url: https://www.rti.org/insights/ai-survey-data-analysis
      source_date: 2025-06-23
      checked_on: 2026-11-20
      age_flag: true
      status: "verified"
      note: Non-vendor research institute. Older than 12 months; Dan decides. The 55% figure is one survey program before 2026 and fails the 2026 rule as a statistic
    - id: W8
      claim: Coding open-ended answers is one of the most tedious tasks in market research and needs human judgment
      type: claim
      source: Open ended survey coding, 10 steps for coding the responses, Savanta
      url: https://savanta.com/knowledge-centre/view/open-ended-survey-coding-10-steps-for-coding-the-responses/
      source_date: 2025-03-31
      checked_on: 2026-11-20
      age_flag: true
      status: "verified"
      note: Market research agency. First published 2015, updated 2025-03-31. Older than 12 months; Dan decides
  open_gaps:
