  scores:
    judgment: high. The choice is strategic
    repetition: low to medium. Each decision plus refreshes
    ai_candidate: partly. The agent assembles and costs; the PM decides
  split:
    agent_does:
    - Collect dated facts for each option from vendor documents
    - Build a 3-year cost for each option, with build, run and exit cost lines
    - List lock-in and data handling risks per option
