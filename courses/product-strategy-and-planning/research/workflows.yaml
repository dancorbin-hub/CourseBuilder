- id: sp-wf-08
  workflow: Assess each roadmap change request and send consistent trade-off notes to each audience
  topic_area: Strategy, roadmaps, planning
  capability_skill: 2.4 Product Vision and Roadmap (competencies 2.4C Assumption and Uncertainty Transparency and 2.4E Stakeholder Communication and Alignment)
  trigger_and_cadence: Each material change request or slip. Assumption, several times a month
  input: The change request, the current roadmap and its decision log, dependencies, team capacity, and the audience list
  output: An impact note (what moves, what it displaces, which dependencies), a decision log entry, a draft note per audience from one master change record, and a flag report
  pm_decision_informed: Accept, defer or reject the change, and what to tell each audience
  bottleneck:
    description: Shared roadmaps become de facto commitments, so every change means bad news delivered to several audiences in different words. Material changes need a change log, a versioned roadmap and one version for every plan, or unofficial roadmaps spread
    pdlc_stage: Planning
    focus_area: Stakeholder Management
    sources:
    - W20
    - W19
    sources_check: pass. W20 and W19 are independent and from 2026. W21 (2019) kept with age flag
  scores:
    judgment: medium. Impact analysis is rule-based; the trade-off is the PM's
    repetition: high. Every change request
    ai_candidate: 'yes'
  split:
    agent_does:
    - Find what the change displaces and which dependencies it hits
    - Write the impact note and the decision log entry
    - Draft one note per audience from the master change record
    - Check each note against the master record
    - Send flags to the PM
    pm_manages:
      brief: Job, the roadmap horizons and what each one promises, the audiences and what each needs, the rule that notes never add dates, output format
      quality_checks:
      - Each audience note matches the master change record
      - Each note uses the roadmap horizon words (Now, Next, Later), not new dates
      - The decision log entry has date, decider and reason
      handoff_rules:
      - A change that hits a dependency on another team
      - A change that breaks a commitment already given to a customer
      - Any note that needs a date the roadmap does not hold
      audit: All notes for 1 change per week, read side by side with the master record
    pm_decides:
    - Accept, defer or reject
    - The trade-off
    - What each audience hears
    ai_error_to_catch: Direction becomes a date. In the sales note the agent turns 'Next' into 'Q2' because sales asked for dates in past notes. The note matches the master record on content, and 'Q2' is not a horizon word but is accepted as a time frame, so the checks pass. The audit reads the notes side by side and finds a false delivery commitment
