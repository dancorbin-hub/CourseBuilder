        program; totals come from the sheet formulas; the planted 200% error appears before the fix; the rerun after
        reopen gives the same structure; no funding or strategy line. Also run the Copilot no-license path for module 1
    - id: P2
      name: Decision checkpoint and refresh with formulas
      used_in: [m2, m3]
      test: >-
        Module 2: the agent leaves every decision field blank, waits, and drafts replies only after decisions are sent.
        Module 3: the agent writes inputs to the business case sheet, reads results, and on the Q4 run reports what
        changed. Pass on each platform, including ChatGPT Work file output with formulas, Copilot upload and download in
        one session, and one Gemini skill run that asks for a Sheet (decision f2)
    - id: P3
      name: Hand-off between jobs and a monthly run across jobs
      used_in: [m4, m5]
      test: >-
        The change assessment reads the module 2 decision log and module 1 capacity table. Pass: it stops on the release
        plan item, writes no new date, and the commitment guard flags a date not on the release plan. The outcome job
        reads the module 3 baseline. Rebuild from kit-m5 in about 5 minutes. Run the Copilot no-license path one job at a time
